configuration as explicit, validate required settings at startup, and use separate test values. Never write production keys into example repositories. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport os\nmode=os.environ.get(\"NORTHSTAR_MODE\",\"development\")\nassert isinstance(mode,str)\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Reading a secret from an environment variable does not make it safe to log.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the linux workshop.\n\n**Review question:** Which action improves configuration safety? Environment variables configure development services but are not a secure secret store. Reading a secret from an environment variable does not make it safe to log.\n\n## 6. Reproducible developer environments\n\nA clean setup document should bring a teammate to a passing baseline without undocumented global packages. Pin versions, explain run commands and isolate test data. Containers and Codespaces help but do not replace documentation and offline understanding. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport sys\nassert sys.version_info.major==3\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A developer environment that only runs on its author’s machine is not reproducible.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the linux workshop.\n\n**Review question:** What indicates reproducible onboarding? A clean setup document should bring a teammate to a passing baseline without undocumented global packages. A developer environment that only runs on its author’s machine is not reproducible.\n","# Networking, sockets & service operations\n\nUnderstand the packet-to-API stack and its trust boundaries: IP and ports, TCP stream framing, TLS, HTTP and proxies. Real network faults reveal why a green socket is not the same as a correct service.\n\n## Learning environment\n\nUse a local Python 3 runtime, avoid production secrets, and document input and output for every claim. The learner workshop deliberately starts with defects and its contract tests are meant to fail until repaired. Never expose training services on a public interface.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Observability across layers\n\nDiagnose requests using layers: DNS resolution, TCP connection, TLS handshake, HTTP status and business result. Successful connectivity does not mean correct authorization. Gather evidence at the narrowest useful layer and avoid collecting secrets. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport urllib.parse\nassert urllib.parse.urlsplit(\"http://127.0.0.1:8765/health\").path==\"/health\"\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Ping success is neither proof an HTTPS endpoint works nor proof its data is correct.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the networking workshop.\n\n**Review question:** Which step best isolates an HTTP 403 issue? Diagnose requests using layers: DNS resolution, TCP connection, TLS handshake, HTTP status and business result. Ping success is neither proof an HTTPS endpoint works nor proof its data is correct.\n\n## 6. HTTP proxies and deployment edges\n\nReverse proxies can terminate TLS, enforce limits and forward requests. Applications must distrust client-supplied forwarded headers unless they come from trusted infrastructure. Test origin binding and health checks after deploying behind a proxy. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nheaders={\"X-Forwarded-For\":\"203.0.113.7\"}\nassert \"X-Forwarded-For\" in headers\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Never trust X-Forwarded-For from arbitrary direct clients for security decisions.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the networking workshop.\n\n**Review question:** When are forwarded headers trustworthy? Reverse proxies can terminate TLS, enforce limits and forward requests. Never trust X-Forwarded-For from arbitrary direct clients for security decisions.\n","# Data structures & algorithms\n\nChoose and justify collections and complexity using authentic account, job-queue and dependency examples. Practice invariants and performance before using these concepts in banking workflows.\n\n## Learning environment\n\nUse a local Python 3 runtime, avoid production secrets, and document input and output for every claim. The learner workshop deliberately starts with defects and its contract tests are meant to fail until repaired. Never expose training services on a public interface.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Heaps and priority queues\n\nA heap supports efficiently selecting a minimum-priority element while maintaining partial order. Use it for job scheduling with explicit priorities; understand that equal-priority elements need a tie breaker if stable order matters. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport heapq\nh=[(2,\"review\"),(1,\"alert\")];heapq.heapify(h)\nassert heapq.heappop(h)[1]==\"alert\"\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A heap is not a fully sorted list and should not be treated as one.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the data-structures workshop.\n\n**Review question:** What workload suits a heap? A heap supports efficiently selecting a minimum-priority element while maintaining partial order. A heap is not a fully sorted list and should not be treated as one.\n\n## 6. Complexity and space budgeting\n\nAnalyze both runtime and memory across scale. Loading a 20 GB log into a list is risky, while streaming can bound memory but may add I/O and prohibit rewinding. Document assumptions about maximum input size and service concurrency. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nfrom itertools import islice\nsmall=list(islice(range(1000000),3));assert small==[0,1,2]\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** An O(n) algorithm can be infeasible if it retains every item in memory.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the data-structures workshop.\n\n**Review question:** Which design bounds memory for large log processing? Analyze both runtime and memory across scale. An O(n) algorithm can be infeasible if it retains every item in memory.\n","# Software architecture & system design\n\nTrace code and data through explicit modules, isolate transport from business policy, and reason about migration, failure modes and reliability before implementing advanced service changes.\n\n## Learning environment\n\nUse a local Python 3 runtime, avoid production secrets, and document input and output for every claim. The learner workshop deliberately starts with defects and its contract tests are meant to fail until repaired. Never expose training services on a public interface.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Modular monolith versus services\n\nSeparating deployable services creates failure modes, network boundaries and operational overhead. Start with well-defined modules in one deployable application; split only when scaling, isolation or team ownership justifies the cost. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ncomponents=[\"api\",\"domain\",\"repository\"]\nassert len(components)==3\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Microservices do not automatically improve maintainability or security.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the architecture workshop.\n\n**Review question:** When is a modular monolith often preferable? Separating deployable services creates failure modes, network boundaries and operational overhead. Microservices do not automatically improve maintainability or security.\n\n## 6. Release planning and rollback design\n\nA production change should define acceptance criteria, monitoring, deployment order, migration compatibility and rollback limits. For irreversible data changes, rollback may require forward-fix rather than reverting code. Capture decision records for important tradeoffs. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nrelease={\"build\":\"1.2\",\"migration\":\"additive\",\"rollback\":\"revert API\"}\nassert release[\"migration\"]==\"additive\"\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A Git revert does not reverse external payments or destructive database changes.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the architecture workshop.\n\n**Review question:** What belongs in a release plan? A production change should define acceptance criteria, monitoring, deployment order, migration compatibility and rollback limits. A Git revert does not reverse external payments or destructive database changes.\n"];

nk.py","app/server.py","tests/test_sprint2.py"],"learning":"Object IDs are not authorization. For each read, verify the caller is entitled to the resource. Test an account owner and an unrelated account; avoid leaking sensitive identifiers through failure messages.","context":"A security tester observed that requesting /accounts/2 as alice returned a record belonging to bob.","acceptance":["Owner can retrieve the account.","Other actors receive a 403 without account contents.","HTTP contract test reproduces and prevents the regression."],"commands":["python3 -m unittest tests.test_sprint2 -v","curl -i -H \"X-Demo-User: alice\" http://127.0.0.1:8765/accounts/2"],"hint":"Find the account first, then compare owner with actor before returning fields.","reviewPrompt":"Why must authorization be enforced server-side even when the UI hides someone else’s account?"},{"id":"NS-C404","sprint":2,"title":"Parameterize account search","role":"Product security apprentice","level":"Intermediate","depends":["NS-C403"],"topics":["SQL injection","bound parameters","query planning"],"files":["app/bank.py","tests/test_sprint2.py"],"learning":"Never splice untrusted text into SQL. Parameterized queries separate SQL syntax from data. Apply the tenant authorization predicate before returning records and test adversarial strings.","context":"The accounts-search handler was built in a hurry. A reviewer found string interpolation in its query construction.","acceptance":["Search treats strings as data instead of executable SQL.","Results cannot cross the account owner boundary.","Normal search and adversarial search contract tests pass."],"commands":["python3 -m unittest tests.test_sprint2 -v"],"hint":"Use ? placeholders and pass values in a tuple; filter by owner in the same query.","reviewPrompt":"What do parameters protect, and what risks remain with dynamically chosen column names?"},{"id":"NS-C405","sprint":3,"title":"Enforce atomic transfers and insufficient-funds handling","role":"Payments engineer","level":"Intermediate","depends":["NS-C404"],"topics":["ACID","SQLite transactions","invariants"],"files":["app/bank.py","tests/test_sprint3.py"],"learning":"A transfer is a single logical unit: debit and credit must commit together or not at all. Use a transaction and protect the account balance invariant. Include ownership checks and concurrency behavior.","context":"Customers report that a failed transfer sometimes subtracts money before raising an error; the payment team wants a root-cause explanation.","acceptance":["Insufficient funds and foreign sources are rejected before funds move.","Successful transfers preserve the system-wide total.","No partial debit remains after a failed operation."],"commands":["python3 -m unittest tests.test_sprint3 -v"],"hint":"BEGIN IMMEDIATE, check the source balance and owner, and commit both updates in one transaction.","reviewPrompt":"What race arises when two transfers read the same opening balance simultaneously?"},{"id":"NS-C406","sprint":3,"title":"Make transfer retries idempotent","role":"Payments engineer","level":"Advanced","depends":["NS-C405"],"topics":["idempotency keys","unique constraints","API retry semantics"],"files":["app/bank.py","app/server.py","tests/test_sprint3.py"],"learning":"Networks fail after servers commit but before clients receive the response. Clients retry. A payment request must not execute twice when the same key and payload are repeated.","context":"Support found that retrying an interrupted payment duplicated the transfer.","acceptance":["A matching retry returns the original transfer ID and does not move funds again.","Reusing the same key with different transfer parameters fails.","The HTTP endpoint distinguishes created (201) from replay (200)."],"commands":["python3 -m unittest tests.test_sprint3 -v"],"hint":"The UNIQUE(actor,request_key) constraint only helps if you check for an earlier matching row before applying balances.","reviewPrompt":"Why should idempotency keys be scoped by client or account rather than globally?"},{"id":"NS-C407","sprint":4,"title":"Fix cross-customer transaction history","role":"Product security apprentice","level":"Intermediate","depends":["NS-C406"],"topics":["SQL JOIN","least privilege","data privacy"],"files":["app/bank.py","tests/test_sprint4.py"],"learning":"Never assume an endpoint is safe because it is read-only. Restrict result sets with owner-aware joins and write negative access tests.","context":"An audit review discovered an account statement endpoint that could reveal transfer records from unrelated customers.","acceptance":["History is scoped to the authenticated owner of each source account.","New customers cannot see the history of an unrelated account.","HTTP tests confirm that empty histories return an empty list."],"commands":["python3 -m unittest tests.test_sprint4 -v"],"hint":"Join the transfer source to accounts and bind a.owner to the actor.","reviewPrompt":"What additional access-control decisions apply when a user has joint ownership of an account?"},{"id":"NS-C408","sprint":4,"title":"Protect audit logs and publish release evidence","role":"Security software engineer","level":"Advanced","depends":["NS-C407"],"topics":["structured logs","secrets hygiene","CI","technical writing"],"files":["app/bank.py","app/server.py","tests/test_sprint4.py","templates/engineering-report.md"],"learning":"Log useful security decisions without recording secrets or request bodies. A professional release requires reproducible test evidence, a risk statement, and a code-review-ready change summary.","context":"A reviewer notices tokens and raw transfer request bodies in debug output. The team needs a privacy-safe audit event and a deployment decision.","acceptance":["Audit event fields contain bounded, non-sensitive metadata only.","Malformed HTTP transfer payloads produce controlled 4xx errors, not stack traces.","Prepare a PR summary, testing record, risk analysis and deployment/rollback note."],"com   var RESIDENCY_LESSONS=["# Service foundations\n\n## Python modules and data flow\n\nTrace a request from BaseHTTPRequestHandler through Bank methods into SQLite. Understand Python packages, argument validation and clear contracts. List/dict structures represent JSON and rows, but only explicit serialization is exposed.\n\n## HTTP and safe API design\n\nLearn GET and POST, status codes 200/201/400/403/404/409, JSON content types, how an API client reacts to changing schemas. A 200 response alone does not mean the correct payload was returned.\n\n## SQL and pagination\n\nUse SELECT, WHERE, ORDER BY and LIMIT. Filter by owner before ordering/limiting so results never include another tenant. Verify edge cases in unittest and via curl.\n\n## Engineering workflow\n\nInspect repo, run baseline smoke, reproduce failing test, patch on dedicated branch, document behavior, ask for review.\n\n## Checkpoint\n\nWrite two examples of a failure mode and a test that would detect each one.\n\n## Workstation lab: follow a request\n\nStart `python3 -m app.server --port 8765` and use curl from a second terminal. The `ThreadingHTTPServer` receives a request; its handler parses the path and query string; `Bank` owns the database logic; SQLite stores synthetic rows. Trace one GET end to end. In your report, draw a four-box diagram labeled client, handler, domain operation, database. Record the actual HTTP status and JSON fields. A handler that returns a successful status but wrong JSON violates its contract.\n\n## Python foundations in this codebase\n\nRead `class Bank`, the exception hierarchy, and `connect()`. A context manager handles commit/rollback/close. A dictionary serializes into a JSON object, while a list serializes into a JSON array. A tuple passed to a parameterized SQL call provides individual bound values. Explain the difference between a programming exception and a business error returned as a 4xx response.\n\n## Database design and query cost\n\n`accounts` has an integer primary key, an owner, and a balance in integer cents. Why cents rather than floats? How could ORDER BY and LIMIT behave without a stable order? Analyze the difference between limiting all rows and limiting just the requesting user's rows. A future real API might use cursor-based pagination and richer indexes, but a correct bounded query is the first requirement.\n\n## Ticket handoff exercise\n\nBefore editing, write (1) the reproduction command, (2) the expected output, (3) the actual output, (4) the likely code path, and (5) your smallest safe proposed change. Add a negative test for invalid input. Create a branch, commit, and write a one-paragraph PR explanation that a new teammate could follow.\n","# APIs and application security\n\n## Identity is not authorization\n\nThe X-Demo-User header is an insecure stand-in only. In production validate an authenticated principal; check object ownership for every resource. OWASP API1:2023 describes BOLA.\n\n## SQL parameters\n\nDo not interpolate user text into query strings. Bound parameters keep data separate from SQL syntax. Add negative tests with quote and comment characters.\n\n## Data structures and API response modeling\n\nCompare database rows, dicts and JSON arrays. Make explicit allowlists for response fields. Think through pagination and error semantics.\n\n## Design discussion\n\nDocument which trusted identity provider and access control model a real bank would require. Identify all routes that access accounts.\n\n## Checkpoint\n\nWrite two examples of a failure mode and a test that would detect each one.\n\n## What is the trust boundary?\n\nThe service reads `X-Demo-User`, which any caller can fabricate. This is deliberately NOT an authentication system. In a production application, a trusted session or validated token would identify the caller. That principal must then be authorized for each operation. Object-level authorization cannot rely on a UI control being hidden. Draw the path from a principal to account ownership and the database predicate that enforces the check.\n\n## BOLA reproduction\n\nCompare `curl -i -H 'X-Demo-User: alice' http://127.0.0.1:8765/accounts/1` with the same request for `/accounts/2`. The first should succeed; the second should deny access. The test is most valuable when it proves both a permitted and a denied case. Explain the difference between authentication (who are you?) and authorization (can you access this account?).\n\n## Parameterized query reasoning\n\nA search string such as `1` is data. A string containing quotes and SQL comment characters should also be data. SQL parameter binding prevents user text from becoming query syntax. The owner filter must still be enforced: parameterization alone is not sufficient for multi-tenant access control. In your design notes, identify other endpoints using database IDs that would need the same policy.\n\n## Security review methodology\n\nReview the request interface, trust boundary, data access, output fields, and negative tests. Write a small threat model: asset, actor, entry point, failure mode, and mitigation. In the PR, explain whether you would return 403 or 404 for unauthorized object access and what information each response reveals. Include tradeoffs instead of treating all security choices as universal.\n","# Transaction design\n\n## ACID and invariants\n\nA transfer must preserve total funds and never produce negative balances. Debit and credit belong in one atomic transaction. Explain how a rollback protects invariants.\n\n## Concurrency control\n\nA check-then-write sequence is vulnerable to races. SQLite BEGIN IMMEDIATE serializes writers for this exercise. In production, discuss stronger concurrency and scaling needs.\n\n## Idempotent retries\n\nA client can retry after a lost response, so repeated keys must return the original result without repeating side effects. A reused key with different parameters should be rejected.\n\n## Testing scenarios\n\nTest success, insufficient funds, foreign account, repeat request and conflicting payload. Use temporary databases for isolation.\n\n## Checkpoint\n\nWrite two examples of a failure mode and a test that would detect each one.\n\n## Money as integers and invariants\n\nBalances are modeled as integer cents. Before modifying state, write down the invariant: for a successful internal transfer, total money across both accounts does not change. No balance becomes negative if the transfer is rejected for insufficient funds. Consider what occurs if a debit is committed and the credit fails. A unit of business work must not be split across multiple independent commits.\n\n## ACID and a concrete race\n\nSQLite can acquire a write lock with `BEGIN IMMEDIATE`. Inside the transaction, validate the source account, its owner, destination existence and available funds, then update both balances. Two concurrent transactions that each read the old balance before writing can overspend if the check and debit are not serialized. Sketch the interleaving of two $70 transfers from a $100 account, then explain how the chosen transaction boundary prevents it in this small exercise.\n\n## Network retries and idempotency\n\nA client can submit a transfer, the server can commit it, and the response can be lost. Retrying without an idempotency key would execute the operation again. A unique `(actor, request_key)` constraint creates a durable replay boundary. It must store enough details to detect a repeated key with a different amount or destination. A successful replay returns the original transfer identifier without updating accounts. Distinguish an initial `201 Created` response from a replayed `200 OK` response.\n\n## Validation matrix\n\nConstruct a table with success, insufficient funds, foreign source, duplicate key same payload, duplicate key different payload, and malformed amount. List the expected HTTP status, database effect, and test name for each case. Confirm expected rollback behavior through a fresh test database. Do not weaken acceptance tests to force a green result.\n","# Testing and release\n\n## Least privilege and joins\n\nA history report must never return other customers’ data. JOIN source accounts against the actor and test the negative path.\n\n## Safe observability\n\nRecord a minimal structured event (operation, result and a bounded safe actor label). Never log secrets, raw request bodies or credentials.\n\n## CI and regression\n\nSeparate infrastructure smoke checks from learner acceptance tests, and do not hide expected starter defects. Every fix requires a regression test and successful full suite.\n\n## Code review\n\nA strong PR explains root cause, alternative approaches, observed test results, risk and rollback. An automated reviewer can coach structure, but cannot verify that code was implemented correctly.\n\n## Checkpoint\n\nWrite two examples of a failure mode and a test that would detect each one.\n\n## Data minimization extends beyond writes\n\nA read-only endpoint can still be a security defect. Join transfer history to the source account and filter by the requesting actor to prevent cross-customer leakage. Test an account with transactions, an account with none, and a caller who owns no matching source account. Consider whether destination owners should see the same record and state your policy explicitly.\n\n## Security observability without secrets\n\nAudit logs should record what kind of operation occurred and its outcome, not entire request bodies, passwords, raw authentication tokens, or account payloads. Design a bounded set of permitted keys and add a test with a dummy token to prove it never appears in the event. Structured events enable aggregation while reducing unnecessary personal data exposure. Document remaining threats: malicious administrators, forged demo identities, inadequate retention, and loss of event integrity.\n\n## Code review as engineering communication\n\nYour PR should contain a precise reproduction, root cause, implementation summary, expected and observed tests, security impact, deployment risk and rollback. Separate evidence you actually obtained from assumptions. Respond to review comments by explaining alternatives, not by arguing that the tests happen to be green. A deterministic portal review checks document completeness only; independent verification still requires actual code and test evaluation.\n\n## Design review exercise\n\nDraw your minimal service architecture and describe how you would change it for production: real identity, authorization policy, migration tooling, a server framework, observability, structured error responses, concurrency and database operational controls. Which of those concerns are intentionally out of scope for this educational service? This is a bridge from a small Python program into larger secure backend systems, not a production banking design.\n"];

  // Small escape-first Markdown subset for authored, bundled guides. No external HTML is evaluated.
  function fGuideHTML(markdown){
    var result=[],lines=markdown.split('\n'),code=false,list=false;
    function closeList(){if(list){result.push('</ul>');list=false;}}
    lines.forEach(function(line){
      if(line.startsWith('```')){closeList();result.push(code?'</code></pre>':'<pre class="f-code"><code>');code=!code;return;}
      if(code){result.push(esc(line)+'\n');return;}
      if(!line.trim()){closeList();return;}
      var text=esc(line).replace(/`([^`]+)`/g,'<code>$1</code>');
      if(/^###? /.test(line)){closeList();result.push('<h3>'+text.replace(/^#+\s*/, '')+'</h3>');}
      else if(/^# /.test(line)){closeList();result.push('<h2>'+text.replace(/^#\s*/, '')+'</h2>');}
      else if(/^[-*] /.test(line)){if(!list){result.push('<ul>');list=true;}result.push('<li>'+text.slice(2)+'</li>');}
      else if(/^\d+\. /.test(line)){closeList();result.push('<p>'+text+'</p>');}
      else {closeList();result.push('<p>'+text+'</p>');}
    });closeList();if(code)result.push('</code></pre>');return result.join('');
  }

    { id:"triage", name:"Linux Service Triage", ticketId:"NS-210", icon:"wrench",

         check:function(sh){var r=sh.run("telemetryd --stress");return r.code===0;}}

    { id:"networking", name:"Network & Protocol Diagnostics", ticketId:"NS-142", icon:"net",
      blurb:"The api-gateway can't reach auth. Diagnose DNS and the upstream port, then restore the connection.",

         hints:["<code>dig auth.northstar.internal</code> shows what the name resolves to; <code>ss -ltn</code> shows what's actually listening.","They don't match — that's the problem. The auth service is the <code>10.0.3.x:8443</code> line.","resolved_ip is 10.0.3.99; listening is 10.0.3.12:8443. Write both with <code>echo ... &gt; answers/net1.txt</code> and <code>&gt;&gt;</code>."],
         check:function(sh){var t=(sh.fileContent("answers/net1.txt")||"").replace(/\s+/g,"");return /resolved_ip=10\.0\.3\.99/.test(t)&&/listening=10\.0\.3\.12:8443/.test(t);}},
        {id:"n2",title:"Fix DNS resolution",lv:"L2",
         brief:"The name points at the wrong host. Edit <code>etc/hosts</code> so <code>auth.northstar.internal</code> resolves to the real auth IP, and confirm with <code>dig</code>.",

         check:function(sh){var h=sh.fileContent("etc/hosts")||"";return /10\.0\.3\.12\s+auth\.northstar\.internal/.test(h);}},
        {id:"n3",title:"Restore the connection",lv:"L2",
         brief:"The gateway still can't connect. Fix the upstream port in <code>etc/gateway.conf</code> to match what auth actually listens on, until <code>gateway --check</code> is healthy.",

    { id:"automation", name:"Shell Scripting & Automation", ticketId:"NS-168", icon:"script",
      blurb:"Write a log-summary script, make it executable, and schedule it to run on a cron.",
      make:function(){ var sh=createShell(); installAutomation(sh); return sh; },
      seedNote:"Logs in logs/. Write scripts in bin/. Run with bash, make executable with chmod +x, schedule with crontab -e.",
      tasks:[
        {id:"a1",title:"Write the summary script",lv:"L1",
         brief:"Create <code>bin/summary.sh</code> that takes a log file as <code>$1</code> and prints exactly two lines: <code>lines=&lt;total lines&gt;</code> and <code>errors=&lt;count of ERROR lines&gt;</code>. Develop against <code>logs/service.log</code>; run with <code>bash bin/summary.sh logs/service.log</code>.",
         hints:["Open a new file with <code>edit bin/summary.sh</code>. Use <code>$1</code> for the argument.","<code>wc -l &lt; $1</code> counts lines; <code>grep -c ERROR $1</code> counts error lines. Put each in a <code>$(...)</code>.","<code>#!/bin/bash</code><br><code>f=$1</code><br><code>echo lines=$(wc -l &lt; $f)</code><br><code>echo errors=$(grep -c ERROR $f)</code>"],
         check:function(sh){
           function want(p){var c=sh.fileContent(p)||"";var ls=c.split("\n");if(ls[ls.length-1]==="")ls.pop();return "lines="+ls.length+"\nerrors="+ls.filter(function(l){return /ERROR/.test(l);}).length;}
           if(!sh.fileContent("bin/summary.sh"))return false;
           return sh.run("bash bin/summary.sh logs/service.log").out===want("logs/service.log")
               && sh.run("bash bin/summary.sh logs/audit.log").out===want("logs/audit.log");}},
        {id:"a2",title:"Make it executable",lv:"L2",
         brief:"Make the script runnable on its own and invoke it directly: <code>./bin/summary.sh logs/service.log</code> should work (not just via <code>bash</code>).",
         hints:["Scripts need an execute bit before <code>./</code> will run them.","<code>chmod +x bin/summary.sh</code>, then <code>./bin/summary.sh logs/service.log</code>.","Without the execute bit you'll get 'Permission denied'."],
         check:function(sh){var m=sh.fileMode("bin/summary.sh");if(!m||!(parseInt(m[0],10)&1))return false;return sh.run("./bin/summary.sh logs/service.log").code===0;}},
        {id:"a3",title:"Schedule it",lv:"L2",
         brief:"Schedule the script to run automatically. Add a crontab entry (a 5-field schedule) that runs <code>summary.sh</code>. Edit your crontab with <code>crontab -e</code>, then confirm with <code>crontab -l</code>.",
         hints:["<code>crontab -e</code> opens your crontab in the editor; <code>crontab -l</code> lists it.","A cron line is five schedule fields then the command, e.g. <code>0 2 * * * /home/sam/lab/bin/summary.sh logs/service.log</code> for 2am daily.","Save in the editor (Ctrl/⌘ S), then <code>crontab -l</code> should show your line."],
         check:function(sh){var r=sh.run("crontab -l");if(r.code!==0)return false;return /^\s*\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+.*summary\.sh/m.test(r.out);}}
      ],
      review:{branch:"feat/log-summary-automation",q:"Solid — the script generalizes and it's scheduled. One thing I always ask about cron jobs: this writes no output anywhere and emails nothing. If it starts failing silently at 2am, how would anyone find out?"} },
    { id:"cprog", name:"C Programming — Log Helpers", ticketId:"NS-173", icon:"code",
      blurb:"Three C functions in src/logutil.c each have a bug. Find and fix them until the tests pass.",
      make:function(){ var sh=createShell(); installC(sh); return sh; },
      seedNote:"Edit src/logutil.c. Compile with gcc, run the suite with make test. Each function has one real bug.",
      tasks:[
        {id:"c1",title:"Compile cleanly",lv:"L1",
         brief:"Open <code>src/logutil.c</code> and read it. Get it to compile with no errors: <code>gcc -Wall src/logutil.c</code> should exit cleanly. (It already does — this is your starting point; confirm it.)",
         hints:["<code>edit src/logutil.c</code> to read the three functions.","<code>gcc -Wall src/logutil.c</code> — a clean compile exits 0 and prints nothing.","If you introduce a syntax error while editing, gcc will point at it. Keep it compiling."],
         check:function(sh){return sh.run("gcc -Wall src/logutil.c").code===0;}},
        {id:"c2",title:"Fix count_char and to_int",lv:"L2",
         brief:"<code>count_char</code> misses the last character; <code>to_int</code> doesn't reject non-digits. Fix both so their tests pass. Run <code>make test</code> to see which cases fail.",
         hints:["<code>make test</code> shows the first failing case per function — look at the input and expected output.","count_char's loop bound stops one short of the end. to_int needs to check each char is between '0' and '9' and return -1 otherwise.","count_char: <code>i &lt; strlen(s)</code> (or loop while <code>s[i] != 0</code>). to_int: add <code>if (s[i] &lt; '0' || s[i] &gt; '9') return -1;</code> before using the digit."],
         check:function(sh){var r=sh.cTestResults();if(!r||!r.compiled)return false;return r.results.count_char.passed===r.results.count_char.total && r.results.to_int.passed===r.results.to_int.total;}},
        {id:"c3",title:"Fix longest_run",lv:"L2",
         brief:"<code>longest_run</code> should return the longest run of <i>consecutive</i> matching characters, but the counter never resets when the run breaks. Fix it so <code>make test</code> passes everything.",
         hints:["Trace it on \"aabbbbac\": the counter keeps climbing even after the run of b's ends.","When the current char isn't c, the running count must go back to 0.","<code>if (s[i] == c) cur++; else cur = 0;</code>"],
         check:function(sh){var r=sh.cTestResults();if(!r||!r.compiled)return false;return r.results.longest_run.passed===r.results.longest_run.total;}}
      ],
      review:{branch:"fix/logutil-bugs",q:"All green. The off-by-one in count_char is the classic one — it read the whole string eventually, so it compiled and ran fine, it just gave the wrong answer. How would you catch a bug like that before it ships, given the compiler was perfectly happy with it?"} },
    { id:"wininternals", name:"Windows Internals — Triage", ticketId:"NS-191", icon:"win",

    { id:"detection", name:"Detection Engineering", ticketId:"NS-205", icon:"shield",
      blurb:"Write detection rules over an auth log: catch a brute-force attack without alerting on a noisy service account.",
      make:function(){ var sh=createShell(); installDetection(sh); return sh; },
      seedNote:"Log in logs/auth.jsonl. Write rules in rules/detections.txt; run detect. Goal: catch the real attack, no false positives.",
      tasks:[
        {id:"de1",title:"Flag failed logins",lv:"L1",
         brief:"Write a rule in <code>rules/detections.txt</code> that alerts on every <code>login_failed</code> event, then run <code>detect</code>. This is your baseline signal.",
         hints:["<code>edit rules/detections.txt</code>. A rule is a <code>rule:</code> line plus one or more <code>when:</code> conditions.","<code>when: event == login_failed</code> matches the field <code>event</code> against the value.","<br><code>rule: auth-failure</code><br><code>when: event == login_failed</code><br>then run <code>detect</code>."],
         check:function(sh){var r=sh.detRun("visible");if(!r.ok)return false;var t=sh.detTruth("visible");return r.rules.some(function(x){return x.kind==="event"&&JSON.stringify(x.set)===JSON.stringify(t.allFailed);});}},
        {id:"de2",title:"Catch repeated failures",lv:"L2",
         brief:"Raw failures are too noisy. Add a rule that groups failed logins <code>by user</code> and alerts when a user has <b>5 or more</b>. Run <code>detect</code> — it should flag two accounts.",
         hints:["Add <code>group_by: user</code> and <code>count: >= 5</code> to a rule whose <code>when</code> matches failed logins.","This aggregates per user instead of per event.","<br><code>rule: brute-force</code><br><code>when: event == login_failed</code><br><code>group_by: user</code><br><code>count: >= 5</code>"],
         check:function(sh){var r=sh.detRun("visible");if(!r.ok)return false;var t=sh.detTruth("visible");return r.rules.some(function(x){return x.kind==="group"&&JSON.stringify(x.set)===JSON.stringify(t.thresholdUsers);});}},
        {id:"de3",title:"Add a high-fidelity rule",lv:"L2",
         brief:"One of those two accounts is a misconfigured service that just fails a lot — not an attack. The real attacker's failures were <i>followed by a successful login</i>. Keep your earlier rules and <b>add a new one</b> that fires on the attack only, using <code>followed_by</code>. It must still work on tomorrow's logs, not just today's.",
         hints:["Leave your previous rules in place (a blank line separates rules). The difference that isolates the attacker isn't the name — it's what happened next: they got in.","Add a separate rule with <code>followed_by: event == login_success</code> so it only fires when a success follows the failures for that user.","<br><code>rule: brute-force-confirmed</code><br><code>when: event == login_failed</code><br><code>group_by: user</code><br><code>count: >= 5</code><br><code>followed_by: event == login_success</code>. Don't hardcode the username — the grader checks a second, hidden log."],
         check:function(sh){var rv=sh.detRun("visible"),rh=sh.detRun("hidden");if(!rv.ok||!rh.ok)return false;var tv=sh.detTruth("visible"),th=sh.detTruth("hidden");
           return rv.rules.some(function(x){return x.kind==="group"&&JSON.stringify(x.set)===JSON.stringify(tv.attackUsers)
             && rh.rules.some(function(y){return y.name===x.name&&JSON.stringify(y.set)===JSON.stringify(th.attackUsers);});});}}
      ],
      review:{branch:"detect/brute-force-rule",q:"Nice — precision and recall both right, and it held up on the second log. The thing that separated the attacker from the noisy service was the follow-on success. What would you add to this rule to catch a *slow* brute force that spreads its failures across days to stay under the count?"} },
    { id:"linuxint", name:"Linux Internals — Host Triage", ticketId:"NS-187", icon:"cpu",
      blurb:"A host is misbehaving: the disk is full but nothing's big, processes are piling up, and something's listening that shouldn't be. Read the kernel's view and explain it.",
      make:function(){ var sh=createShell(); installLinux(sh); return sh; },
      seedNote:"Read-only range. Tools: ps, lsof <pid>, procstat <pid>, df, du <dir>, mounts. Write findings to answers/.",
      tasks:[
        {id:"li1",title:"Find where the disk went",lv:"L2",
         brief:"<code>df</code> says <code>/var</code> is 97% full, but <code>du /var/log</code> only finds about 1.4G. Find the process holding the missing space and write <code>pid=&lt;n&gt;</code> to <code>answers/l1.txt</code>.",

         check:function(sh){var t=sh.fileContent("answers/l2.txt")||"";return /parent\s*=\s*2201\b/.test(t)&&!/22(40|41|42)/.test(t);}},

         check:function(sh){var t=sh.fileContent("answers/l3.txt")||"";return /pid\s*=\s*3177\b/.test(t)&&/remote\s*=\s*198\.51\.100\.23\b/.test(t);}}
      ],
      review:{branch:"triage/plt-host-7",q:"Good triage, and you handed the odd listener off instead of killing it. The disk one is a classic: du and df disagree because a deleted file is still open. What would you change in the logrotate setup so this doesn't happen again?"} },
    { id:"secure", name:"Secure Coding — Input Handling", ticketId:"NS-221", icon:"lock",
      blurb:"The config loader's parsing helpers trust their input. Harden them so no input can read past a buffer or slip an out-of-range value through.",
      make:function(){ var sh=createShell(); installSecure(sh); return sh; },
      seedNote:"Edit src/netparse.c. make test runs adversarial inputs with an out-of-bounds sanitizer. Fixes must be real validation — hidden cases run too.",
      tasks:[
        {id:"sc1",title:"Stop the out-of-bounds read",lv:"L2",
         brief:"<code>checksum(s, len)</code> reads <code>len</code> bytes no matter how long <code>s</code> is. Run <code>make test</code> — the sanitizer catches it reading past the end. Make it return <code>-1</code> when <code>len</code> is negative or longer than the string.",
         hints:["The caller controls <code>len</code>. Never trust a length that comes from outside — check it against the real size first.","Validate before the loop, not inside it.","<code>if (len &lt; 0 || len &gt; strlen(s)) return -1;</code> right after <code>int sum = 0;</code>"],
         check:function(sh){var r=sh.secResults();return !!(r&&r.compiled&&r.results.checksum.passed===r.results.checksum.total);}},
        {id:"sc2",title:"Range-check the port",lv:"L2",
         brief:"<code>parse_port</code> rejects non-digits but happily returns <code>99999</code> or <code>0</code>. A port is 1–65535. Return <code>-1</code> for anything outside that range.",
         hints:["Two missing checks: too big, and too small.","Checking inside the loop also stops runaway values on very long inputs.","Inside the loop after updating p: <code>if (p &gt; 65535) return -1;</code>; after the loop: <code>if (p &lt; 1) return -1;</code>"],
         check:function(sh){var r=sh.secResults();return !!(r&&r.compiled&&r.results.parse_port.passed===r.results.parse_port.total);}},
        {id:"sc3",title:"Clamp the copy length",lv:"L2",
         brief:"<code>copy_len(s, max)</code> tells the caller how many bytes to copy into a buffer of size <code>max</code> — and ignores <code>max</code>. That's how buffer overflows start. Never return more than <code>max</code>; return 0 if <code>max</code> is negative.",
         hints:["The answer is the smaller of the string length and max.","Handle the negative case first.","<code>if (max &lt; 0) return 0; int n = strlen(s); if (n &gt; max) return max; return n;</code>"],
         check:function(sh){var r=sh.secResults();return !!(r&&r.compiled&&r.results.copy_len.passed===r.results.copy_len.total);}}
      ],
      review:{branch:"harden/netparse",q:"All three now treat input as hostile, which is the habit we want. The sanitizer found the checksum read, but nothing flagged copy_len — it returned a wrong number without crashing. How would you make sure bugs like that one get caught in CI?"} },
    { id:"codereview", name:"Code Review — Pull Requests", ticketId:"NS-230", icon:"review",
      blurb:"Three teammates' PRs are waiting on you. Read each diff, run its tests, and approve it or request changes, with a reason.",
      make:function(){ var sh=createShell(); installCodeReview(sh); return sh; },
      seedNote:"pr list · pr show <id> · pr test <id>. Record verdicts in answers/review.txt, one line per PR: pr1: approve  or  pr1: request-changes <issue>.",

    { id:"sockets", name:"Sockets & Protocols — NSP/1", ticketId:"NS-176", icon:"plug",
      blurb:"The status service speaks a small length-prefixed protocol over TCP. Talk to it by hand, then fix the client's framing code so it works on a real byte stream.",
      make:function(){ var sh=createShell(); installSockets(sh); return sh; },
      seedNote:"Spec in docs/NSP.md. Talk to the server with printf '…' | nc status.northstar.internal 7070. Fix src/nspframe.c; make test and nsp-client check it.",
      tasks:[
        {id:"so1",title:"Talk to the server by hand",lv:"L1",
         brief:"Read <code>docs/NSP.md</code>, then build frames yourself and send them with <code>nc</code>. Get a <code>PONG</code>, then ask for <code>STATUS</code> and write the build id it returns (e.g. <code>build=…</code>) to <code>answers/build.txt</code>.",
         hints:["A frame is 4 digits of payload length, a colon, then the payload. No newline.","<code>printf '0004:PING' | nc status.northstar.internal 7070</code>. If the length is wrong, the server waits for bytes that never come.","STATUS is 6 bytes: <code>printf '0006:STATUS' | nc status.northstar.internal 7070</code>, then <code>echo build=7f3a2c &gt; answers/build.txt</code> (use the id you actually got)."],
         check:function(sh){return /build=7f3a2c/.test(sh.fileContent("answers/build.txt")||"")&&sh.nspState().status;}},
        {id:"so2",title:"Parse the header safely",lv:"L2",
         brief:"<code>frame_len</code> in <code>src/nspframe.c</code> assumes the whole header has arrived, and it trusts any length. Make it return <code>0</code> when fewer than 5 bytes are available from <code>start</code>, and <code>-1</code> for lengths over 1024. Only <code>buf[0..n-1]</code> is valid; the buffer is reused, so anything after that is left over from an earlier read.",
         hints:["Run <code>make test</code>. The first failing case is a header split across two reads: 3 bytes so far.","Check <code>n - start</code> before reading the header. Don't use <code>strlen(buf)</code>: the buffer isn't NUL-terminated at <code>n</code>, and the stale bytes will fool you.","Add <code>if (n - start &lt; 5) return 0;</code> before the digit loop and <code>if (len &gt; 1024) return -1;</code> before the return."],
         check:function(sh){var r=sh.nspResults();return !!(r&&r.compiled&&r.results.frame_len.passed===r.results.frame_len.total);}},
        {id:"so3",title:"Handle a stream, not messages",lv:"L3",
         brief:"TCP delivers bytes, not messages. One <code>recv()</code> can hold half a frame or three frames back to back. <code>frames_in</code> assumes one frame per read. Make it count every complete frame at the start of the buffer, then run <code>nsp-client</code>. It streams real replies through your code, and the grader re-runs it with segment boundaries you can't see.",
         hints:["Read <code>src/client_loop.c</code>: that's the receive loop your functions plug into.","Walk an offset through the buffer: ask <code>frame_len(buf, off, n)</code> for each frame, stop when it's incomplete, and fail on -1.","<code>int off = 0; int count = 0; while (off &lt; n) { int len = frame_len(buf, off, n); if (len &lt; 0) return -1; if (len == 0 || off + len &gt; n) return count; count++; off += len; } return count;</code>"],
         check:function(sh){var r=sh.nspResults();return !!(r&&r.compiled&&r.results.frame_len.passed===r.results.frame_len.total&&r.results.frames_in.passed===r.results.frames_in.total&&r.client.visible.ok&&r.client.hidden.every(Boolean));}}
      ],
      review:{branch:"fix/nsp-framing",q:"This is the most common networking bug there is: code that works on localhost, where one send tends to arrive as one recv, and breaks on a real network. You also capped the length. What would happen to the client if a hostile server sent 9999 as the length and we had just allocated that much?"} },

  ];
  // mentor review attached per lab above (.review)

  // ---------- state ----------
  var KEY="ns-academy-v1";
  var state={ onboarded:false, view:"portal", lab:null, done:{}, reviewed:{}, taskState:{}, prReply:{}, events:[], selectedTrack:"core", practice:{}, workspace:{},residency:{tickets:{}},foundations:{completed:{},quizzes:{},answers:{},hints:{},notes:{}} };
  try{var raw=localStorage.getItem(KEY); if(raw) state=Object.assign(state,JSON.parse(raw));}catch(e){}
  if(!state.reviewed)state.reviewed={};
  if(!state.taskState)state.taskState={};
  if(!state.prReply)state.prReply={};
  if(!state.events)state.events=[];
  if(!state.practice || typeof state.practice!=="object")state.practice={};
  if(!state.workspace || typeof state.workspace!=="object")state.workspace={};
  if(!state.residency || typeof state.residency!=="object")state.residency={tickets:{}};
  if(!state.residency.tickets || typeof state.residency.tickets!=="object")state.residency.tickets={};
  if(!state.foundations || typeof state.foundations!=="object")state.foundations={};
  ['completed','quizzes','answers','hints','notes'].forEach(function(k){if(!state.foundations[k]||typeof state.foundations[k]!=='object')state.foundations[k]={};});
  if(!TRACKS.some(function(t){return t.id===state.selectedTrack;}))state.selectedTrack="core";
  function save(){ try{localStorage.setItem(KEY,JSON.stringify({onboarded:state.onboarded,done:state.done,reviewed:state.reviewed,taskState:state.taskState,prReply:state.prReply,events:state.events.slice(-40),selectedTrack:state.selectedTrack,practice:state.practice,workspace:state.workspace,residency:state.residency,foundations:state.foundations}));}catch(e){} }
  function logEvent(ev){ ev.t=Date.now(); state.events.push(ev); if(state.events.length>40)state.events=state.events.slice(-40); }
  function relTime(t){ var s=Math.round((Date.now()-t)/1000); if(s<45)return "just now"; var m=Math.round(s/60); if(m<60)return m+"m ago"; var h=Math.round(m/60); if(h<24)return h+"h ago"; return Math.round(h/24)+"d ago"; }

  // live shells, one per lab, created on demand
  var shells={};
  function shellFor(id){ if(!shells[id]){ var L=LABS.find(function(x){return x.id===id;}); shells[id]=L.make(); } return shells[id]; }
  function resetShell(id){ var L=LABS.find(function(x){return x.id===id;}); shells[id]=L.make(); }

  function labDone(id){ var L=LABS.find(function(x){return x.id===id;}); var sh=shellFor(id); return L.tasks.filter(function(t){try{return t.check(sh);}catch(e){return false;}}).length; }
  function labTotal(id){ return LABS.find(function(x){return x.id===id;}).tasks.length; }
  function totalDone(){ return LABS.reduce(function(a,L){return a+labDone(L.id);},0); }
  function totalTasks(){ return LABS.reduce(function(a,L){return a+L.tasks.length;},0); }

  // does a specific task currently pass, against its live shell?
  function taskPassed(labId,taskId){
    var L=LABS.find(function(x){return x.id===labId;}); if(!L)return false;
    var t=L.tasks.find(function(x){return x.id===taskId;}); if(!t)return false;
    try{return t.check(shellFor(labId));}catch(e){return false;}
  }
  function taskTitle(labId,taskId){ var L=LABS.find(function(x){return x.id===labId;}); var t=L&&L.tasks.find(function(x){return x.id===taskId;}); return t?t.title:taskId; }
  function ticketId(labId){ var L=LABS.find(function(x){return x.id===labId;}); return L?L.ticketId:labId; }

  // competencies map to the exact tasks that evidence them
  var COMP=[
    {nm:"Text processing & search",ev:[["fundamentals","f1"],["fundamentals","f2"],["fundamentals","f3"]]},
    {nm:"Linux permissions",ev:[["fundamentals","f4"],["automation","a2"]]},
    {nm:"Service troubleshooting",ev:[["triage","t1"],["triage","t2"]]},
    {nm:"Evidence-based investigation",ev:[["triage","t3"]]},
    {nm:"Networking & DNS",ev:[["networking","n1"],["networking","n2"],["networking","n3"]]},
    {nm:"Shell scripting & automation",ev:[["automation","a1"],["automation","a3"]]},
    {nm:"C programming",ev:[["cprog","c2"],["cprog","c3"]]},
    {nm:"Detection engineering",ev:[["detection","de2"],["detection","de3"]]},
    {nm:"OS internals (Windows)",ev:[["wininternals","w1"],["wininternals","w3"]]},
    {nm:"Linux internals",ev:[["linuxint","li1"],["linuxint","li2"],["linuxint","li3"]]},
    {nm:"Secure coding (input handling)",ev:[["secure","sc1"],["secure","sc2"],["secure","sc3"]]},
    {nm:"Reviewing others' code",ev:[["codereview","cr1"],["codereview","cr2"],["codereview","cr3"]]},
    {nm:"Incident analysis & writing",ev:[["incident","ir1"],["incident","ir2"],["incident","ir3"],["capstone","cp4"]]},
    {nm:"Network protocols & sockets",ev:[["sockets","so1"],["sockets","so2"],["sockets","so3"]]},
    {nm:"Debugging & testing",ev:[["debugging","db1"],["debugging","db2"],["debugging","db3"]]},
    {nm:"Handling ambiguous work",ev:[["ticket","tk1"],["ticket","tk2"],["ticket","tk3"]]},
    {nm:"Integrated on-call (capstone)",ev:[["capstone","cp1"],["capstone","cp2"],["capstone","cp3"],["capstone","cp4"]]}
  ];
  function competency(){
    var rows=COMP.map(function(c){
      var got=c.ev.filter(function(p){return taskPassed(p[0],p[1]);}).length;
      return {nm:c.nm,max:c.ev.length,got:got,ev:c.ev};
    });
    var merged=LABS.filter(function(L){return state.reviewed[L.id]&&labDone(L.id)===L.tasks.length;}).length;
    rows.push({nm:"Professional code review",max:LABS.length,got:merged,review:true});
    return rows;
  }
  // evidence strings for the transcript: the tickets/tasks behind a competency
  function evidenceFor(c){
    if(c.review) return LABS.filter(function(L){return state.reviewed[L.id];}).map(function(L){return L.ticketId+" merged on "+L.review.branch;});
    return c.ev.filter(function(p){return taskPassed(p[0],p[1]);}).map(function(p){return ticketId(p[0])+" · "+taskTitle(p[0],p[1]);});
  }

  function practiceCompleted(id){
    var d=detailFor(id);if(!d)return 0;
    return d.checks.filter(function(q){return state.practice[id]&&state.practice[id][q.id]===true;}).length;
  }
  function evidenceChecked(id){
    var d=detailFor(id);if(!d)return 0;
    return d.evidence.filter(function(e){return state.workspace[id]&&state.workspace[id][e.id]===true;}).length;
  }
  function practiceStatus(id){
    var d=detailFor(id);if(!d)return "Not started";
    var passed=practiceCompleted(id),proof=evidenceChecked(id);
    if(passed===d.checks.length && proof===d.evidence.length)return "Practice done · work self-reported";
    if(passed||proof)return "In progress";
    return "Not started";
  }
  function allPracticeCount(){return COM_DETAILS.reduce(function(sum,m){return sum+practiceCompleted(m.id);},0);}
  function allPracticeTotal(){return COM_DETAILS.reduce(function(sum,m){return sum+m.checks.length;},0);}
  function trackControls(){return '<div class="path-tabs" role="group" aria-label="Curriculum pathway">'+TRACKS.map(function(t){return '<button type="button" data-track="'+esc(t.id)+'" aria-pressed="'+(state.selectedTrack===t.id)+'">'+esc(t.title)+'</button>';}).join('')+'</div>';}
  function bindTrackControls(){document.querySelectorAll('[data-track]').forEach(function(b){b.addEventListener('click',function(){state.selectedTrack=b.dataset.track;save();setView(state.view==='portal'?'portal':'map');});});}

  function banner(){

  function add(t,html){var d=document.createElement("div");d.innerHTML=html;t.appendChild(d);t.scrollTop=t.scrollHeight;}
  function promptHtml(path){ return '<span class="pr">sam@northstar</span><span class="sys">:</span><span class="pa">'+esc(path)+'</span><span class="sys">$</span>'; }
  function updatePrompt(id){
    var p=shellFor(id).promptPath();

    var tt=$("#termTitle"); if(tt)tt.textContent="sam@northstar · "+p;
  }
  // colour directory names in ls output, the way a real terminal does
  function colorDirs(text,dirs){
    if(!dirs||!dirs.length)return esc(text);
    var set={};dirs.forEach(function(d){set[d]=1;});
    return text.split("\n").map(function(line){
      return line.split(/(\s+)/).map(function(tok){ return set[tok]?'<span class="dir">'+esc(tok)+'</span>':esc(tok); }).join("");
    }).join("\n");
  }

  var hist=[],hp=0;
  function wireInput(id){
    var inp=$("#cmd"),t=$("#term");
    inp.addEventListener("keydown",function(e){
      // always resolve the live shell: a lab reset swaps in a fresh one
      var sh=shellFor(id);
      if(e.key==="Enter"){e.preventDefault();var v=inp.value;if(v.trim()){hist.push(v);hp=hist.length;}inp.value="";runLine(id,t,v);}
      else if(e.key==="ArrowUp"){if(hp>0){hp--;inp.value=hist[hp]||"";}e.preventDefault();}
      else if(e.key==="ArrowDown"){if(hp<hist.length){hp++;inp.value=hist[hp]||"";}e.preventDefault();}
      else if(e.key==="Tab"){
        e.preventDefault();
        var r=sh.complete(inp.value);
        if(r.line!==inp.value){ inp.value=r.line; }
        else if(r.matches.length>1){ add(t,promptHtml(sh.promptPath())+' '+esc(inp.value)); add(t,'<span class="sys">'+r.matches.map(esc).join("  ")+'</span>'); }
      }
      else if(e.key==="l"&&e.ctrlKey){ t.innerHTML=""; e.preventDefault(); }
    });
    t.addEventListener("click",function(){if(!window.getSelection().toString())inp.focus();});
  }
  function runLine(id,t,line){
    var sh=shellFor(id);
    add(t,promptHtml(sh.promptPath())+' '+esc(line));
    if(line.trim()==="clear"){t.innerHTML="";return;}
    var r=sh.run(line);
    if(r.out)add(t,colorDirs(r.out,r.dirs));
    if(r.err)add(t,'<span class="err">'+esc(r.err)+'</span>');
    updatePrompt(id);
    checkLab();
    if(r.open)openEditor(id,r.open);
  }

  // ---------- in-terminal editor ----------
  var ed=null; // {id, path, name, orig, warned}
  function openEditor(id,o){
    ed={id:id,path:o.path,name:o.name,orig:o.content,warned:false};
    $("#edName").textContent=o.name;
    $("#edTag").textContent=o.isNew?"new file":"";
    var ta=$("#edText"); ta.value=o.content;
    $("#edMod").hidden=true; $("#edWarn").hidden=true;
    $("#editor").hidden=false;
    setTimeout(function(){ ta.focus(); ta.setSelectionRange(0,0); ta.scrollTop=0; edPos(); },0);
  }
  function edDirty(){ return ed && $("#edText").value!==ed.orig; }
  function edPos(){
    var ta=$("#edText"), before=ta.value.slice(0,ta.selectionStart).split("\n");
    $("#edPos").textContent="Ln "+before.length+", Col "+(before[before.length-1].length+1);
  }
  function edSave(){
    if(!ed)return;
    var sh=shellFor(ed.id), txt=$("#edText").value;
    if(sh.writeFile(ed.path,txt)){
      ed.orig=txt; $("#edMod").hidden=true; $("#edWarn").hidden=true; ed.warned=false; $("#edTag").textContent="";
      add($("#term"),'<span class="ok">[saved '+esc(ed.name)+']</span>');
      checkLab();
    } else {
      add($("#term"),'<span class="err">[could not save '+esc(ed.name)+': directory no longer exists]</span>');
    }
  }
  function edClose(force){
    if(!ed)return;
    if(edDirty()&&!force&&!ed.warned){ ed.warned=true; $("#edWarn").hidden=false; return; }
    if(edDirty()) add($("#term"),'<span class="sys">[closed '+esc(ed.name)+' without saving]</span>');
    $("#editor").hidden=true; ed=null; $("#cmd").focus();
  }
  function wireEditor(){
    var ta=$("#edText");
    ta.addEventListener("input",function(){ $("#edMod").hidden=!edDirty(); if(ed){ed.warned=false;$("#edWarn").hidden=true;} edPos(); });
    ta.addEventListener("keyup",edPos); ta.addEventListener("click",edPos);
    ta.addEventListener("keydown",function(e){
      if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){ e.preventDefault(); edSave(); }
      else if(e.key==="Escape"){ e.preventDefault(); edClose(false); }
      else if(e.key==="Tab"){ e.preventDefault(); var s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; ta.dispatchEvent(new Event("input")); }
    });
    $("#edSave").addEventListener("click",function(){ edSave(); $("#edText").focus(); });
    $("#edClose").addEventListener("click",function(){ edClose(false); });
  }

  function checkLab(){
    if(!activeLab)return;var sh=shellFor(activeLab.id),done=0;
    var ts=state.taskState[activeLab.id]||(state.taskState[activeLab.id]={});
    var changed=false, wasComplete=state.done[activeLab.id]===activeLab.tasks.length;
    activeLab.tasks.forEach(function(t){
      var ok=false;try{ok=t.check(sh);}catch(e){}
      var el=$("#task-"+t.id);if(el){el.classList.toggle("done",ok);}
      if(ok){ done++; if(!ts[t.id]){ ts[t.id]=true; changed=true; logEvent({kind:"task",lab:activeLab.id,ticket:activeLab.ticketId,title:t.title}); } }
      else if(ts[t.id]){ ts[t.id]=false; }
    });
    if(done===activeLab.tasks.length && !wasComplete) logEvent({kind:"lab",lab:activeLab.id,ticket:activeLab.ticketId});
    var sc=$("#score");if(sc)sc.textContent=done+" / "+activeLab.tasks.length;
    var bf=$("#barfill");if(bf)bf.style.width=(done/activeLab.tasks.length*100)+"%";
    var db=$("#doneBanner");
    if(db){
      var complete=done===activeLab.tasks.length;

  }

    if(!window.confirm("Reset all local demo progress, including the commercial practice checklist?"))return;
    for(var k in shells)delete shells[k];
    state.done={};state.reviewed={};state.taskState={};state.prReply={};state.events=[];
    state.practice={};state.workspace={};state.residency={tickets:{}};state.foundations={completed:{},quizzes:{},answers:{},hints:{},notes:{}};state.selectedTrack="core";
    save();setView("portal");
  });
  (function(){
    var root=document.documentElement,btn=$("#theme");
    var sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var moon=$("#ic").outerHTML;
    function sysDark(){return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;}
    function cur(){var t=root.getAttribute("data-theme");return t||(sysDark()?"dark":"light");}
    function paint(){btn.innerHTML=cur()==="dark"?sun:moon;}
    try{var s=localStorage.getItem("ns-theme");if(s)root.setAttribute("data-theme",s);}catch(e){}
    paint();
    btn.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("ns-theme",n);}catch(e){}paint();});
  })();

  // Deep links from the public landing page open the portal section after onboarding.
  // Only fixed, recognized hash values are supported; no arbitrary HTML or URL injection.
  var launch=window.location.hash.slice(1);
  if(launch==='foundations'){state.selectedTrack='commercial';state.view='foundations';}
  else if(launch==='advanced'){state.selectedTrack='commercial';state.view='advanced';}
  else if(launch==='residency'){state.selectedTrack='commercial';state.view='residency';}
  else if(launch==='commercial'){state.selectedTrack='commercial';state.view='commercial';}
  else if(launch==='curriculum'){state.view='map';}
  else if(launch==='work'){state.view='portal';}
  render();
})();
</script>

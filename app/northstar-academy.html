gs can reduce security if they include raw authorization headers or sensitive bodies.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the debugging workshop.","bridge":["NS-C401","NS-C407","NS-C408"],"workshop":"labs/foundations/debugging/README.md"},{"id":"FND-DEBUGGING-07","unit":"debugging","position":7,"title":"Race investigation","level":"independent","prerequisites":["FND-DEBUGGING-06"],"objectives":["Explain race investigation with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"A bug that only appears under load needs controlled concurrent reproduction. Use deterministic barriers or synchronized workers rather than hoping the race occurs. Capture transaction ordering and invariant failures; use atomic write conditions or locking to resolve the root cause. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"import threading\nb=threading.Barrier(2)\nassert b.parties==2","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"Passing a single-threaded test does not prove thread safety.","check":{"prompt":"What helps reproduce a concurrency race reliably?","choices":["Synchronization that forces the risky interleaving","Restarting the service once","Adding print statements only"],"answer":0,"rationale":"A bug that only appears under load nee outboxes or equivalent mechanisms if a database commit and event publication must remain coherent. Measure lag and expose safe operational signals. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"seen=set()\nfor key in [\"t1\",\"t1\"]:\n    if key in seen: continue\n    seen.add(key)\nassert len(seen)==1","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"In-memory deduplication alone is not durable after process restart.","check":{"prompt":"What avoids duplicate effects in at-least-once delivery?","choices":["Durable idempotent processing","Assuming messages never repeat","Silently dropping all errors"],"answer":0,"rationale":"Background tasks can process events later, so consumers must tolerate retries and duplicate delivery. In-memory deduplication alone is not durable after process restart."},"hints":["State the invariant behind eventual consistency and reliability in one sentence.","In-memory deduplication alone is not durable after process restart.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the architecture workshop.","bridge":["NS-C401","NS-C408"],"workshop":"labs/foundations/architecture/README.md"},{"id":"FND-ARCHITECTURE-05","unit":"architecture","position":5,"title":"Modular monolith versus services","level":"guided","prerequisites":["FND-ARCHITECTURE-04"],"objectives":["Explain modular monolith versus services with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Separating deployable services creates failure modes, network boundaries and operational overhead. Start with well-defined modules in one deployable application; split only when scaling, isolation or team ownership justifies the cost. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"components=[\"api\",\"domain\",\"repository\"]\nassert len(components)==3","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"Microservices do not automatically improve maintainability or security.","check":{"prompt":"When is a modular monolith often preferable?","choices":["When tests are absent","When the team needs clear boundaries without distributed overhead","Whenever every function uses a new database"],"answer":1,"rationale":"Separating deployable services creates failure modes, network boundaries and operational overhead. Microservices do not automatically improve maintainability or security."},"hints":["State the invariant behind modular monolith versus services in one sentence.","Microservices do not automatically improve maintainability or security.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the architecture workshop.","bridge":["NS-C401","NS-C408"],"workshop":"labs/foundations/architecture/README.md"},{"id":"FND-ARCHITECTURE-06","unit":"architecture","position":6,"title":"Release planning and rollback design","level":"guided","prerequisites":["FND-ARCHITECTURE-05"],"objectives":["Explain release planning and rollback design with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"A production change should define acceptance criteria, monitoring, deployment order, migration compatibility and rollback limits. For irreversible data changes, rollback may require forward-fix rather than reverting code. Capture decision records for important tradeoffs. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"release={\"build\":\"1.2\",\"migration\":\"additive\",\"rollback\":\"revert API\"}\nassert release[\"migration\"]==\"additive\"","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"A Git revert does not reverse external payments or destructive database changes.","check":{"prompt":"What belongs in a release plan?","choices":["Only a merge commit hash","Only a screenshot of the UI","Verification steps, compatibility and rollback constraints"],"answer":2,"rationale":"A production change should define acceptance criteria, monitoring, deployment order, migration compatibility and rollback limits. A Git revert does not reverse external payments or destructive database changes."},"hints":["State the invariant behind release planning and rollback design in one sentence.","A Git revert does not reverse external payments or destructive database changes.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the architecture workshop.","bridge":["NS-C401","NS-C408"],"workshop":"labs/foundations/architecture/README.md"}]};
  var FOUNDATION_GUIDES=["# Python engineering: from syntax to maintainable services\n\n## What you will build\n\nRead and extend a small backend service without relying on a framework to conceal basic behavior. You will write value-validation functions, group records, preserve caller-owned data and calculate predictable results. The goal is not memorizing syntax; it is understanding what a function promises its callers and what happens when the promise is broken.\n\n## 1. Data has a shape and a contract\n\nPython is dynamically typed, but backend APIs still have types. An account identifier is a positive integer; a transfer amount is a positive integer measured in cents; an actor is an authenticated identity in a production service (the residency demo instead uses an untrusted header). When a request arrives as JSON, its shape is not guaranteed. A client may send `null`, a list, a decimal, a negative number, or a string where a number was expected.\n\nWrite down the contract *before* implementing it: (1) accepted inputs, (2) output type and meaning, (3) failure conditions, (4) mutation policy. For example, a function parsing an account ID may accept only positive `int` values and reject `bool`, even though `isinstance(True, int)` is true. If it raises `ValueError`, the HTTP adapter should translate that into a consistent client error. A silent default can accidentally select the wrong account.\n\n## 2. Values, references and unintended side effects\n\nNumbers, strings and tuples cannot be mutated in place. Lists, sets and dictionaries can. Assigning `copy = account` does not copy the dictionary: both names refer to the same mapping. A shallow copy with `dict(account)` duplicates the outer mapping but not nested mutable members. Before returning records to a client, construct an explicit public representation. Do not remove confidential fields from a shared dictionary in place; a mutation could affect later requests.\n\n```python\nprivate = {\"id\": 7, \"owner\": \"alice\", \"cents\": 1000}\npublic = {\"id\": private[\"id\"], \"cents\": private[\"cents\"]}\nassert \"owner\" not in public\n```\n\nThis is *data minimization*, not authorization. Authorization must still happen before any private account is retrieved or serialized. Explain the difference to a reviewer.\n\n## 3. Function boundaries and errors\n\nSeparate parsing, business rules and persistence. The HTTP layer answers what was requested and which status to send. Business functions answer whether a transfer is allowed. Data-access functions answer which rows are fetched and updated. This separation enables unit tests that do not open a network socket. An exception indicates a broken assumption or rejected input; catching every exception and returning an empty list disguises programmer errors as legitimate results.\n\nBefore changing `app/bank.py`, trace the call from `app/server.py`. Identify where untrusted client input is transformed into an internal value. Annotate which functions can raise and which are allowed to modify persistent state. Use `python3 -m pdb` or strategically placed local diagnostic output when debugging; never leave customer details in a production log.\n\n## 4. Choosing a data structure\n\nLists preserve sequence and allow index access. Dictionaries provide average constant-time key lookup. Sets give efficient membership checks. A common mistake is using nested list searches to count records: the program works for five accounts but becomes slow for large datasets. Ask what operation dominates the algorithm. For n records, one pass with a dictionary is expected O(n); a scan of all earlier records per entry is O(n²).\n\n## 5. Guided practice\n\n1. Run `python3 -m unittest discover -s tests -v` from `labs/foundations/python`; record the initial failing contract.\n2. Implement validation, grouping and safe-copy behavior in `starter.py`; rerun after each change.\n3. Add two tests for malformed records and demonstrate that input data is not mutated.\n4. Explain why a `dict` was preferable to repeated linear searches, and where a deep copy might be necessary.\n5. Open residency ticket NS-C401 and trace an incoming request through both layers before writing code.\n\n## Reflection and engineering handoff\n\nA pull request is not complete because tests turn green. Describe what you changed, why the interface remains stable, and which negative tests cover the edge cases. State any assumptions (e.g., IDs are already parsed integers) and avoid making claims about security that the tests do not support. When you're ready, approach the first residency sprint as an unfamiliar service rather than simply retyping a worked example.\n\n## Case study: a customer account appears to change after reading it\n\n**Incoming ticket:** A support engineer reports that a GET operation sometimes removes the `owner` field from a cached internal account record. The customer response is supposed to omit private fields, so a junior developer previously wrote `account.pop('owner')` before sending JSON. The call works the first time but mutates the in-memory dictionary used by a subsequent request.\n\n**Reproduce:** Create `record = {'id': 7, 'owner': 'alice', 'cents': 200}`. Call the serializer twice. After the first call, inspect `record.keys()`. Is the bug in the HTTP handler or in the transformation function? The observable defect is *shared state mutation*; the trigger is serialization. Explain why a unit test that only inspects the first response can miss the failure.\n\n**Reason about alternatives:** (A) Copy the dictionary and delete restricted keys, (B) construct an explicit allowlisted public dictionary, (C) return the original reference. B is usually safest because newly introduced confidential fields will not automatically become public. A shallow copy may still share nested lists; a deep copy may cost more and still fail to implement correct authorization. None of the options removes the need to check the requester's permissions before fetching data.\n\n**Mini experiment:** Make a list of three account records. Aggregate balances by owner using a dictionary rather than searching all earlier results for each record. Estimate time as a function of n accounts and k owners. Check that an empty list returns `{}` and a malformed account raises rather than silently being skipped. Add tests that verify input order and dictionaries are unchanged before/after. A reviewer should be able to reconstruct the before-and-after behavior using only your test output and code diff.\n\n**Residency handoff:** Find the path from a GET request in `app/server.py` into `app/bank.py`. Draw three boxes (input parsing, domain logic, persistence). Which boundary is responsible for validation? Which is responsible for authorization? Which is responsible for formatting the outgoing JSON? Write a short design note before modifying NS-C401 or NS-C402.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Iterators and generators\n\nAn iterator yields one item at a time instead of materializing a full collection. This enables bounded-memory processing of large transaction logs, but iterators can be exhausted; do not accidentally traverse the same stream twice. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ntransactions = (line.strip() for line in [\" debit \",\" credit \"]); print(next(transactions))\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A generator expression is lazy; it is not a list and has no guaranteed rewind.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the python workshop.\n\n**Review question:** Why can a transaction-log generator save memory? An iterator yields one item at a time instead of materializing a full collection. A generator expression is lazy; it is not a list and has no guaranteed rewind.\n\n## 6. Type hints and validation\n\nType annotations help reviewers and static tools understand interfaces, but Python does not enforce them at runtime. Untrusted JSON must still be parsed and validated. Avoid conflating bool and int or silently coercing string amounts into numeric financial values. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef cents(amount: int) -> int:\n    if type(amount) is not int or amount \u003c= 0: raise ValueError(\"amount\")\n    return amount\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A type hint does not validate an API request by itself.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the python workshop.\n\n**Review question:** What does amount: int do at runtime? Type annotations help reviewers and static tools understand interfaces, but Python does not enforce them at runtime. A type hint does not validate an API request by itself.\n\n## 7. Context managers and resources\n\nFiles and database connections are limited resources. A context manager makes cleanup predictable when an exception interrupts a procedure; it does not automatically make unrelated database operations atomic. Understand what an object’s __exit__ actually guarantees. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nfrom contextlib import closing\nwith closing(open(\"/dev/null\")) as stream:\n    assert stream.read() == \"\"\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A with statement only offers guarantees implemented by the context manager.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the python workshop.\n\n**Review question:** What is the key role of a context manager? Files and database connections are limited resources. A with statement only offers guarantees implemented by the context manager.\n\n## 8. Dependency injection and testing seams\n\nA function that reads its own environment, opens its own database and sends HTTP requests is difficult to test. Inject boundaries such as a repository or clock so tests can provide safe fakes. Keep business policy separate from transport or persistence details. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef account_label(repository, owner):\n    return repository.find_label(owner)\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Injection is not the same as exposing internal mutable state to callers.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the python workshop.\n\n**Review question:** Which design most directly improves test isolation? A function that reads its own environment, opens its own database and sends HTTP requests is difficult to test. Injection is not the same as exposing internal mutable state to callers.\n","# HTTP and APIs: contracts across a network boundary\n\n## 1. Trace the entire exchange\n\nAn API is a contract between components that may have different authors, deployments and failure modes. Read the method, path, headers, status and body separately. `GET /health` returning HTTP 200 means the request was handled successfully *at the HTTP layer*; the body may still violate the application contract if required JSON fields are absent. Conversely, an HTTP 404 can be correct when a resource does not exist or the server intentionally conceals a private resource.\n\nUse two terminals. Start `python3 -m app.server --port 8765` in the residency folder and then request `curl -i http://127.0.0.1:8765/health`. The `-i` flag includes response headers. Compare the observed JSON with the documented fields. If the server will not start, first distinguish a process error from a request-level defect.\n\n## 2. Methods and status codes\n\nGET should not intentionally change state. A POST may create a transaction; it must validate the request and communicate the resulting outcome. A 400 means an invalid client input, 401 indicates missing or invalid authentication, 403 means authenticated but forbidden, 404 indicates not found, 409 often means a conflict, and 500 means the server could not complete the operation. These are conventions whose meaning should be documented for each endpoint. Avoid leaking detailed SQL messages in client-facing 500 responses.\n\nA successful status cannot substitute for server-side access control. A developer may hide a forbidden UI button, but an attacker can send the request directly. Check ownership in the server-side domain/data layer. In this synthetic training repo, `X-Demo-User` is an explicitly untrusted simulation identity; it is *not* authentication and must never protect public systems.\n\n## 3. Serialization, validation and pagination\n\nJSON object keys are strings, but values can be strings, numbers, booleans, arrays, objects or null. Decide which forms are valid for each field. The service should reject unknown or malformed amounts before touching persistent data. Pagination is a contract: define the default and maximum page size, the stable sort key, and the behavior of negative/invalid offsets. Naively converting arbitrary strings with `int()` without catching errors can produce an unintended HTTP 500 instead of a 400.\n\n```http\nGET /accounts?limit=2&offset=0 HTTP/1.1\nAccept: application/json\n```\n\nTrace where the parameters are parsed, normalized, bound in SQL and finally serialized. Ask whether page 2 still belongs to the same authorized actor.\n\n## 4. Retry and idempotency reasoning\n\nA network timeout gives incomplete knowledge: the client cannot tell whether the server committed work but lost the response. A retry of a non-idempotent transfer can debit twice. For reliable money movement, a client supplies a stable idempotency key for one intended operation. The server stores a fingerprint and result durably as part of a transaction. Replaying the *same request* must not debit again, and reusing the same key for a different transfer should be rejected. A client-side in-memory cache alone is insufficient: processes restart and multiple workers may serve requests.\n\n## 5. Practice and handoff\n\n1. Complete the HTTP workshop, which starts an ephemeral-port localhost server and checks actual HTTP response semantics.\n2. Produce a contract table for /health, /accounts and /transfers: method, path, status, response shape, errors, authorization policy.\n3. Reproduce the residency health-check defect and write one regression assertion.\n4. Use a different demo identity to test forbidden account access; explain why the header is insecure for a real deployment.\n5. Document retry assumptions and demonstrate a test proving a duplicate operation did *not* execute twice.\n\nIn your engineering evidence, include exact requests and sanitized responses, not screenshots alone. A reviewer should be able to reproduce the defect without guessing hidden setup steps.\n\n## Case study: green health check, red deployment\n\n**Incoming ticket:** Operations sees HTTP 200 from `/health` but cannot identify the deployed release because the `build` field is absent. A developer suggests returning HTTP 500 whenever the field is missing. That makes the absence obvious, but it confuses two independent questions: whether the process is healthy and whether it conforms to a release-identification contract. Decide which endpoint behavior the documented contract actually promises, and write a regression test for it.\n\n**Reproduce:** Start the localhost banking server and run `curl -i` on `/health`. Record the status line, `Content-Type` and response JSON. Now run an unauthorized account request and compare its response status/body. Does the server return the same behavior for an unknown account and a known but unauthorized account? Explain the privacy tradeoff, and why a caller-controlled header cannot establish real authentication.\n\n**Boundary matrix:** For `/accounts/7`, test: missing identity, wrong identity, unknown ID, malformed ID `abc`, invalid page sizes and authorized correct identity. For each case, predict whether the service should return 200, 400, 401, 403 or 404 based on the **documented** contract, not on a generic assumption. Test whether an error body unintentionally includes SQL fragments or private data. A stable error shape makes client-side error handling easier but must not reveal security-sensitive details.\n\n**Retry experiment:** Imagine the client submits a transfer, the server commits it, then the response is lost. If the client blindly repeats the POST, the bank may debit twice. Sketch an idempotency table with key, request fingerprint, status and stored result. The insertion/check and transfer must be coordinated transactionally. Ask what happens when two workers receive the same key concurrently. Why does sleeping and trying again not solve duplicate execution?\n\n**Residency handoff:** For NS-C401, provide the literal failing response and its asserted contract. For NS-C403, show both authorized and unauthorized requests. For NS-C406, demonstrate a replay test that checks the balance after each call rather than just comparing HTTP codes.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Content types and serialization\n\nAn API contract includes representation details. A valid JSON body delivered with the wrong content type can be rejected by clients, and an arbitrary object can fail serialization. Validate content type before reading input and return a consistent JSON response shape. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport json\npayload=json.dumps({\"ok\": True}).encode(\"utf-8\")\nassert payload.startswith(b\"{\")\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A 200 status does not prove that the content matches the declared media type.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the http workshop.\n\n**Review question:** Which response metadata tells a client how to parse JSON? An API contract includes representation details. A 200 status does not prove that the content matches the declared media type.\n\n## 6. Pagination and stable ordering\n\nLarge resources should be paginated to avoid unbounded responses. A limit without a deterministic order can skip or repeat rows when new records are inserted. Keyset pagination scales better for many append-only workloads; offset pagination is simpler but requires tradeoff analysis. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nrows=[{\"id\":3},{\"id\":1},{\"id\":2}]\npage=sorted(rows,key=lambda x:x[\"id\"])[:2]\nassert [x[\"id\"] for x in page]==[1,2]\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A LIMIT without ORDER BY does not establish stable page contents.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the http workshop.\n\n**Review question:** Why order results before pagination? Large resources should be paginated to avoid unbounded responses. A LIMIT without ORDER BY does not establish stable page contents.\n\n## 7. Timeouts, retries and backoff\n\nNetworks fail partially: a client may time out after the server commits an operation. Retrying blindly can duplicate effects. Pair timeouts with idempotency keys, bounded retries and exponential backoff with jitter; decide which failure categories are retryable. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef delays():\n    for attempt in range(3):\n        yield min(8, 2 ** attempt)\nassert list(delays())==[1,2,4]\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Timeout does not imply the server rolled back the request.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the http workshop.\n\n**Review question:** When should a payment request be safely retried? Networks fail partially: a client may time out after the server commits an operation. Timeout does not imply the server rolled back the request.\n\n## 8. HTTP API compatibility\n\nExternal clients rely on status codes, field names and failure formats. Adding a required field can break existing callers; version or migrate contracts deliberately. Contract tests should cover absent and invalid fields as well as successful requests. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef respond(account):\n    return {\"id\":account[\"id\"],\"balance_cents\":account[\"balance_cents\"]}\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A breaking change is not made safe simply by documenting it after deployment.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the http workshop.\n\n**Review question:** What best detects an accidental response change? External clients rely on status codes, field names and failure formats. A breaking change is not made safe simply by documenting it after deployment.\n","# Relational databases: data that survives failures\n\n## 1. Model the invariants\n\nA database is more than a place to put JSON. Tables define entities and relationships; constraints reject invalid states; transactions group operations that must succeed together. In a toy banking service, `accounts` records a stable identifier, an owner and integer cents. The invariant `cents >= 0` should be enforced by both business logic and a database CHECK constraint where appropriate. In a real financial ledger, design choices are more complex and balances are often derived from immutable entries; this lab intentionally narrows the scope.\n\nUse integer cents, not floating-point dollars, to avoid imprecise arithmetic. Primary keys uniquely identify rows, foreign keys preserve relationships, and UNIQUE constraints enforce idempotency-key uniqueness. A good schema makes invalid states difficult to represent.\n\n## 2. Safe queries and authorization\n\nA SQL injection occurs when untrusted values become part of executable SQL syntax. Placeholders such as `?` in SQLite cause values to be bound as data. They protect values, *not* identifiers such as dynamic table names; an allowlist is needed if SQL structure itself changes. The query should include the server-authorized account owner, rather than fetching every row and filtering in the browser.\n\n```python\nrows = conn.execute(\n    'SELECT id, cents FROM accounts WHERE owner = ? ORDER BY id LIMIT ? OFFSET ?',\n    (actor, limit, offset),\n).fetchall()\n```\n\nObserve that parameterization and authorization are two separate controls. A fully parameterized query can still expose private records if it lacks a correct owner predicate.\n\n## 3. Transaction boundaries and rollback\n\nTransfers have at least two operations: subtract from source and add to destination. These must be atomic. In Python's `sqlite3`, explicitly manage transactions in code and understand when the library commits or rolls back. Simulate a failure between debit and credit, then check **both** balances. Do not settle for an exception alone. The total amount should not change for an internal transfer, and the source must not become negative.\n\n```sql\nBEGIN;\nUPDATE accounts SET cents = cents - 500 WHERE id = 1 AND cents >= 500;\n-- verify exactly one row was changed, then credit account 2\nCOMMIT;\n```\n\nIf a required step fails, roll back the transaction. A conditional UPDATE can enforce sufficient funds but only if the affected row count is checked. Separate the success of an SQL statement from the success of the business operation.\n\n## 4. Concurrency, performance and migration\n\nTwo simultaneous requests can both observe an older balance unless the transaction strategy prevents a lost update. SQLite's locking and PostgreSQL's transaction/isolation semantics differ: do not assume a solution transfers unchanged. Indexes can speed owner-filtered retrieval but impose storage and write costs. Use `EXPLAIN QUERY PLAN` to inspect behavior and measure before optimizing. Schema migrations must be reversible or have a documented safe rollback approach; dropping data is not a harmless refactor.\n\n## 5. Applied practice\n\nRun `python3 -m unittest discover -s tests -v` in `labs/foundations/sql`. Create schema constraints, parameterized owner-scoped queries, and a transfer operation that passes rollback tests. Then read the residency's `app/bank.py`, reproduce the unauthorized query, and annotate every place an actor value enters SQL. Complete NS-C402 and NS-C405 only after documenting your database assumptions.\n\n## Case study: a transfer that says failed but still debits\n\n**Incoming ticket:** A transfer of 200 cents from account 1 to account 2 returns HTTP 500 after an injected exception. The service retries later, but the customer's balance is already 200 cents lower. The logs indicate the debit SQL statement returned successfully. That alone does not prove the overall transfer succeeded. Find the transaction boundary and identify any premature `commit()`.\n\n**Reproduce with a ledger table:** Begin with balances 1000 and 500. Record their sum: 1500. Start a transfer and deliberately raise an exception immediately after the debit. Query both balances. If you see 800 and 500, the system has lost 200. If you see 1000 and 500, rollback preserved the invariant. A test should check both individual balances and the conservation property; do not merely assert `RuntimeError` is raised.\n\n**Design the database contract:** Define `id` as a primary key, `owner` as not-null, and `cents` as integer with a nonnegative CHECK. The source debit query should condition on available funds and update exactly one row; check `rowcount`. The destination must exist; an UPDATE affecting zero rows is not an acceptable transfer success. Use parameter placeholders for all caller-supplied values. Observe that placeholders prevent SQL injection but do nothing to prove the source account belongs to the requesting user.\n\n**Think about concurrency:** A read-then-update scheme can be unsafe when two workers use stale balances. A guarded UPDATE inside a transaction reduces the risk, but a full strategy must match the database's isolation and lock semantics. SQLite is adequate for this controlled local workshop; a PostgreSQL production migration would require revisiting the transaction strategy, schemas, concurrency tests and operational rollback plan.\n\n**Residency handoff:** Run the failing test from Sprint 3 and capture exact before/after balances. Fix the transaction boundary. Add failure injection for nonexistent destination and inadequate funds. Write down which properties your tests demonstrate and which concurrency behaviors they do *not* test.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Foreign keys and schema constraints\n\nA database can enforce relationships even when application code contains defects. Foreign keys prevent orphan records when enabled, CHECK constraints reject invalid domain values, and UNIQUE constraints reject duplicate keys. Treat constraints as a second defense, not a replacement for authorization. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport sqlite3\nc=sqlite3.connect(\":memory:\"); c.execute(\"PRAGMA foreign_keys=ON\")\nc.execute(\"CREATE TABLE parent(id INTEGER PRIMARY KEY)\")\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** SQLite foreign keys require explicit enablement per connection.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.\n\n**Review question:** What protects relationship integrity at the storage boundary? A database can enforce relationships even when application code contains defects. SQLite foreign keys require explicit enablement per connection.\n\n## 6. Indexes and query planning\n\nIndexes can speed up selective lookups but add write costs and cannot compensate for incorrect queries. Study EXPLAIN QUERY PLAN and design indexes around equality predicates, joins and ordering. Evaluate the workload instead of indexing every column blindly. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport sqlite3\ndb=sqlite3.connect(\":memory:\");db.execute(\"CREATE TABLE a(owner TEXT, id INTEGER)\")\ndb.execute(\"CREATE INDEX idx_owner ON a(owner)\")\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** An index improves access paths, not authorization decisions.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.\n\n**Review question:** Why might an index slow bulk inserts? Indexes can speed up selective lookups but add write costs and cannot compensate for incorrect queries. An index improves access paths, not authorization decisions.\n\n## 7. Isolation and concurrent writes\n\nTwo requests can read the same balance before either updates it. A correct transfer needs transactional boundaries, locking or atomic conditions so the invariant holds under concurrency. Database isolation is a design decision; understand lost updates, stale reads and deadlocks. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nbalance=100\nrequested=[80,80]\nassert sum(requested)>balance  # both cannot safely succeed\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Sequential tests alone cannot establish concurrent correctness.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.\n\n**Review question:** What catches a lost-update risk? Two requests can read the same balance before either updates it. Sequential tests alone cannot establish concurrent correctness.\n\n## 8. Migrations and rollback plans\n\nSchema changes must work for existing populated databases. A migration defines forward changes, data backfills and operational rollback implications; blindly dropping a populated table is not acceptable. Practice migrating from one compatible schema version to another. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport sqlite3\ndb=sqlite3.connect(\":memory:\");db.execute(\"CREATE TABLE event(id INTEGER PRIMARY KEY)\")\ndb.execute(\"ALTER TABLE event ADD COLUMN category TEXT\")\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A schema migration is more than a create_all call on an empty database.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.\n\n**Review question:** Which migration strategy reduces rollout risk? Schema changes must work for existing populated databases. A schema migration is more than a create_all call on an empty database.\n","# Testing: evidence of behavior, not a checkbox\n\n## 1. Test the interface, not private details\n\nA well-formed test establishes inputs, executes a behavior and checks the promised output or side effect. Separate unit-level pure functions from integration boundaries such as SQLite and HTTP. When tests read private implementation variables, refactoring becomes painful even when behavior is unchanged. State what property the assertion protects: a response field, a rejected invalid amount, unchanged balances after a failure, or access denied to a different user.\n\n## 2. Design a useful test matrix\n\nFor an account API, enumerate categories before writing assertions: authorized existing account, unauthorized existing account, unknown account, malformed identifier, no actor, empty collection, pagination edge, and database failure. Check negative-path state as well as the returned error. Rejecting a transfer is not sufficient if the debit has already persisted. Do not rely solely on example input from the README.\n\nUse fresh fixtures and independent test databases. Each test should set up its own world, especially when mutations are involved. Order-dependent tests may pass locally and fail in CI, undermining trust in the evidence.\n\n## 3. Red, green, refactor\n\nWrite the test that reproduces the defect; confirm it fails for the right reason, then fix the code and rerun. Finally refactor while keeping behavior stable. A test that only checks `self.assertTrue(True)` will be green, but adds no confidence. Similarly, a large coverage number indicates execution, not whether important invariants were asserted.\n\n```python\nwith self.assertRaises(ValueError):\n    bank.transfer(cents=0)\nself.assertEqual(bank.balance(1), starting_balance)\n```\n\nThis checks that the service rejects invalid input *and* preserves state. Add a second check for the other account.\n\n## 4. Unit, integration and contract tests\n\nUnit tests execute quickly and isolate one behavior. Integration tests confirm multiple components cooperate. Contract tests guard interface compatibility, including HTTP status, body shape and input rules. End-to-end tests give confidence in realistic user flows but cost more to run and diagnose. Use the narrowest test that convincingly detects a defect, then add integration coverage for critical boundaries.\n\nCI should run independently of hidden local state. Source-controlled test fixtures must be synthetic, and tests should not depend on cloud accounts, current wall-clock time or non-deterministic network services without a specific reason.\n\n## 5. Practice, mutation and reporting\n\nIn the testing workshop you will write tests *and* repair a deliberately broken function. Run the supplied negative tests before your change and save their output. Consider a simple mutation: if someone changes `>=` to `>`, does the test suite catch the off-by-one error? Use `python3 -m unittest discover -s tests -v`. When you enter the residency, provide exact commands, the first failing assertion, the patch summary and the final tests. If the test does not probe the failure path, say so; honesty is part of engineering evidence.\n\n## Case study: every test passes, but authorization is broken\n\n**Incoming ticket:** A team reports 100% line coverage, yet a customer can view another customer's account. The unit tests mock the `Bank.lookup` function to return a successful record for every user; they never create two distinct owners. Coverage reports show executed lines, not whether the permission predicate was correct.\n\n**Design the smallest useful regression:** Create Alice's account 1 and Bob's account 2 in a fresh in-memory database. Request Alice's account as Alice (expected success) and as Bob (expected denial). Query both accounts after the denied request to prove no state change. Add a malformed identifier test, an unknown resource test and a response-data-minimization assertion. Avoid a test that asserts only “the request did not crash.”\n\n**Avoid tautological tests:** If the function under test calculates a sum and the test computes its expected value by calling the same helper, both sides can share a defect. Write a simple independently calculated expected result. For boundary amounts, test zero, negative, equal-to-balance, one cent over balance, and a non-integer. Tests against a fake database should not be your only evidence: add one integration test that passes through the real SQLite layer to catch query mistakes.\n\n**Mutation experiment:** Temporarily change `>=` to `>` in the sufficient-funds check. Which test fails? If none does, you lack an exact-balance boundary test. Restore the implementation afterward; demonstrate the original red assertion, the corrected green result and the mutation being rejected. This experiment teaches more than simply counting assertions.\n\n**CI handoff:** New workshop tests should be deterministic: fresh state, no internet dependencies, explicit failure messages and clear commands. `npm run check` is a repository release gate; individual `bash run-checks.sh` files within learner workspaces are expected to fail before the student completes the exercise. Document this difference so a green deployment does not mask uncompleted learner tasks.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Property-based and boundary testing\n\nExample tests check known cases, but invariants describe entire classes of input. Even without a property-test library, generate structured boundary inputs and assert conservation of money, deterministic ordering and input rejection. Record random seeds for reproducible failures. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef allowed(x): return type(x) is int and 0 \u003c x \u003c= 500\nassert not allowed(0) and not allowed(True)\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Many examples do not replace a clearly expressed property.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the testing workshop.\n\n**Review question:** What is a strong transfer invariant? Example tests check known cases, but invariants describe entire classes of input. Many examples do not replace a clearly expressed property.\n\n## 6. Mocking versus integration\n\nA mock can prove an interaction occurred but not that a real transaction commits correctly. Use unit tests for policies and integration tests for databases, HTTP serialization, migrations and concurrent work. Avoid overmocking the component whose behavior matters. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nclass FakeClock:\n    def now(self): return 42\nassert FakeClock().now()==42\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A fake database cannot prove real SQL behavior or isolation.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the testing workshop.\n\n**Review question:** Which test best validates actual SQL constraints? A mock can prove an interaction occurred but not that a real transaction commits correctly. A fake database cannot prove real SQL behavior or isolation.\n\n## 7. Mutation and negative tests\n\nA good regression test should fail when the original defect is reintroduced. Temporarily change a guard or condition to evaluate whether a test detects the specific vulnerability. Negative tests must also verify no side effect happened after rejection. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef restricted(actor, owner): return actor == owner\nassert restricted(\"a\",\"b\") is False\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A suite passing on both correct and intentionally broken code is not meaningful evidence.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the testing workshop.\n\n**Review question:** What does a mutation surviving all tests suggest? A good regression test should fail when the original defect is reintroduced. A suite passing on both correct and intentionally broken code is not meaningful evidence.\n\n## 8. CI gates and flaky tests\n\nContinuous integration repeats clean-environment checks without relying on a developer’s laptop state. Tests that share mutable databases or assume timing/order are often flaky. Pin dependencies, isolate fixtures, report failure artifacts and separate learner-red exercises from release-gate tests. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport tempfile\nwith tempfile.TemporaryDirectory() as directory:\n    assert directory\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A green workflow can still conceal missing security assertions.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the testing workshop.\n\n**Review question:** How should a shared-state flaky test be repaired? Continuous integration repeats clean-environment checks without relying on a developer’s laptop state. A green workflow can still conceal missing security assertions.\n","# Debugging and observability: from symptom to cause\n\n## 1. Separate symptom, hypothesis and evidence\n\nA product report such as “account listing broke after deployment” is a symptom. It does not identify the defect. Reproduce it with stable inputs; capture expected and observed results; write a hypothesis; design one experiment that could falsify the hypothesis. Avoid editing multiple unrelated modules before you know which assumption failed. A minimal reproduction and a clean test fixture let other engineers verify the claim.\n\n## 2. Follow the value through the stack\n\nTrace `request -> HTTP parsing -> domain logic -> SQL -> response`. At each boundary inspect only necessary values: request method/path, normalized identifier, authorized actor, query predicate, affected-row count and returned representation. The visible exception may be far downstream of the initial error. Use `python3 -m pdb` for breakpoints and stepping, or focused diagnostics during development. Never publish raw customer records or authorization headers in a traceback response.\n\n## 3. Make logs useful without making them dangerous\n\nA good event has a stable name, outcome and request identifier. Do not log secrets, full bearer tokens, access credentials or raw sensitive bodies. A sanitization rule must work with mixed case header names and nested structures. Logs are for diagnosing an event, while audit trails may have additional integrity/retention requirements. These are not interchangeable.\n\n```json\n{\"event\":\"authorization_denied\",\"request_id\":\"req-05\",\"resource\":\"account\",\"outcome\":\"denied\"}\n```\n\nThis tells a developer enough to correlate an event without exposing the account's complete sensitive contents. Avoid writing a full secret into logs and relying on redaction *after* export.\n\n## 4. Root cause versus trigger\n\nA bad account identifier may *trigger* an exception; the root cause may be that an unchecked conversion escapes the HTTP handler and returns 500 instead of a documented 400. Reports should distinguish trigger, faulty assumption, impact, correction, validation and potential prevention. A “fixed” label with no reproducible before-and-after proof does not demonstrate competence.\n\n## 5. Reproduce the workshop bug\n\nRun the debugging workshop tests. Inspect the input event stream and identify which invalid record causes counts to drift. Make a small fix, then create a regression test for the original trigger. Submit a one-page investigation with exact command, expected output, observed output, defect location, corrected behavior and risks. Bring the same discipline to the banking health contract, authorization investigations and audit logging tickets.\n\n## Case study: wrong owner, correct SQL\n\n**Incoming ticket:** A transaction history endpoint occasionally shows data for the wrong customer. The SQL query appears to include an owner predicate, so a developer immediately blames the database. Trace the actor value: the HTTP handler extracts a demo header; domain code accepts that actor; the SQL layer binds it as a parameter. If the supplied actor was wrong at the input boundary, correct SQL can still return the wrong user's data.\n\n**Hypothesis-driven investigation:** First reproduce with two distinct synthetic identities and deterministic records. Capture each request (sanitize headers), the response status and the returned account IDs. Next inspect the value passed into the domain function, then inspect the SQL bindings. Change only one variable per experiment. If the result changes when the header changes, that is evidence that the identity boundary matters; it does not prove the entire authorization design is safe.\n\n**Safe diagnostics:** Instead of logging raw `Authorization` headers or complete customer objects, emit structured events with event, correlation ID, outcome and coarse failure category. Apply a strict allowlist when building log records. Redacting the literal word \"password\" is insufficient: tokens may appear under varied casing or nested keys. Add a test that passes nested headers and asserts no secret string appears anywhere in the resulting event representation.\n\n**Report the cause precisely:** Trigger: request with actor header for another user. Defect: the training server treats caller-controlled identity as trusted. Impact: demonstration permits impersonation if exposed outside localhost. Containment: bind the server to 127.0.0.1 and restrict access to synthetic fixtures. Production correction: real authenticated identity propagation and server-side authorization, supported by reviewed identity architecture. Simply hiding the header in the browser would not fix the defect.\n\n**Residency handoff:** NS-C407 and NS-C408 ask you to think critically about historical data and audit logs. Include the reproduction, trace, precise source-level fault, corrected behavior, regression tests, release risk and rollback plan in your PR evidence. Do not state that the local demo has production authentication.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Stack traces and exception boundaries\n\nA stack trace shows where an error surfaced, not always where it originated. Follow the call chain and inspect validated assumptions at each boundary. HTTP handlers should return safe errors without leaking account numbers, stack traces or credentials. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef parse(raw): return int(raw)\ntry: parse(\"bad\")\nexcept ValueError as exc: assert type(exc).__name__ == \"ValueError\"\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Suppressing a stack trace in the response is different from suppressing the internal diagnostic event.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the debugging workshop.\n\n**Review question:** Which clue helps locate a failure path? A stack trace shows where an error surfaced, not always where it originated. Suppressing a stack trace in the response is different from suppressing the internal diagnostic event.\n\n## 6. Structured events and correlation\n\nStructured logs let engineers filter by request ID, outcome and component. Request correlation identifies a transaction across services without placing secrets or personal details in log messages. Logs should preserve causality and be bounded in size. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nevent={\"request_id\":\"req-42\",\"action\":\"transfer\",\"ok\":False}\nassert \"password\" not in event\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** More logs can reduce security if they include raw authorization headers or sensitive bodies.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the debugging workshop.\n\n**Review question:** Which field helps join events across a request? Structured logs let engineers filter by request ID, outcome and component. More logs can reduce security if they include raw authorization headers or sensitive bodies.\n\n## 7. Race investigation\n\nA bug that only appears under load needs controlled concurrent reproduction. Use deterministic barriers or synchronized workers rather than hoping the race occurs. Capture transaction ordering and invariant failures; use atomic write conditions or locking to resolve the root cause. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport threading\nb=threading.Barrier(2)\nassert b.parties==2\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Passing a single-threaded test does not prove thread safety.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the debugging workshop.\n\n**Review question:** What helps reproduce a concurrency race reliably? A bug that only appears under load needs controlled concurrent reproduction. Passing a single-threaded test does not prove thread safety.\n\n## 8. Performance profiles and baselines\n\nOptimize after measuring. Capture timing, query counts and relevant input size. A growing N+1 query problem may dominate request time even if each individual query is fast. Use representative workloads and measure again after a targeted change. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nimport time\nt=time.perf_counter();sum(range(1000));elapsed=time.perf_counter()-t\nassert elapsed>=0\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A single timing sample is not evidence of a reliable performance improvement.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the debugging workshop.\n\n**Review question:** What should happen before optimization? Optimize after measuring. A single timing sample is not evidence of a reliable performance improvement.\n","# Computer science reasoning for working engineers\n\n## 1. State and invariants\n\nSoftware operates on state. For a transfer, source and destination balance change; the total across both accounts should remain invariant. For a curriculum, lesson completion changes; prerequisites must form an acyclic graph to support a valid sequence. State invariants turn vague “should work” requirements into properties that can be tested across successful and failed transitions.\n\nIdentify a state transition precisely: current state, action, preconditions, postconditions and failure behavior. A successful API status that accompanies a broken balance invariant is still a defect.\n\n## 2. Complexity is a growth model\n\nBig-O describes asymptotic growth rather than exact runtime. A simple loop over n records is usually O(n); a loop performing another n scan for each record becomes O(n²); a dictionary lookup is average O(1), although hash collisions and memory use affect actual performance. Complexity discussions should name n and the operation being counted. Choose data structures by access patterns, not fashion.\n\n```python\ncounts = {}\nfor event in events:\n    key = event['type']\n    counts[key] = counts.get(key, 0) + 1\n```\n\nExpected time is O(n) for n events; additional space is O(k) for k distinct event types. A list-only implementation that searches existing keys for every event would tend toward worse performance as k grows.\n\n## 3. Stacks, queues and graphs\n\nA stack removes the most recently added item first (LIFO); a queue removes the earliest item first (FIFO). Both appear in parsers, job schedulers, graph traversal and debugging tools. A dependency graph connects prerequisites to downstream tasks. A topological sort produces an order in which every prerequisite precedes its consumer; it only exists for directed acyclic graphs.\n\nDepth-first traversal commonly uses three states: unseen, visiting and complete. Encountering a visiting node again means you found a directed cycle. The Northstar curriculum verifier enforces this exact rule, making graph theory immediately relevant to software maintenance.\n\n## 4. Choosing architectural boundaries\n\nA modular monolith can clearly separate HTTP, domain and persistence layers without introducing network failures between every component. Distributed services add independent deployments but also retries, partial failure, authentication boundaries, latency and complex observability. Start with requirements and testable constraints. Draw a sequence diagram for a transfer and label each place a failure can occur. Ask how your design prevents double-processing and data loss.\n\n## 5. Exercises and engineering handoff\n\nThe CS workshop asks you to implement counts and deterministic topological ordering while rejecting cycles and missing prerequisites. Start by writing down a correctness invariant and estimate time/space complexity. After the tests pass, document an architecture decision: when should the banking service remain a monolith, and what measured requirement might justify splitting it? Connect this explanation to NS-C402 and the release review in NS-C408.\n\n## Case study: a curriculum cannot be scheduled\n\n**Incoming ticket:** A student is told that lesson B requires A, lesson C requires B, and lesson A requires C. The interface shows all three as locked. This is not a student-progress bug: it is a cycle in a directed dependency graph. Before displaying lesson cards, the curriculum validator should reject the invalid data rather than leaving every user stuck.\n\n**Trace a depth-first search:** Mark nodes as unseen, visiting or complete. Enter A (visiting), then B (visiting), then C (visiting), then encounter A again while A is still visiting. This is a cycle. A node already complete does **not** imply a cycle: it can be reused by a different downstream branch. Reject references to missing prerequisite nodes because an unknown lesson cannot be completed.\n\n**Work out an ordering:** Given A with no prerequisites, B requiring A, and C requiring both A and B, the valid order is A,B,C. If D is independent, multiple valid schedules exist. Define a deterministic tie break (e.g. sorted identifiers) so your tests do not fail on arbitrary dictionary iteration order. A topological sort should return each node exactly once with every prerequisite earlier than its dependent. Count the total edges E and nodes V; DFS-based topological ordering is O(V+E) aside from sorting cost.\n\n**Connect performance to engineering decisions:** Suppose a report processes one million events. An O(n²) duplicate search will perform far more comparisons than O(n) set membership on typical inputs. Measure small and medium datasets rather than trusting only a theoretical label. Memory constraints matter as well: maintaining a set of all distinct IDs consumes additional storage. State the data size and access pattern when choosing a structure.\n\n**Architecture handoff:** Draw a request-to-database diagram for the banking service. Identify the trust boundary at input, the transaction boundary in persistence and the verified invariants. Explain why splitting this small service into microservices would introduce extra failure modes without clearly solving the training product's immediate requirements.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Sets, maps and membership\n\nChoosing the right data structure changes complexity. Searching a list is typically linear, while set membership averages constant-time. Sets discard duplicates, so use them for membership or uniqueness, not for preserving ordered audit entries. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nallowed={\"alice\",\"bob\"}\nassert \"bob\" in allowed and \"eve\" not in allowed\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Average O(1) lookup does not mean constant runtime under every possible adversarial condition.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the cs workshop.\n\n**Review question:** Which structure models unique membership? Choosing the right data structure changes complexity. Average O(1) lookup does not mean constant runtime under every possible adversarial condition.\n\n## 6. Stacks, queues and scheduling\n\nA stack follows last-in-first-out and a queue follows first-in-first-out. Background jobs need explicit ordering, retries, dead-letter handling and deduplication; a simple Python deque models queue behavior but is not a durable job broker. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nfrom collections import deque\nq=deque([\"reconcile\",\"audit\"]);assert q.popleft()==\"reconcile\"\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** An in-process deque loses its contents if the process crashes.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the cs workshop.\n\n**Review question:** Which data structure best models FIFO tasks? A stack follows last-in-first-out and a queue follows first-in-first-out. An in-process deque loses its contents if the process crashes.\n\n## 7. Big-O tradeoffs and measurement\n\nAlgorithm analysis estimates growth as input expands. Sorting is often O(n log n), scanning is O(n), and a nested pairwise search is O(n²). Real performance also includes I/O, caching and database execution plans; benchmark alongside reasoning. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\ndef duplicates(items):\n    return len(set(items)) != len(items)\nassert duplicates([1,2,1])\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** Big-O alone does not establish latency or suitability for tiny fixed workloads.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the cs workshop.\n\n**Review question:** Which approach avoids a nested pairwise comparison for duplicates? Algorithm analysis estimates growth as input expands. Big-O alone does not establish latency or suitability for tiny fixed workloads.\n\n## 8. State machines and invariants\n\nServices move through defined states, and illegal transitions must be rejected. A transfer should progress from created to committed or rejected without reentering committed from a retry. Write transition tables and invariants before implementation. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.\n\n### Worked example\n\n```python\nallowed={\"created\":{\"committed\",\"rejected\"},\"committed\":set()}\nassert \"created\" not in allowed[\"committed\"]\n```\n\nExecute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.\n\n**Watch out:** A boolean flag is not always enough to capture lifecycle and retry semantics.\n\n**Practice:** Run the worked example, change one input to trigger a boundary case, and explain the result before completing the cs workshop.\n\n**Review question:** What protects workflow integrity? Services move through defined states, and illegal transitions must be rejected. A boolean flag is not always enough to capture lifecycle and retry semantics.\n","# Linux, processes & development environments\n\nProcess lifecycle, permissions, configuration and safe command execution are core workplace requirements. Learners reproduce faults with actual Python subprocesses and demonstrate resource cleanup.\n\n## Learning environment\n\nUse a local Python 3 runtime, avoid production secrets, and document input and output for every claim. The learner workshop deliberately starts with defects and its contract tests are meant to fail until repaired. Never expose training services on a public interface.\n\n\n# Extended engineering lessons · Stage 4.1A\n\n## 5. Environment and configuration\n\nEnvironment variables configure development services but are not a secure secret store. Treat

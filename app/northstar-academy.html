idence":"self-reported-practice"},{"id":"foundations-cs","title":"CS Engineering Foundations","ticket":"FND-CS-01…08","track":"core","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/foundations/cs","estimatedHours":12,"competencies":["algorithms"],"prerequisites":["foundations-python"],"summary":"State invariants, data structures, complexity and dependency graphs; eight progressive lessons in the portal and a runnable Python coding workshop.","publicRoute":"app/northstar-academy.html#foundations","evidence":"self-reported-practice"},{"id":"foundations-linux","title":"Linux & Process Engineering","ticket":"FND-LINUX-01…06","track":"core","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/foundations/linux","estimatedHours":12,"competencies":["linux"],"prerequisites":["foundations-python"],"summary":"Six progressive concepts, real test-driven workshop and engineering residency preparation for linux & process engineering.","publicRoute":"app/northstar-academy.html#foundations","evidence":"self-reported-practice"},{"id":"foundations-networking","title":"Networking & Socket Engineering","ticket":"FND-NETWORKING-01…06","track":"core","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/foundations/networking","estimatedHours":12,"competencies":["networking"],"prerequisites":["foundations-python"],"summary":"Six progressive concepts, real test-driven workshop and engineering residency preparation for networking & socket engineering.","publicRoute":"app/northstar-academy.html#foundations","evidence":"self-reported-practice"},{"id":"foundations-data-structures","title":"Data Structures & Algorithms","ticket":"FND-DATA-STRUCTURES-01…06","track":"core","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/foundations/data-structures","estimatedHours":12,"competencies":["data-structures"],"prerequisites"   var COMMERCIAL_PRACTICE={"schemaVersion":"1.0","modules":[{"id":"commercial-api-security","role":"Application Security Apprentice","sprint":"Commercial Residency · Sprint 1","context":"Northstar Bank's synthetic account service has two reported security defects. An engineer must reproduce them with authorized test identities, write regression tests, and patch the backend without breaking normal account lookups.","environmentNote":"Python 3 + SQLite + localhost HTTP server. The X-Demo-User header is a classroom identity simulation, NOT production authentication.","tasks":["Reproduce the cross-account access defect with two fictional customers and document expected vs actual behavior.","Trace the unsafe search query and replace string interpolation with bound SQL parameters.","Implement server-side per-object ownership checks on every relevant account lookup.","Run the regression suite, capture before/after evidence, and propose a peer-review summary."],"checks":[{"id":"bola","prompt":"Alex requests account 202, which belongs to Blair. Which control actually prevents broken object-level authorization?","choices":[{"value":"ui","label":"Hide the account link in the frontend"},{"value":"deny","label":"Enforce account ownership in the backend for every object request"},{"value":"obscure","label":"Make account IDs hard to guess"}],"answer":"deny","explanation":"Object access must be authorized server-side. Concealing links or IDs is not a security boundary."},{"id":"sql","prompt":"A search endpoint builds SQL from a user-provided query string. Which correction separates user data from SQL syntax?","choices":[{"value":"escape","label":"Strip quotes before concatenating the SQL"},{"value":"bound","label":"Use parameterized SQL with bound values"},{"value":"frontend","label":"Validate the value only in JavaScript"}],"answer":"bound","explanation":"SQL parameters prevent data from changing the statement structure. Also test authorization and intended search behavior."}],"evidence":[{"id":"repro","title":"I documented the defect and reproduction commands"},{"id":"tests","title":"I added regression tests and made them pass"},{"id":"review","title":"I prepared a concise patch and risk explanation"}],"terminal":["cd labs/commercial-api-security","bash run-checks.sh","python3 src/api.py --port 8080"],"acceptance":"The owner can access their account; nonowners cannot. Account search is parameterized. The learner test suite passes."},{"id":"commercial-transaction-integrity","role":"Secure Backend Engineering Apprentice","sprint":"Commercial Residency · Sprint 2","context":"A synthetic money-transfer service processes duplicate requests twice and sometimes writes a debit without the corresponding credit and audit record. Customers report inconsistent balances after retries and errors.","environmentNote":"Python 3 + SQLite local database. All balances and account holders are fabricated; the service processes no real money.","tasks":["Reproduce the duplicate side effect using the same request ID twice.","Define and enforce idempotency behavior for repeated requests and conflicting payloads.","Use a single database transaction for debit, credit, request record and audit log.","Reproduce mid-transaction failure, validate rollback and submit before/after tests and a design summary."],"checks":[{"id":"retry","prompt":"The same transfer request ID arrives twice with identical arguments. What should a retry do?","choices":[{"value":"again","label":"Repeat the debit and credit"},{"value":"once","label":"Return the previously recorded outcome without repeating the transfer"},{"value":"drop","label":"Reject all retries without recording results"}],"answer":"once","explanation":"Idempotency keys identify operations and let a safe replay return the prior outcome without repeating side effects. Reject key reuse with different arguments."},{"id":"atomic","prompt":"A crash occurs after a debit but before a credit and ledger entry. What guarantees consistent recovery?","choices":[{"value":"first","label":"Commit the debit as soon as possible"},{"value":"atomic","label":"Commit all related changes together or roll all of them back"},{"value":"ignore","label":"Ignore the error and report success"}],"answer":"atomic","explanation":"A database transaction must commit every related write together or roll all of them back. Failure-injection tests should prove this."}],"evidence":[{"id":"repro","title":"I reproduced the duplicate-processing or partial-commit defect"},{"id":"tests","title":"I validated idempotency, conflict handling and atomic rollback"},{"id":"review","title":"I documented the change and its failure modes"}],"terminal":["cd labs/commercial-transaction-integrity","bash run-checks.sh","python3 src/cli.py --db /tmp/ns-demo-ledger.sqlite3"],"acceptance":"Same-key retries do not repeat transfers; conflicting payloads are rejected and failures leave all balances and records unchanged. All learner tests pass."}]};
  var FOUNDATIONS={"schemaVersion":"1.0","release":"stage4.1A-4.1B","title":"Engineering Foundations: 72 sequenced lessons, 10 native workshops and residency bridges","disclaimer":"Formative checks are visible in the browser. Progress is self-reported, local and NOT proof of code proficiency.","units":[{"id":"python","title":"Python & program structure","overview":"An engineer must read unfamiliar code, model invariants, and predict how values move between functions. Python is not merely syntax: students must distinguish mutable from immutable objects, handle untrusted input deliberately, and isolate logic so it can be tested. In the banking service, a request handler calls functions that query records and produce dictionaries. Understanding these boundaries is essential before fixing a ticket.","targetTickets":["NS-C401","NS-C402"],"guide":"docs/foundations/python.md","lab":"labs/foundations/python"},{"id":"http","title":"HTTP, APIs & network contracts","overview":"An HTTP API is a public contract across process boundaries. A successful socket connection says little about whether a response is valid or safe. Engineers need to reason about methods, paths, headers, status codes, representations, authorization boundaries, timeouts and retries. The banking residency begins with a /health contract and eventually serves user-specific resources; both require predictable responses and failure semantics.","targetTickets":["NS-C401","NS-C403","NS-C407"],"guide":"docs/foundations/http.md","lab":"labs/foundations/http"},{"id":"sql","title":"SQL & relational data modeling","overview":"Real applications store data that must survive crashes and concurrent requests. Relational modeling, parameterized queries, constraints, transactions and isolation are foundational to secure backend work. A banking system has correctness invariants: balance must be represented precisely, transfers must not partially apply, and every returned record must be scoped to an authorized caller.","targetTickets":["NS-C402","NS-C404","NS-C405","NS-C406"],"guide":"docs/foundations/sql.md","lab":"labs/foundations/sql"},{"id":"testing","title":"Testing & quality engineering","overview":"A useful test is a reproducible claim about behavior. Tests should isolate assumptions, cover expected and failure cases, and survive implementation refactors without encoding private details. Northstar’s banking code has contract and integration suites; an engineer should understand why a test exists, how to reproduce it, and whether a passing suite actually establishes the property claimed.","targetTickets":["NS-C401","NS-C405","NS-C408"],"guide":"docs/foundations/testing.md","lab":"labs/foundations/testing"},{"id":"debugging","title":"Debugging & observability","overview":"Debugging is disciplined hypothesis testing. A ticket gives symptoms, but the engineer must establish a reproducible scenario, localize the fault, examine runtime evidence, create a minimal fix, and guard against regression. Logging, traces and stack traces are clues, not conclusions. Sensitive information must not be exposed in diagnostic output.","targetTickets":["NS-C401","NS-C407","NS-C408"],"guide":"docs/foundations/debugging.md","lab":"labs/foundations/debugging"},{"id":"cs","title":"Computer science & engineering reasoning","overview":"Computer science fundamentals help engineers predict behavior before deploying code. Choosing data structures affects performance; understanding state and invariants prevents financial correctness bugs; tracing dependencies and failure modes turns complicated software into understandable components. This unit introduces reasoning skills that should carry into later discrete mathematics, algorithms and systems engineering.","targetTickets":["NS-C402","NS-C405","NS-C408"],"guide":"docs/foundations/cs.md","lab":"labs/foundations/cs"},{"id":"linux","title":"Linux, processes & development environments","overview":"Process lifecycle, permissions, configuration and safe command execution are core workplace requirements. Learners reproduce faults with actual Python subprocesses and demonstrate resource cleanup.","targetTickets":["NS-C401","NS-C408"],"guide":"docs/foundations/linux.md","lab":"labs/foundations/linux"},{"id":"networking","title":"Networking, sockets & service operations","overview":"Understand the packet-to-API stack and its trust boundaries: IP and ports, TCP stream framing, TLS, HTTP and proxies. Real network faults reveal why a green socket is not the same as a correct service.","targetTickets":["NS-C401","NS-C407"],"guide":"docs/foundations/networking.md","lab":"labs/foundations/networking"},{"id":"data-structures","title":"Data structures & algorithms","overview":"Choose and justify collections and complexity using authentic account, job-queue and dependency examples. Practice invariants and performance before using these concepts in banking workflows.","targetTickets":["NS-C402","NS-C408"],"guide":"docs/foundations/data-structures.md","lab":"labs/foundations/data-structures"},{"id":"architecture","title":"Software architecture & system design","overview":"Trace code and data through explicit modules, isolate transport from business policy, and reason about migration, failure modes and reliability before implementing advanced service changes.","targetTickets":["NS-C401","NS-C408"],"guide":"docs/foundations/architecture.md","lab":"labs/foundations/architecture"}],"lessons":[{"id":"FND-PYTHON-01","unit":"python","position":1,"title":"Values, decisions and explicit contracts","level":"foundation","prerequisites":[],"objectives":["Explain values, decisions and explicit contracts in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A function is a contract: it specifies what inputs it accepts, what result it produces, and how invalid inputs behave. Do not hide failure by silently substituting a default; callers may mistake an invalid account for a valid one. In Python, a boolean is also an integer subclass, so type checks involving numeric identifiers deserve care.","code":"def positive_id(raw):\n    if isinstance(raw, bool) or not isinstance(raw, int):\n        raise ValueError(\"integer required\")\n    if raw \u003c= 0:\n        raise ValueError(\"must be positive\")\n    return raw","walkthrough":"The function rejects booleans even though isinstance(True, int) is true. The exception marks a violated contract, rather than inventing a usable identifier.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Why explicitly exclude bool from an integer identifier check?","choices":["Because bool is a subclass of int","Because bool cannot appear in JSON","Because Python variables are untyped"],"answer":0,"rationale":"Python treats True as 1 in numeric contexts; a strict identifier contract should not."},"hints":["Revisit the contract: values, decisions and explicit contracts.","Python treats True as 1 in numeric contexts; a strict identifier contract should not.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Try the positive_id function with -1, 0, True and 7. Define the input and exception policy before coding.","bridge":["NS-C401","NS-C402"],"workshop":"labs/foundations/python/README.md"},{"id":"FND-PYTHON-02","unit":"python","position":2,"title":"Lists, dictionaries and aliasing","level":"guided","prerequisites":["FND-PYTHON-01"],"objectives":["Explain lists, dictionaries and aliasing in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A list preserves order; a dictionary maps unique keys to values. Both are mutable, so passing a dictionary to another function may let that function change the caller’s object. Use copy semantics intentionally and never expose mutable internal account state through public API responses. Iterate using descriptive names and separate the shape of stored records from the shape of returned data.","code":"account = {\"owner\":\"alice\",\"balance\":100}\npublic = dict(account)\npublic.pop(\"balance\")\nassert \"balance\" in account","walkthrough":"dict(account) makes a shallow copy. For nested structures, changes to a nested list may still affect the original: consider copy.deepcopy when needed.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"What does dict(account) guarantee?","choices":["A shallow independent mapping","A recursive deep copy","An immutable account"],"answer":0,"rationale":"It copies the outer mapping but not nested mutable objects."},"hints":["Revisit the contract: lists, dictionaries and aliasing.","It copies the outer mapping but not nested mutable objects.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Build a mapping from account owner to account IDs. Verify the input list remains unchanged.","bridge":["NS-C401","NS-C402"],"workshop":"labs/foundations/python/README.md"},{"id":"FND-PYTHON-03","unit":"python","position":3,"title":"Modules, exceptions and separation of concerns","level":"guided","prerequisites":["FND-PYTHON-02"],"objectives":["Explain modules, exceptions and separation of concerns in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A service handler should translate HTTP requests and responses; business logic should enforce rules; database code should persist state. This separation makes code understandable and independently testable. Exceptions signal failures; catch them at an appropriate boundary where the service can produce a stable error response. Avoid a broad except Exception that converts programming bugs into misleading success results.","code":"def get_account(bank, actor, account_id):\n    account = bank.lookup(actor, account_id)\n    if account is None:\n        raise LookupError(\"not found\")\n    return {\"id\": account[\"id\"]}","walkthrough":"The service layer can catch LookupError and map it to an HTTP status, while unexpected programming errors should be diagnosed and logged safely.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Where should an HTTP status code be selected?","choices":["At the HTTP boundary","Inside every SQL query","In the unit test fixture only"],"answer":0,"rationale":"Keep business errors independent from the transport protocol."},"hints":["Revisit the contract: modules, exceptions and separation of concerns.","Keep business errors independent from the transport protocol.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Trace app/server.py to app/bank.py. Sketch each layer’s responsibility and identify two places an exception can arise.","bridge":["NS-C401","NS-C402"],"workshop":"labs/foundations/python/README.md"},{"id":"FND-PYTHON-04","unit":"python","position":4,"title":"Iterators, complexity and independent refactoring","level":"independent","prerequisites":["FND-PYTHON-03"],"objectives":["Explain iterators, complexity and independent refactoring in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Comprehensions are concise but not automatically faster or clearer. For n records, a one-pass dictionary aggregation can be O(n) on average; searching an accumulated list for every record can become O(n²). Memory usage also matters. Optimize based on expected input size and tested behavior, not aesthetics. An independent engineer should explain a choice and provide a regression test.","code":"totals = {}\nfor item in records:\n    owner = item[\"owner\"]\n    totals[owner] = totals.get(owner, 0) + item[\"cents\"]","walkthrough":"Each record is processed once. Dictionary lookups are average O(1), while the aggregation consumes O(k) extra storage for k distinct owners.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"For n records, which approach is expected O(n) time?","choices":["Single-pass dictionary accumulation","Nested comparison of every pair","Sorting every prefix repeatedly"],"answer":0,"rationale":"An average constant-time lookup inside one pass makes the total linear."},"hints":["Revisit the contract: iterators, complexity and independent refactoring.","An average constant-time lookup inside one pass makes the total linear.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Complete foundations/python/starter.py with the test suite and submit a short explanation of your algorithmic complexity.","bridge":["NS-C401","NS-C402"],"workshop":"labs/foundations/python/README.md"},{"id":"FND-HTTP-01","unit":"http","position":1,"title":"Requests, responses and layers","level":"foundation","prerequisites":["FND-PYTHON-03"],"objectives":["Explain requests, responses and layers in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"An HTTP request contains a method, target, headers and optionally a body. The response returns a status, headers and representation. The URL identifies the resource; it is not a guarantee of access. Application code should parse input without assuming clients are honest. Learn to read a raw exchange before using frameworks that hide these mechanics.","code":"GET /health HTTP/1.1\nHost: 127.0.0.1:8765\nAccept: application/json\n\nHTTP/1.1 200 OK\nContent-Type: application/json\n\n{\"status\":\"ok\"}","walkthrough":"The status and Content-Type inform how the client interprets the body. Health check response shape is part of the API contract.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Where is the response status code found?","choices":["The status line","The URL path","Only in JSON"],"answer":0,"rationale":"HTTP status is transport metadata; a JSON status field is application data."},"hints":["Revisit the contract: requests, responses and layers.","HTTP status is transport metadata; a JSON status field is application data.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Use curl -i on the local /health route and annotate the method, path, headers, status and body.","bridge":["NS-C401","NS-C403","NS-C407"],"workshop":"labs/foundations/http/README.md"},{"id":"FND-HTTP-02","unit":"http","position":2,"title":"Methods, status codes and safe semantics","level":"guided","prerequisites":["FND-HTTP-01"],"objectives":["Explain methods, status codes and safe semantics in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"GET retrieves a representation without intentionally changing server state. POST usually submits a state-changing operation. Status codes describe classes of outcome: 2xx success, 4xx client issues, 5xx service failures. 401 indicates missing or invalid authentication; 403 denies authenticated access; 404 may hide the existence of an inaccessible record when consistently applied. The body must not leak a secret.","code":"GET /accounts/7 HTTP/1.1\nX-Demo-User: alice\n\nHTTP/1.1 404 Not Found\nContent-Type: application/json","walkthrough":"A 404 can be a deliberate privacy-preserving response even when account 7 exists, if the caller lacks permission. The demo identity is not authentication.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Which status conventionally represents an unauthenticated request?","choices":["401","201","503"],"answer":0,"rationale":"401 is about authentication; 403 is about authorization."},"hints":["Revisit the contract: methods, status codes and safe semantics.","401 is about authentication; 403 is about authorization.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"In the HTTP workshop return well-defined statuses for a valid request, missing resource and malformed identifier.","bridge":["NS-C401","NS-C403","NS-C407"],"workshop":"labs/foundations/http/README.md"},{"id":"FND-HTTP-03","unit":"http","position":3,"title":"Validation, serialization and pagination","level":"guided","prerequisites":["FND-HTTP-02"],"objectives":["Explain validation, serialization and pagination in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"JSON is a data interchange format; type validation is still required. \"10\" is not the same JSON value as 10, and an empty object may be valid JSON but invalid business input. Pagination limits response size and makes client behavior predictable. Set a bounded maximum limit, a documented offset policy, and stable ordering; otherwise clients can skip or duplicate records.","code":"limit = min(max(int(raw_limit), 1), 50)\noffset = max(int(raw_offset), 0)\nrows = query(order_by=\"id\", limit=limit, offset=offset)","walkthrough":"This sketch assumes integers can be parsed; production code must catch ValueError and return a documented client error rather than crashing.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Why sort before applying offset pagination?","choices":["To make page membership deterministic","To guarantee authorization","To encrypt the response"],"answer":0,"rationale":"Without stable ordering, requests for adjacent pages may overlap or miss items."},"hints":["Revisit the contract: validation, serialization and pagination.","Without stable ordering, requests for adjacent pages may overlap or miss items.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Trace /accounts in the residency. Test a negative limit, an excessive limit and two adjacent pages.","bridge":["NS-C401","NS-C403","NS-C407"],"workshop":"labs/foundations/http/README.md"},{"id":"FND-HTTP-04","unit":"http","position":4,"title":"Retries, idempotency and failure analysis","level":"independent","prerequisites":["FND-HTTP-03"],"objectives":["Explain retries, idempotency and failure analysis in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Networks can fail after a request succeeds but before the response reaches the client. A client that retries an operation may accidentally execute it twice. GET is intended to be safe; a POST transfer is not automatically idempotent. Use a server-enforced idempotency key with a consistent request fingerprint, durable storage and atomic result recording. The client should distinguish timeouts from documented 4xx outcomes.","code":"POST /transfers HTTP/1.1\nIdempotency-Key: demo-transaction-42\nContent-Type: application/json\n\n{\"from\":1,\"to\":2,\"cents\":500}","walkthrough":"A repeated request with the same key and same content must not repeat the debit. A reused key with different content must not silently adopt the first result.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"A client times out after a successful transfer. What prevents a repeated debit?","choices":["Durable server-side idempotency enforcement","A longer client timeout only","Changing POST to GET"],"answer":0,"rationale":"Retries are a distributed-systems concern: the server must recognize previously committed operations."},"hints":["Revisit the contract: retries, idempotency and failure analysis.","Retries are a distributed-systems concern: the server must recognize previously committed operations.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Add idempotency tests to the HTTP workshop, then explain why a local-memory key cache is insufficient for restarts.","bridge":["NS-C401","NS-C403","NS-C407"],"workshop":"labs/foundations/http/README.md"},{"id":"FND-SQL-01","unit":"sql","position":1,"title":"Tables, keys and invariants","level":"foundation","prerequisites":["FND-PYTHON-02"],"objectives":["Explain tables, keys and invariants in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A relational table has rows and columns; a primary key uniquely identifies a row, while a foreign key links valid related rows. Design constraints to enforce rules close to the data, not only in a view or browser. Store money in integer minor units rather than binary floating point. A CHECK constraint can reject negative balances, but it does not replace application authorization.","code":"CREATE TABLE accounts (\n id INTEGER PRIMARY KEY,\n owner TEXT NOT NULL,\n cents INTEGER NOT NULL CHECK(cents >= 0)\n);","walkthrough":"The table rejects negative cents, supporting a business invariant even if a developer writes an incorrect update.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Why store whole cents instead of binary floating point?","choices":["Precise minor-unit arithmetic","It removes all concurrency concerns","It automatically proves authorization"],"answer":0,"rationale":"Floating-point approximations can create rounding surprises in monetary calculations."},"hints":["Revisit the contract: tables, keys and invariants.","Floating-point approximations can create rounding surprises in monetary calculations.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Create two tables with keys and constraints in an in-memory SQLite database; try violating each constraint.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-SQL-02","unit":"sql","position":2,"title":"SELECT, JOIN and predictable scoping","level":"guided","prerequisites":["FND-SQL-01"],"objectives":["Explain select, join and predictable scoping in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"SQL is declarative: describe which rows you need rather than how to iterate through them. Never retrieve all accounts and then filter by current user in a separate layer when the query can include the ownership predicate. Parameter placeholders prevent values from becoming executable SQL. For JOINs, qualify columns to avoid accidentally mixing identities or exposing unrelated data.","code":"SELECT id, cents FROM accounts\nWHERE owner = ? AND id = ?\nORDER BY id;","walkthrough":"Both actor and requested identifier are bound as data, and the authorization predicate travels with the query.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Where should the account-owner predicate be enforced?","choices":["In the data-access query as part of authorization","Only by hiding frontend buttons","Only in a README"],"answer":0,"rationale":"Server-side authorization must be enforced regardless of what a client renders."},"hints":["Revisit the contract: select, join and predictable scoping.","Server-side authorization must be enforced regardless of what a client renders.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Implement an owner-scoped listing with LIMIT and OFFSET in the SQL workshop.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-SQL-03","unit":"sql","position":3,"title":"Transactions, rollback and atomicity","level":"guided","prerequisites":["FND-SQL-02"],"objectives":["Explain transactions, rollback and atomicity in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"One transfer modifies at least two balances; the updates must succeed together or not at all. BEGIN starts a transaction, COMMIT makes changes durable, and ROLLBACK discards uncommitted changes. Think in invariants: if funds move between accounts, the total should remain constant and no balance should go below zero. Simulate a failure after the debit and assert both original balances remain.","code":"BEGIN;\nUPDATE accounts SET cents=cents-500 WHERE id=1;\nUPDATE accounts SET cents=cents+500 WHERE id=2;\nCOMMIT;","walkthrough":"For an actual safe transfer, also verify ownership, available funds and that both target accounts exist; the example illustrates atomic grouping only.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"After a rollback, what happens to an uncommitted debit?","choices":["It is undone","It is always retained","It gets copied to the audit log"],"answer":0,"rationale":"Rollback reverses changes made in that transaction."},"hints":["Revisit the contract: transactions, rollback and atomicity.","Rollback reverses changes made in that transaction.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Make the SQL workshop transfer function rollback when the credit fails; verify both balances in a test.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-SQL-04","unit":"sql","position":4,"title":"Concurrency, indexes and query plans","level":"independent","prerequisites":["FND-SQL-03"],"objectives":["Explain concurrency, indexes and query plans in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A transaction does not automatically solve all concurrent update anomalies. Consider two workers reading the same initial balance and issuing overlapping writes. Database isolation, conditional updates, locking and UNIQUE constraints must be designed for the database in use. SQLite and PostgreSQL differ in locking and isolation behavior. An index accelerates predicates at the cost of write/storage overhead; EXPLAIN QUERY PLAN reveals actual access paths.","code":"UPDATE accounts SET cents=cents-?\nWHERE id=? AND owner=? AND cents>=?;","walkthrough":"A conditional update can preserve the nonnegative-balance invariant if the affected-row count is checked within the transaction.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Why inspect the affected row count after a conditional UPDATE?","choices":["Zero may mean missing permission or insufficient funds","It guarantees low latency","It makes the query read-only"],"answer":0,"rationale":"A no-op update should be distinguished from a successful transfer debit."},"hints":["Revisit the contract: concurrency, indexes and query plans.","A no-op update should be distinguished from a successful transfer debit.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Investigate the banking transfer implementation: what would change under two concurrent requests? Document assumptions specific to SQLite.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-TESTING-01","unit":"testing","position":1,"title":"Arrange, act, assert and test boundaries","level":"foundation","prerequisites":["FND-PYTHON-01"],"objectives":["Explain arrange, act, assert and test boundaries in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A test sets up a known state, performs one meaningful action and checks an observable outcome. The failure message should describe the contract. Unit tests are fast and narrow; integration tests verify several components cooperate. Avoid depending on test execution order, clocks or network availability unless the test specifically examines them.","code":"def test_positive_balance(self):\n    bank = make_bank(balance=100)\n    result = bank.balance(account_id=1)\n    self.assertEqual(result, 100)","walkthrough":"The assertion checks externally visible behavior rather than the name of an internal variable.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Which test design resists internal refactoring best?","choices":["Checking contract behavior","Reading internal local variable names","Depending on test order"],"answer":0,"rationale":"Contracts remain stable even when implementation details change."},"hints":["Revisit the contract: arrange, act, assert and test boundaries.","Contracts remain stable even when implementation details change.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Write a positive and negative test for Python normalize records; do not copy the implementation logic into the test.","bridge":["NS-C401","NS-C405","NS-C408"],"workshop":"labs/foundations/testing/README.md"},{"id":"FND-TESTING-02","unit":"testing","position":2,"title":"Boundary cases and negative paths","level":"guided","prerequisites":["FND-TESTING-01"],"objectives":["Explain boundary cases and negative paths in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Most high-impact defects occur at the edge of assumptions: empty collections, zero amounts, missing records, unexpected types, overflow limits and unauthorized callers. Enumerate equivalence classes rather than guessing. A negative test should verify the absence of an unsafe side effect, not only the error text. For security, test two distinct users and ensure one cannot view the other’s account.","code":"with self.assertRaises(ValueError):\n    transfer(cents=0)\nself.assertEqual(balance_before, balance_after)","walkthrough":"The second assertion is essential: raising an error does not prove no debit occurred.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"A transfer rejects zero cents. What else should the test establish?","choices":["Balances are unchanged","A stack trace is returned to client","The code took exactly 1 ms"],"answer":0,"rationale":"Tests should verify state invariants on failure paths."},"hints":["Revisit the contract: boundary cases and negative paths.","Tests should verify state invariants on failure paths.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Add tests for missing owner, blank identifiers, repeated idempotency keys and simulated credit failure.","bridge":["NS-C401","NS-C405","NS-C408"],"workshop":"labs/foundations/testing/README.md"},{"id":"FND-TESTING-03","unit":"testing","position":3,"title":"Fixtures, integration and HTTP contracts","level":"guided","prerequisites":["FND-TESTING-02"],"objectives":["Explain fixtures, integration and http contracts in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A fixture prepares isolated dependencies, such as a fresh in-memory SQLite database. An HTTP integration test starts a local-only server on an ephemeral port, sends a real request and checks status, body and side effects. Keep test state hermetic; sharing one database across tests makes outcomes order-dependent. Reserve end-to-end tests for essential flows rather than using them for every helper.","code":"with self.assertRaises(HTTPError) as caught:\n    urlopen(private_url)\nself.assertEqual(caught.exception.code, 404)","walkthrough":"The network contract is observed at the HTTP boundary and can detect mismatched error mapping across layers.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Why prefer a fresh fixture for each test?","choices":["Prevent state leakage between tests","Guarantee no bugs can exist","Make every test use live production data"],"answer":0,"rationale":"Repeatable tests begin from controlled state. Consider the behavior for invalid input and a failing operation before treating the contract as correct."},"hints":["Revisit the contract: fixtures, integration and http contracts.","Repeatable tests begin from controlled state.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Create a localhost HTTP contract test for one health endpoint and one unauthorized access result.","bridge":["NS-C401","NS-C405","NS-C408"],"workshop":"labs/foundations/testing/README.md"},{"id":"FND-TESTING-04","unit":"testing","position":4,"title":"Regression strategy and testing limits","level":"independent","prerequisites":["FND-TESTING-03"],"objectives":["Explain regression strategy and testing limits in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A test suite is evidence, not proof that software is correct. A regression test should reproduce a real failure before you fix it and pass afterward. Test the branch where the defect used to occur. Mutation testing asks whether deliberate incorrect changes cause tests to fail; code coverage alone counts execution rather than meaningful assertions. CI should fail on regressions and provide reproducible diagnostic output.","code":"def test_transfer_rollback(self):\n    with self.assertRaises(RuntimeError):\n        bank.transfer(fail_after_debit=True)\n    self.assertEqual(bank.total_cents(), initial_total)","walkthrough":"This property catches a partially committed debit even if the endpoint reports an error correctly.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Can 100% line coverage prove a transfer is atomic?","choices":["No, the assertions must exercise failure invariants","Yes, every executed line is correct","Only if the test runner is Python"],"answer":0,"rationale":"Coverage is not a substitute for assertions about important properties."},"hints":["Revisit the contract: regression strategy and testing limits.","Coverage is not a substitute for assertions about important properties.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Use the testing workshop to write a minimal test that fails against the supplied buggy implementation, then fix the defect.","bridge":["NS-C401","NS-C405","NS-C408"],"workshop":"labs/foundations/testing/README.md"},{"id":"FND-DEBUGGING-01","unit":"debugging","position":1,"title":"Reproduce and reduce the problem","level":"foundation","prerequisites":["FND-TESTING-01"],"objectives":["Explain reproduce and reduce the problem in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Describe the expected behavior, observed behavior, exact inputs and environment. Reproduce before changing code. Simplify the scenario to the minimum request or function call that still exhibits the defect. A failed curl command caused by starting the server incorrectly is not evidence of an application defect. Keep an evidence trail so another engineer can repeat the experiment.","code":"python3 -m unittest tests.test_sprint1 -v\npython3 -m app.server --port 8765\ncurl -i http://127.0.0.1:8765/health","walkthrough":"Separate test execution from server startup; each command addresses a different layer of failure.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"What should you do before patching a reported bug?","choices":["Reproduce the observable failure","Replace the entire module","Ignore test fixtures"],"answer":0,"rationale":"A clear reproduction distinguishes cause from coincidence."},"hints":["Revisit the contract: reproduce and reduce the problem.","A clear reproduction distinguishes cause from coincidence.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Write a reproduction note for the health contract with commands, expected result, observed result and environment.","bridge":["NS-C401","NS-C407","NS-C408"],"workshop":"labs/foundations/debugging/README.md"},{"id":"FND-DEBUGGING-02","unit":"debugging","position":2,"title":"Call stacks, state and exceptions","level":"guided","prerequisites":["FND-DEBUGGING-01"],"objectives":["Explain call stacks, state and exceptions in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A call stack shows the active chain of functions; the point where an exception is raised may be downstream from the original input error. Check arguments at each boundary and ask where the invariant was first broken. Use breakpoints or a small focused print during development, then remove unsafe debug output before release. Stack traces belong in internal diagnostics, not public API bodies.","code":"def handler(request):\n    user = parse_user(request)\n    return bank.lookup(user, request.path)","walkthrough":"A wrong parse_user result can make a correct lookup behave incorrectly; examine the input at each stage.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Where should you look if lookup receives the wrong actor?","choices":["The caller and parse boundary","Only the database index","Only the CSS"],"answer":0,"rationale":"Trace the value backward to where it became incorrect."},"hints":["Revisit the contract: call stacks, state and exceptions.","Trace the value backward to where it became incorrect.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Use pdb or a breakpoint on a small Python helper; record the variable value before and after the bug.","bridge":["NS-C401","NS-C407","NS-C408"],"workshop":"labs/foundations/debugging/README.md"},{"id":"FND-DEBUGGING-03","unit":"debugging","position":3,"title":"Structured logs and safe telemetry","level":"guided","prerequisites":["FND-DEBUGGING-02"],"objectives":["Explain structured logs and safe telemetry in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Logs should include event type, correlation ID and enough context to diagnose failures, while excluding passwords, tokens and raw private customer details. Avoid logging entire request bodies by default. Distinguish events from mutable application state, and keep stable structured fields so downstream searches remain reliable. Log at the right level: a rejected request is not always a server outage.","code":"{\"event\":\"transfer_rejected\",\"request_id\":\"req-72\",\n \"reason\":\"insufficient_funds\"}","walkthrough":"The log identifies what happened without exposing balances, personal data, authentication headers or secrets.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"What should an audit-safe log omit?","choices":["Access tokens and raw secret values","Event type","Correlation identifier"],"answer":0,"rationale":"Telemetry must not become a new disclosure path. Consider the behavior for invalid input and a failing operation before treating the contract as correct."},"hints":["Revisit the contract: structured logs and safe telemetry.","Telemetry must not become a new disclosure path.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Implement sanitization in the debugging workshop and demonstrate that authorization headers are not emitted.","bridge":["NS-C401","NS-C407","NS-C408"],"workshop":"labs/foundations/debugging/README.md"},{"id":"FND-DEBUGGING-04","unit":"debugging","position":4,"title":"Root-cause report and regression","level":"independent","prerequisites":["FND-DEBUGGING-03"],"objectives":["Explain root-cause report and regression in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A root-cause report separates trigger, defect, impact, resolution and prevention. The cause is not merely \"the endpoint failed\": identify which condition violated which assumption. Include the smallest reproduction, changed files, before-and-after tests and rollback considerations. If your hypothesis fails, record what was learned and iterate rather than making an unsupported claim.","code":"Trigger: unknown account\nDefect: missing null check\nImpact: HTTP 500 instead of 404\nFix: handle missing row\nRegression: test_missing_account","walkthrough":"Each statement has a distinct purpose and should point to reproducible evidence, not a vague statement that the bug is fixed.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"What makes a root-cause claim defensible?","choices":["A reproduction linked to code path and regression test","A confident assertion without logs","Only a screenshot of the homepage"],"answer":0,"rationale":"Traceability matters more than polished wording. Consider the behavior for invalid input and a failing operation before treating the contract as correct."},"hints":["Revisit the contract: root-cause report and regression.","Traceability matters more than polished wording.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Create a root-cause note for the deliberately defective workshop and compare it with the banking ticket review fields.","bridge":["NS-C401","NS-C407","NS-C408"],"workshop":"labs/foundations/debugging/README.md"},{"id":"FND-CS-01","unit":"cs","position":1,"title":"State, invariants and decomposition","level":"foundation","prerequisites":["FND-PYTHON-02"],"objectives":["Explain state, invariants and decomposition in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A system state is everything needed to predict its next behavior. An invariant is a property that must remain true across allowed transitions. Instead of checking only that a function returned success, check the state after the operation. Break large problems into small pure computations and controlled mutations. For a transfer between two existing accounts, total system balance should not change.","code":"before = debit_cents + credit_cents\n# perform safe transfer\nafter = debit_cents_new + credit_cents_new\nassert after == before","walkthrough":"The conservation invariant detects lost or invented funds, including failures that a happy-path HTTP response may not reveal.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Which property is a state invariant for an internal transfer?","choices":["Total balance remains constant","Every API response is status 200","Every list is sorted"],"answer":0,"rationale":"An invariant is a property across all permitted state transitions."},"hints":["Revisit the contract: state, invariants and decomposition.","An invariant is a property across all permitted state transitions.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Define three invariants for the banking service and create a test case that violates each.","bridge":["NS-C402","NS-C405","NS-C408"],"workshop":"labs/foundations/cs/README.md"},{"id":"FND-CS-02","unit":"cs","position":2,"title":"Big-O and choosing data structures","level":"guided","prerequisites":["FND-CS-01"],"objectives":["Explain big-o and choosing data structures in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Big-O describes how resource needs grow with input size, not exact runtime. A dictionary lookup is O(1) on average while a linear scan over n records is O(n). A nested scan over n-by-n combinations can reach O(n²). Use lists for ordered sequences, dictionaries for key lookup, sets for membership, queues for first-in-first-out work and stacks for last-in-first-out processing.","code":"seen = set()\nfor item in events:\n    if item[\"id\"] in seen:\n        continue\n    seen.add(item[\"id\"])","walkthrough":"The set avoids rescanning every earlier event; average membership is O(1), giving an expected O(n) pass over n events.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"What is expected time for set membership in Python?","choices":["Average O(1)","Always O(n²)","Always O(log n)"],"answer":0,"rationale":"Hash-table operations are average constant time, though worst cases differ."},"hints":["Revisit the contract: big-o and choosing data structures.","Hash-table operations are average constant time, though worst cases differ.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Compare duplicate detection with a list and a set on datasets of increasing sizes.","bridge":["NS-C402","NS-C405","NS-C408"],"workshop":"labs/foundations/cs/README.md"},{"id":"FND-CS-03","unit":"cs","position":3,"title":"Graphs, prerequisites and cycle detection","level":"guided","prerequisites":["FND-CS-02"],"objectives":["Explain graphs, prerequisites and cycle detection in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"A learning curriculum and a software build both contain dependency graphs. If lesson B depends on A, A must be completed first. A directed cycle such as A→B→A makes a strict prerequisite order impossible. Depth-first search can classify a node as unseen, visiting or complete; reaching a visiting node identifies a cycle. This exact property is validated by the curriculum registry tests.","code":"visiting = set()\nvisited = set()\ndef visit(node):\n    if node in visiting: raise ValueError(\"cycle\")\n    if node in visited: return\n    visiting.add(node)\n    for parent in deps[node]: visit(parent)\n    visiting.remove(node)\n    visited.add(node)","walkthrough":"Marking complete only after all parents have been traversed produces a valid dependency-first ordering.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"What does encountering a visiting node during DFS indicate?","choices":["A directed cycle","A stable topological ordering","A unique primary key"],"answer":0,"rationale":"A node on the current DFS path cannot be its own prerequisite."},"hints":["Revisit the contract: graphs, prerequisites and cycle detection.","A node on the current DFS path cannot be its own prerequisite.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Implement deterministic topological ordering in the CS workshop and test both an acyclic graph and a cycle.","bridge":["NS-C402","NS-C405","NS-C408"],"workshop":"labs/foundations/cs/README.md"},{"id":"FND-CS-04","unit":"cs","position":4,"title":"Tradeoffs, interfaces and system design","level":"independent","prerequisites":["FND-CS-03"],"objectives":["Explain tradeoffs, interfaces and system design in the context of a real system","Interpret a worked example and its failure modes","Apply the concept in a runnable Python workshop"],"explanation":"Architecture is a set of tradeoffs, not a contest to use the most services. A modular monolith keeps deployment simple and can have strong internal boundaries; splitting into networked services adds latency, coordination and failure modes. Draw the data flow, identify trust boundaries, define ownership of invariants and plan how to observe failures. Only introduce queues, caching or microservices when a measurable requirement demands them.","code":"Client -> HTTP adapter -> domain rules -> SQLite\n                  |                  |\n             validation         transaction","walkthrough":"A clear single-service design makes it easier to reason about where authorization and transactional invariants must be enforced.","misconception":"A correct example is not proof that every input and failure path is safe. Test boundary cases and articulate the assumptions before considering the work complete.","check":{"prompt":"Which change best justifies a new service?","choices":["A measured need with clear ownership and tradeoff analysis","A preference for more technologies","Avoiding all documentation"],"answer":0,"rationale":"Architectural complexity should solve a real constraint, not create new ones."},"hints":["Revisit the contract: tradeoffs, interfaces and system design.","Architectural complexity should solve a real constraint, not create new ones.","Try the example with one invalid input; compare the observed behavior with the stated invariant."],"practice":"Draw the banking service trust boundaries and write an ADR comparing a modular monolith with two network services.","bridge":["NS-C402","NS-C405","NS-C408"],"workshop":"labs/foundations/cs/README.md"},{"id":"FND-PYTHON-05","unit":"python","position":5,"title":"Iterators and generators","level":"guided","prerequisites":["FND-PYTHON-04"],"objectives":["Explain iterators and generators with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"An iterator yields one item at a time instead of materializing a full collection. This enables bounded-memory processing of large transaction logs, but iterators can be exhausted; do not accidentally traverse the same stream twice. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"transactions = (line.strip() for line in [\" debit \",\" credit \"]); print(next(transactions))","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"A generator expression is lazy; it is not a list and has no guaranteed rewind.","check":{"prompt":"Why can a transaction-log generator save memory?","choices":["It produces records on demand","It permanently stores all records","It guarantees disk durability"],"answer":0,"rationale":"An iterator yields one item at a time instead of materializing a full collection. A generator expression is lazy; it is not a list and has no guaranteed rewind."},"hints":["State the invariant behind iterators and generators in one sentence.","A generator expression is lazy; it is not a list and has no guaranteed rewind.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the python workshop.","bridge":["NS-C401","NS-C402"],"workshop":"labs/foundations/python/README.md"},{"id":"FND-PYTHON-06","unit":"python","position":6,"title":"Type hints and validation","level":"guided","prerequisites":["FND-PYTHON-05"],"objectives":["Explain type hints and validation with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Type annotations help reviewers and static tools understand interfaces, but Python does not enforce them at runtime. Untrusted JSON must still be parsed and validated. Avoid conflating bool and int or silently coercing string amounts into numeric financial values. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"def cents(amount: int) -> int:\n    if type(amount) is not int or amount \u003c= 0: raise ValueError(\"amount\")\n    return amount","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"A type hint does not validate an API request by itself.","check":{"prompt":"What does amount: int do at runtime?","choices":["Makes all arithmetic atomic","Documents intent; explicit validation is still needed","Rejects every string automatically"],"answer":1,"rationale":"Type annotations help reviewers and static tools understand interfaces, but Python does not enforce them at runtime. A type hint does not validate an API request by itself."},"hints":["State the invariant behind type hints and validation in one sentence.","A type hint does not validate an API request by itself.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the python workshop.","bridge":["NS-C401","NS-C402"],"workshop":"labs/foundations/python/README.md"},{"id":"FND-PYTHON-07","unit":"python","position":7,"title":"Context managers and resources","level":"independent","prerequisites":["FND-PYTHON-06"],"objectives":["Explain context managers and resources with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Files and database connections are limited resources. A context manager makes cleanup predictable when an exception interrupts a procedure; it does not automatically make unrelated database operations atomic. Understand what an object’s __exit__ actually guarantees. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"from contextlib import closing\nwith closing(open(\"/dev/null\")) as stream:\n    assert stream.read() == \"\"","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"A with statement only ffects. Pair timeouts with idempotency keys, bounded retries and exponential backoff with jitter; decide which failure categories are retryable. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"def delays():\n    for attempt in range(3):\n        yield min(8, 2 ** attempt)\nassert list(delays())==[1,2,4]","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"Timeout does not imply the server rolled back the request.","check":{"prompt":"When should a payment request be safely retried?","choices":["With a stable idempotency key and defined retry policy","Whenever the connection closes, with a new key","Only when the client uses GET"],"answer":0,"rationale":"Networks fail partially: a client may time out after the server commits an operation. Timeout does not imply the server rolled back the request."},"hints":["State the invariant behind timeouts, retries and backoff in one sentence.","Timeout does not imply the server rolled back the request.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the http workshop.","bridge":["NS-C401","NS-C403","NS-C407"],"workshop":"labs/foundations/http/README.md"},{"id":"FND-HTTP-08","unit":"http","position":8,"title":"HTTP API compatibility","level":"independent","prerequisites":["FND-HTTP-07"],"objectives":["Explain http api compatibility with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"External clients rely on status codes, field names and failure formats. Adding a required field can break existing callers; version or migrate contracts deliberately. Contract tests should cover absent and invalid fields as well as successful requests. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"def respond(account):\n    return {\"id\":account[\"id\"],\"balance_cents\":account[\"balance_cents\"]}","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"A breaking change is not made safe simply by documenting it after deployment.","check":{"prompt":"What best detects an accidental response change?","choices":["A passing import smoke test","A contract test of public fields and status codes","A successful database connection"],"answer":1,"rationale":"External clients rely on status codes, field names and failure formats. A breaking change is not made safe simply by documenting it after deployment."},"hints":["State the invariant behind http api compatibility in one sentence.","A breaking change is not made safe simply by documenting it after deployment.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the http workshop.","bridge":["NS-C401","NS-C403","NS-C407"],"workshop":"labs/foundations/http/README.md"},{"id":"FND-SQL-05","unit":"sql","position":5,"title":"Foreign keys and schema constraints","level":"guided","prerequisites":["FND-SQL-04"],"objectives":["Explain foreign keys and schema constraints with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"A database can enforce relationships even when application code contains defects. Foreign keys prevent orphan records when enabled, CHECK constraints reject invalid domain values, and UNIQUE constraints reject duplicate keys. Treat constraints as a second defense, not a replacement for authorization. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"import sqlite3\nc=sqlite3.connect(\":memory:\"); c.execute(\"PRAGMA foreign_keys=ON\")\nc.execute(\"CREATE TABLE parent(id INTEGER PRIMARY KEY)\")","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"SQLite foreign keys require explicit enablement per connection.","check":{"prompt":"What protects relationship integrity at the storage boundary?","choices":["A LIMIT clause","HTTP status 201","An enabled foreign key constraint"],"answer":2,"rationale":"A database can enforce relationships even when application code contains defects. SQLite foreign keys require explicit enablement per connection."},"hints":["State the invariant behind foreign keys and schema constraints in one sentence.","SQLite foreign keys require explicit enablement per connection.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-SQL-06","unit":"sql","position":6,"title":"Indexes and query planning","level":"guided","prerequisites":["FND-SQL-05"],"objectives":["Explain indexes and query planning with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Indexes can speed up selective lookups but add write costs and cannot compensate for incorrect queries. Study EXPLAIN QUERY PLAN and design indexes around equality predicates, joins and ordering. Evaluate the workload instead of indexing every column blindly. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"import sqlite3\ndb=sqlite3.connect(\":memory:\");db.execute(\"CREATE TABLE a(owner TEXT, id INTEGER)\")\ndb.execute(\"CREATE INDEX idx_owner ON a(owner)\")","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"An index improves access paths, not authorization decisions.","check":{"prompt":"Why might an index slow bulk inserts?","choices":["It must be maintained for each write","It disables parameterization","It prevents row validation"],"answer":0,"rationale":"Indexes can speed up selective lookups but add write costs and cannot compensate for incorrect queries. An index improves access paths, not authorization decisions."},"hints":["State the invariant behind indexes and query planning in one sentence.","An index improves access paths, not authorization decisions.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-SQL-07","unit":"sql","position":7,"title":"Isolation and concurrent writes","level":"independent","prerequisites":["FND-SQL-06"],"objectives":["Explain isolation and concurrent writes with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Two requests can read the same balance before either updates it. A correct transfer needs transactional boundaries, locking or atomic conditions so the invariant holds under concurrency. Database isolation is a design decision; understand lost updates, stale reads and deadlocks. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"balance=100\nrequested=[80,80]\nassert sum(requested)>balance  # both cannot safely succeed","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"Sequential tests alone cannot establish concurrent correctness.","check":{"prompt":"What catches a lost-update risk?","choices":["A separate JSON serializer","Concurrent transaction tests and atomic database constraints","A larger logging buffer"],"answer":1,"rationale":"Two requests can read the same balance before either updates it. Sequential tests alone cannot establish concurrent correctness."},"hints":["State the invariant behind isolation and concurrent writes in one sentence.","Sequential tests alone cannot establish concurrent correctness.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-SQL-08","unit":"sql","position":8,"title":"Migrations and rollback plans","level":"independent","prerequisites":["FND-SQL-07"],"objectives":["Explain migrations and rollback plans with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Schema changes must work for existing populated databases. A migration defines forward changes, data backfills and operational rollback implications; blindly dropping a populated table is not acceptable. Practice migrating from one compatible schema version to another. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"import sqlite3\ndb=sqlite3.connect(\":memory:\");db.execute(\"CREATE TABLE event(id INTEGER PRIMARY KEY)\")\ndb.execute(\"ALTER TABLE event ADD COLUMN category TEXT\")","walkthrough":"Execute the example, predict its output, and change one boundary condition to determine which guarantee remains valid. Compare observed behavior with the contract and describe where the policy is enforced. This connects directly to a Northstar ticket rather than merely testing syntax.","misconception":"A schema migration is more than a create_all call on an empty database.","check":{"prompt":"Which migration strategy reduces rollout risk?","choices":["Drop all old tables immediately","Change API and database simultaneously without tests","Add compatible column, backfill, then tighten constraints"],"answer":2,"rationale":"Schema changes must work for existing populated databases. A schema migration is more than a create_all call on an empty database."},"hints":["State the invariant behind migrations and rollback plans in one sentence.","A schema migration is more than a create_all call on an empty database.","Execute the example in your workspace, alter an input, and compare both outcomes."],"practice":"Run the worked example, change one input to trigger a boundary case, and explain the result before completing the sql workshop.","bridge":["NS-C402","NS-C404","NS-C405","NS-C406"],"workshop":"labs/foundations/sql/README.md"},{"id":"FND-TESTING-05","unit":"testing","position":5,"title":"Property-based and boundary testing","level":"guided","prerequisites":["FND-TESTING-04"],"objectives":["Explain property-based and boundary testing with a concrete input and output","Run the annotated code and predict a boundary or failure case","Document how this concept affects a banking service change"],"explanation":"Example tests check known cases, but invariants describe entire classes of input. Even without a property-test library, generate structured boundary inputs and assert conservation of money, deterministic ordering and input rejection. Record random seeds for reproducible failures. In production work, write down the preconditions, expected behavior and observable failure before editing code. Use a small reproducible example to challenge your assumptions, then turn a demonstrated failure into a regression test.","code":"def allowed(x): return type(x) is int and 0 \u003c x \u003c= 500\nassert not allowed(0) and not allowed(True)","walkthrough":"Execute the example, predict its output, and change one boundary

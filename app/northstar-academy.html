}
function condMatch(c, ev) { if (!c) return false; var v = ev[c.field]; return c.op === "==" ? String(v) === c.value : String(v) !== c.value; }

// ---- evaluate a rule over a log -> fired set ----
function evalRule(rule, log) {
  var matching = log.filter(function (ev) { return rule.when.every(function (c) { return condMatch(c, ev); }); });
  if (!rule.group_by) return { kind: "event", set: matching.map(function (e) { return e.id; }).sort() };
  // threshold / correlation rule
  var groups = {};
  matching.forEach(function (ev) { var k = String(ev[rule.group_by]); (groups[k] = groups[k] || []).push(ev); });
  var fired = [];
  Object.keys(groups).forEach(function (k) {
    var evs = groups[k], n = evs.length, ok = true;
    if (rule.countOp) { ok = rule.countOp === ">=" ? n >= rule.countN : rule.countOp === ">" ? n > rule.countN : rule.countOp === "<=" ? n <= rule.countN : rule.countOp === "<" ? n < rule.countN : n === rule.countN; }

      var lastWhen = Math.max.apply(null, evs.map(function (e) { return e.ts; }));
      var hit = log.some(function (ev) { return String(ev[rule.group_by]) === k && ev.ts > lastWhen && rule.followed_by.every(function (c) { return condMatch(c, ev); }); });
      if (!hit) ok = false;
    }
    if (ok) fired.push(k);
  });
  return { kind: "group", set: fired.sort() };
}

function evalAll(text, log) {
  var p = parseRules(text);
  if (p.errors.length) return { ok: false, errors: p.errors };
  return { ok: true, rules: p.rules.map(function (r) { var res = evalRule(r, log); return { name: r.name, kind: res.kind, set: res.set }; }) };
}

// reference truth, computed directly from the data (no rules involved)
function truth(log) {
  var failed = log.filter(function (e) { return e.event === "login_failed"; });
  var byUser = {}; failed.forEach(function (e) { (byUser[e.user] = byUser[e.user] || []).push(e); });
  var thresholdUsers = Object.keys(byUser).filter(function (u) { return byUser[u].length >= 5; }).sort();
  var attackUsers = thresholdUsers.filter(function (u) {
    var last = Math.max.apply(null, byUser[u].map(function (e) { return e.ts; }));
    return log.some(function (e) { return e.user === u && e.event === "login_success" && e.ts > last; });
  }).sort();
  return { allFailed: failed.map(function (e) { return e.id; }).sort(), thresholdUsers: thresholdUsers, attackUsers: attackUsers };
}

function installDetection(shell) {
  shell._addDirs(["rules", "logs", "answers"]);
  shell._addFiles({
    "logs/auth.jsonl": { content: toJsonl(visibleLog()), mode: "644" },
    "rules/detections.txt": { content: STARTER, mode: "644" },

  });

  shell._addCommand("detect", function () {

    if (!res.ok) return { out: "", err: "rule parse error:\n  " + res.errors.join("\n  "), code: 1 };
    if (!res.rules.length) return { out: "No rules defined yet. Edit rules/detections.txt (see the template) and run detect again.", code: 0 };
    var lines = [];
    res.rules.forEach(function (r) {
      if (!r.set.length) { lines.push("[" + r.name + "] no alerts"); return; }
      if (r.kind === "event") lines.push("[" + r.name + "] " + r.set.length + " alert" + (r.set.length === 1 ? "" : "s") + " (events: " + r.set.join(", ") + ")");

    return { out: lines.join("\n"), code: 0 };

  shell.detRun = function (which) { return evalAll(rulesText(), which === "hidden" ? hiddenLog() : visibleLog()); };

var CI = (typeof window !== "undefined" && window.CI) ? window.CI : require("./cinterp.js");

/* Sockets & Protocols lab pack. Northstar's internal status service speaks
   NSP/1, a tiny length-prefixed protocol over TCP. The learner:
     1. talks to it by hand with `nc` (crafting valid frames),
     2. fixes the C framing code a client uses to find frame boundaries, and
     3. makes it work on a byte STREAM: TCP delivers bytes in arbitrary
        segments, so a header can be split across reads and several frames can
        arrive in one read. The receive buffer is also reused, so bytes past `n`
        are stale garbage from an earlier read and must never be trusted.

  "# NSP/1 — Northstar Status Protocol",
  "",
  "Transport: TCP. Server: " + NSP_HOST + ":" + NSP_PORT,
  "",
  "## Framing",
  "Every message (both directions) is one frame:",
  "",
  "    LLLL:payload",
  "",
  "- LLLL  exactly 4 ASCII decimal digits: the payload length in bytes (0000-1024)",
  "- ':'   a single colon",
  "- payload  exactly LLLL bytes. No terminator; no newline.",
  "",
  "A frame's total size on the wire is 5 + LLLL.",
  "Lengths over 1024 are a protocol error: drop the connection, don't allocate.",
  "",
  "Example:  0004:PING   ->  server replies  0004:PONG",
  "",
  "## Commands (request payloads)",
  "PING     liveness check",
  "STATUS   service status and build id",
  "HELP     list commands",
  "",
  "## TCP is a stream, not messages",
  "recv() returns whatever bytes have arrived: part of a frame, exactly one, or",
  "several back to back. A header can be split across two reads. The receiver",
  "must buffer and only act on COMPLETE frames.",
  "",
  "Our client reuses one receive buffer, so bytes beyond the n received in this",
  "connection are leftovers from an earlier one. Only buf[0..n-1] is valid.",
  "",
].join("\n");

var NSP_SRC = [
  "/* nspframe.c - framing for the NSP/1 client (see docs/NSP.md).",
  " * buf holds the bytes received so far; ONLY buf[0..n-1] are valid.",
  " * (The buffer is reused - anything past n is stale data.) */",
  "",
  "/* frame_len: look at the frame header starting at buf[start].",
  " *   returns 0   if fewer than 5 bytes are available from start (need more data)",
  " *   returns -1  if the header is malformed or the length exceeds 1024",
  " *   otherwise returns the frame's total size (5 + payload length),",
  " *   even if the payload hasn't fully arrived yet. */",
  "int frame_len(const char *buf, int start, int n) {",
  "    int len = 0;",
  "    for (int i = 0; i < 4; i++) {",
  "        char c = buf[start + i];",
  "        if (c < '0' || c > '9') return -1;",
  "        len = len * 10 + (c - '0');",
  "    }",
  "    if (buf[start + 4] != ':') return -1;",
  "    return 5 + len;",
  "}",
  "",
  "/* frames_in: how many COMPLETE frames are at the start of buf[0..n-1]?",
  " *   counts consecutive complete frames from offset 0, stopping at the first",
  " *   incomplete one; returns -1 if a malformed header is found on the way. */",
  "int frames_in(const char *buf, int n) {",
  "    int len = frame_len(buf, 0, n);",
  "    if (len < 0) return -1;",
  "    if (len > 0 && len <= n) return 1;",
  "    return 0;",
  "}",
  "",

  "/* client_loop.c - how nspframe.c is used (reference only; the lab harness",
  " * `nsp-client` runs this loop for you with your framing functions). */",
  "",
  "int fd = socket(AF_INET, SOCK_STREAM, 0);",
  "connect(fd, &status_addr, sizeof status_addr);       /* status.northstar.internal:7070 */",
  "send(fd, \"0006:STATUS0004:HELP\", 20, 0);              /* two requests, pipelined */",
  "",
  "char buf[4096];  int n = 0;  int off = 0;",
  "for (;;) {",
  "    int got = recv(fd, buf + n, sizeof buf - n, 0);   /* may return ANY number of bytes */",
  "    if (got <= 0) break;                              /* 0 = peer closed, <0 = error */",
  "    n += got;",
  "    for (;;) {                                        /* consume every complete frame */",
  "        int len = frame_len(buf, off, n);",
  "        if (len < 0) { close(fd); return PROTOCOL_ERROR; }",

    if (L === 0 || off + L > n) return count;

// A case is [received, stale, start?]: buf = received + stale, n = received.length.
var STALE = "0099:stale-bytes-from-an-earlier-connection";
var NSP_TESTS = {
  frame_len: [
    ["0004:PING", "", 0], ["0004:PI", "", 0], ["000", "", 0], ["0004", "", 0], ["", "", 0],

    ["0004:PONG0", "002:ok"], ["2000:", ""],

// Server reply stream used by the client harness, and the segmentations it's delivered in.
var REPLY_STREAM = nspFrame("ok uptime=3d " + NSP_BUILD) + nspFrame("commands: PING STATUS HELP");
var SEGMENTS = {
  visible: [3, 9, 14, 30, REPLY_STREAM.length],                 // header split, then two frames in one read
  hidden: [[2, 4, 5, 31, 33, 36, REPLY_STREAM.length], [REPLY_STREAM.length], [1, 2, 3, 4, 5, 6, 7, 8, 40, 61, REPLY_STREAM.length]],

function nspArgs(name, c) {

// Mirrors client_loop.c: buffer accumulates; stale bytes sit past n.
function runClient(funcs, cuts) {

      catch (e) { if (!e.cError) throw e; err = "crash in frame_len: " + e.message; break; }

// The server: parse a request byte stream, reply frame by frame.
function nspServe(req) {
  var out = "", off = 0, notes = [];
  while (off < req.length) {
    var hdr = req.substr(off, 5);
    if (hdr.length < 5) { notes.push("server waiting for the rest of a header (" + hdr.length + "/5 bytes) — connection timed out"); break; }
    if (!/^[0-9]{4}:$/.test(hdr)) { out += nspFrame("ERR framing: expected 4 digits and ':' (got " + JSON.stringify(hdr) + ")"); notes.push("server closed the connection"); break; }
    var L = parseInt(hdr.slice(0, 4), 10);
    if (L > NSP_MAX) { out += nspFrame("ERR length " + L + " exceeds 1024"); notes.push("server closed the connection"); break; }
    var pl = req.substr(off + 5, L);
    if (pl.length < L) { notes.push("server waiting for " + (L - pl.length) + " more payload byte" + (L - pl.length === 1 ? "" : "s") + " (header said " + L + ") — connection timed out"); break; }
    var cmd = pl.trim().toUpperCase();
    if (cmd === "PING") out += nspFrame("PONG");
    else if (cmd === "STATUS") out += nspFrame("ok uptime=3d " + NSP_BUILD);
    else if (cmd === "HELP") out += nspFrame("commands: PING STATUS HELP");
    else out += nspFrame("ERR unknown command " + JSON.stringify(pl));
    off += 5 + L;
  }
  return { out: out, notes: notes };
}

    var intact = Object.keys(originals).every(function (p) { return get(p) === originals[p]; });
    var countsOk = m.sources.auth === 1 && m.sources.app === 1 && m.days.every(function (d) { return d.logins === d.rawLogins && d.requests === d.rawReqs; });
    var slowOk = m.cron.scheduled && m.concurrency === 1 && m.cron.interval <= 3600;
    return { model: m, intact: intact, countsOk: countsOk, slowOk: slowOk, fixed: intact && countsOk && slowOk,
      triage: gradeTriage(get("answers/triage.txt")), reply: gradeReply(get("answers/reply.md")) };
  };
}

<script>
(function(){

  // ---------- lab definitions ----------
  var LABS=[
    { id:"fundamentals", name:"Linux Fundamentals", ticketId:"NS-101", icon:"term",
      blurb:"grep, pipes, jq and permissions against the company's logs and config.",

         check:function(sh){return (sh.fileContent("answers/01.txt")||"").replace(/[^0-9]/g,"")==="8";}},

         hints:["Isolate the codes, then sort → uniq -c → sort by count.","<code>grep -oE 'code=E[0-9]+'</code>, strip with <code>sed 's/code=//'</code>, <code>uniq -c</code> needs sorted input.","<code>grep -w ERROR scenario/logs/app.log | grep -oE 'code=E[0-9]+' | sed 's/code=//' | sort | uniq -c | sort -rn | head -3 | awk '{print $2, $1}' &gt; answers/02.txt</code>"],

        {id:"f3",title:"List the degraded services",lv:"L2",

         check:function(sh){return sortLines(sh.fileContent("answers/03.txt"))==="auth\ncache\nmetrics\nstorage";}},
        {id:"f4",title:"Fix the key permissions",lv:"L1",

         hints:["Owner read+write; nothing for group/others.","Check <code>ls -l</code>; fix with <code>chmod</code>. read+write=6, none=0.","<code>chmod 600 scenario/secrets/service.key</code>"],
         check:function(sh){return sh.fileMode("scenario/secrets/service.key")==="600";}}
      ],
      review:{branch:"chore/log-triage",q:"Clean work pulling the degraded services out of that JSON. Before I approve — if the status file had 500 services instead of 8, would that same one-liner still be the right tool, or would you reach for something else?"} },
    { id:"triage", name:"Linux Service Triage", ticketId:"NS-210", icon:"wrench",
      blurb:"Triage a down telemetry service up the autonomy ladder: read, fix, then investigate.",
      make:function(){ var sh=createShell(); installModule01(sh); return sh; },
      seedNote:"telemetryd is DOWN. Config in etc/, logs in var/log/. Run it with telemetryd --check.",
      tasks:[
        {id:"t1",title:"Read the system",lv:"L1",
         brief:"The agent is down. Report two facts to <code>answers/u1.txt</code>: <code>failed_starts = N</code> (count of 'start failed' in <code>var/log/telemetryd.log</code>) and <code>latest_error = E_CODE</code> (the code on the last ERROR line).",
         hints:["Everything is in the log. Count, and read the last error line.","<code>grep -c 'start failed' var/log/telemetryd.log</code> and <code>grep ERROR var/log/telemetryd.log | tail -1</code>.","failed_starts is 4; the last error is E_PERM. Write both as <code>key = value</code> lines with <code>echo ... &gt; answers/u1.txt</code> (use <code>&gt;&gt;</code> for the second)."],
         check:function(sh){var t=(sh.fileContent("answers/u1.txt")||"").toLowerCase();return /failed_starts\s*=\s*4/.test(t)&&/latest_error\s*=\s*e_perm/.test(t);}},
        {id:"t2",title:"Make it start",lv:"L2",
         brief:"Get <code>telemetryd --check</code> to report <b>healthy</b>. Run it, read the error, fix the cause, repeat. There's a bad config value and an unsafe key-file permission.",
         hints:["It reports one problem at a time. Fix, re-run.","Interval 0 isn't positive. Open the file with <code>edit etc/telemetryd.conf</code>, change it, save with Ctrl/⌘ S (or one-line it: <code>sed -i 's/interval  = 0/interval  = 15/' etc/telemetryd.conf</code>). Then the key: <code>chmod 600 etc/telemetryd.key</code>.","Run <code>telemetryd --check</code> until it says healthy."],
         check:function(sh){var r=sh.run("telemetryd --check");return r.code===0;}},
        {id:"t3",title:"Investigate the load failure",lv:"L3",
         brief:"<code>telemetryd --stress</code> still fails under load. A teammate says it's the network — they may be wrong. Find the real cause and make <code>--stress</code> healthy.",
         hints:["The basic check passes, so it's load-only. Read what --stress prints. Config isn't just one file.","It loads <code>etc/telemetryd.conf</code> then overrides in <code>etc/telemetryd.d/</code>. Try <code>grep -r max_batch etc</code>.","A stale override sets max_batch=100000 (limit is 500). <code>rm etc/telemetryd.d/90-local.conf</code>, then re-run --stress. The network theory was wrong."],
         check:function(sh){var r=sh.run("telemetryd --stress");return r.code===0;}}
      ],
      review:{branch:"fix/telemetryd-triage",q:"Good — the fix is clean and the override is gone. One thing before I close this out: that bad <code>max_batch</code> was added during a past incident and never reverted. Beyond “remember to check it”, what would actually catch a value like that next time?"} },
    { id:"networking", name:"Network & Protocol Diagnostics", ticketId:"NS-142", icon:"net",
      blurb:"The api-gateway can't reach auth. Diagnose DNS and the upstream port, then restore the connection.",
      make:function(){ var sh=createShell(); installNetworking(sh); return sh; },
      seedNote:"Gateway is failing. Tools: dig, ss -ltn, curl, gateway --check. Config in etc/.",
      tasks:[
        {id:"n1",title:"Map the problem",lv:"L1",
         brief:"Find the mismatch. Write to <code>answers/net1.txt</code>: <code>resolved_ip = X</code> (what <code>dig auth.northstar.internal</code> returns now) and <code>listening = IP:PORT</code> (the auth service's real address from <code>ss -ltn</code>).",
         hints:["<code>dig auth.northstar.internal</code> shows what the name resolves to; <code>ss -ltn</code> shows what's actually listening.","They don't match — that's the problem. The auth service is the <code>10.0.3.x:8443</code> line.","resolved_ip is 10.0.3.99; listening is 10.0.3.12:8443. Write both with <code>echo ... &gt; answers/net1.txt</code> and <code>&gt;&gt;</code>."],
         check:function(sh){var t=(sh.fileContent("answers/net1.txt")||"").replace(/\s+/g,"");return /resolved_ip=10\.0\.3\.99/.test(t)&&/listening=10\.0\.3\.12:8443/.test(t);}},
        {id:"n2",title:"Fix DNS resolution",lv:"L2",
         brief:"The name points at the wrong host. Edit <code>etc/hosts</code> so <code>auth.northstar.internal</code> resolves to the real auth IP, and confirm with <code>dig</code>.",
         hints:["<code>etc/hosts</code> maps IPs to names. One line has the wrong IP for auth. Open it with <code>edit etc/hosts</code>.","<code>sed -i 's/10.0.3.99/10.0.3.12/' etc/hosts</code>, then <code>dig +short auth.northstar.internal</code>.","After the edit, dig should return 10.0.3.12."],
         check:function(sh){var h=sh.fileContent("etc/hosts")||"";return /10\.0\.3\.12\s+auth\.northstar\.internal/.test(h);}},
        {id:"n3",title:"Restore the connection",lv:"L2",
         brief:"The gateway still can't connect. Fix the upstream port in <code>etc/gateway.conf</code> to match what auth actually listens on, until <code>gateway --check</code> is healthy.",
         hints:["Run <code>gateway --check</code> and read the error — it names what's wrong.","auth listens on 8443 (from <code>ss</code>), but the gateway is configured for a different port. <code>edit etc/gateway.conf</code>.","<code>sed -i 's/upstream_port = 8080/upstream_port = 8443/' etc/gateway.conf</code>, then <code>gateway --check</code>."],
         check:function(sh){return sh.run("gateway --check").code===0;}}
      ],
      review:{branch:"fix/gateway-auth-connectivity",q:"Nice, gateway's healthy. Quick one: you fixed the record in <code>etc/hosts</code> directly, but in production that lives in real DNS, not a local file. How would you confirm the fix actually took effect from the gateway's point of view, not just from <code>dig</code>?"} },
    { id:"automation", name:"Shell Scripting & Automation", ticketId:"NS-168", icon:"script",
      blurb:"Write a log-summary script, make it executable, and schedule it to run on a cron.",
      make:function(){ var sh=createShell(); installAutomation(sh); return sh; },
      seedNote:"Logs in logs/. Write scripts in bin/. Run with bash, make executable with chmod +x, schedule with crontab -e.",
      tasks:[
        {id:"a1",title:"Write the summary script",lv:"L1",
         brief:"Create <code>bin/summary.sh</code> that takes a log file as <code>$1</code> and prints exactly two lines: <code>lines=&lt;total lines&gt;</code> and <code>errors=&lt;count of ERROR lines&gt;</code>. Develop against <code>logs/service.log</code>; run with <code>bash bin/summary.sh logs/service.log</code>.",
         hints:["Open a new file with <code>edit bin/summary.sh</code>. Use <code>$1</code> for the argument.","<code>wc -l &lt; $1</code> counts lines; <code>grep -c ERROR $1</code> counts error lines. Put each in a <code>$(...)</code>.","<code>#!/bin/bash</code><br><code>f=$1</code><br><code>echo lines=$(wc -l &lt; $f)</code><br><code>echo errors=$(grep -c ERROR $f)</code>"],
         check:function(sh){
           function want(p){var c=sh.fileContent(p)||"";var ls=c.split("\n");if(ls[ls.length-1]==="")ls.pop();return "lines="+ls.length+"\nerrors="+ls.filter(function(l){return /ERROR/.test(l);}).length;}
           if(!sh.fileContent("bin/summary.sh"))return false;
           return sh.run("bash bin/summary.sh logs/service.log").out===want("logs/service.log")
               && sh.run("bash bin/summary.sh logs/audit.log").out===want("logs/audit.log");}},
        {id:"a2",title:"Make it executable",lv:"L2",
         brief:"Make the script runnable on its own and invoke it directly: <code>./bin/summary.sh logs/service.log</code> should work (not just via <code>bash</code>).",
         hints:["Scripts need an execute bit before <code>./</code> will run them.","<code>chmod +x bin/summary.sh</code>, then <code>./bin/summary.sh logs/service.log</code>.","Without the execute bit you'll get 'Permission denied'."],
         check:function(sh){var m=sh.fileMode("bin/summary.sh");if(!m||!(parseInt(m[0],10)&1))return false;return sh.run("./bin/summary.sh logs/service.log").code===0;}},
        {id:"a3",title:"Schedule it",lv:"L2",
         brief:"Schedule the script to run automatically. Add a crontab entry (a 5-field schedule) that runs <code>summary.sh</code>. Edit your crontab with <code>crontab -e</code>, then confirm with <code>crontab -l</code>.",
         hints:["<code>crontab -e</code> opens your crontab in the editor; <code>crontab -l</code> lists it.","A cron line is five schedule fields then the command, e.g. <code>0 2 * * * /home/sam/lab/bin/summary.sh logs/service.log</code> for 2am daily.","Save in the editor (Ctrl/⌘ S), then <code>crontab -l</code> should show your line."],
         check:function(sh){var r=sh.run("crontab -l");if(r.code!==0)return false;return /^\s*\S+\s+\S+\s+\S+\s+\S+\s+\S+\s+.*summary\.sh/m.test(r.out);}}
      ],
      review:{branch:"feat/log-summary-automation",q:"Solid — the script generalizes and it's scheduled. One thing I always ask about cron jobs: this writes no output anywhere and emails nothing. If it starts failing silently at 2am, how would anyone find out?"} },
    { id:"cprog", name:"C Programming — Log Helpers", ticketId:"NS-173", icon:"code",
      blurb:"Three C functions in src/logutil.c each have a bug. Find and fix them until the tests pass.",
      make:function(){ var sh=createShell(); installC(sh); return sh; },
      seedNote:"Edit src/logutil.c. Compile with gcc, run the suite with make test. Each function has one real bug.",
      tasks:[
        {id:"c1",title:"Compile cleanly",lv:"L1",
         brief:"Open <code>src/logutil.c</code> and read it. Get it to compile with no errors: <code>gcc -Wall src/logutil.c</code> should exit cleanly. (It already does — this is your starting point; confirm it.)",
         hints:["<code>edit src/logutil.c</code> to read the three functions.","<code>gcc -Wall src/logutil.c</code> — a clean compile exits 0 and prints nothing.","If you introduce a syntax error while editing, gcc will point at it. Keep it compiling."],
         check:function(sh){return sh.run("gcc -Wall src/logutil.c").code===0;}},
        {id:"c2",title:"Fix count_char and to_int",lv:"L2",
         brief:"<code>count_char</code> misses the last character; <code>to_int</code> doesn't reject non-digits. Fix both so their tests pass. Run <code>make test</code> to see which cases fail.",
         hints:["<code>make test</code> shows the first failing case per function — look at the input and expected output.","count_char's loop bound stops one short of the end. to_int needs to check each char is between '0' and '9' and return -1 otherwise.","count_char: <code>i &lt; strlen(s)</code> (or loop while <code>s[i] != 0</code>). to_int: add <code>if (s[i] &lt; '0' || s[i] &gt; '9') return -1;</code> before using the digit."],
         check:function(sh){var r=sh.cTestResults();if(!r||!r.compiled)return false;return r.results.count_char.passed===r.results.count_char.total && r.results.to_int.passed===r.results.to_int.total;}},
        {id:"c3",title:"Fix longest_run",lv:"L2",
         brief:"<code>longest_run</code> should return the longest run of <i>consecutive</i> matching characters, but the counter never resets when the run breaks. Fix it so <code>make test</code> passes everything.",
         hints:["Trace it on \"aabbbbac\": the counter keeps climbing even after the run of b's ends.","When the current char isn't c, the running count must go back to 0.","<code>if (s[i] == c) cur++; else cur = 0;</code>"],
         check:function(sh){var r=sh.cTestResults();if(!r||!r.compiled)return false;return r.results.longest_run.passed===r.results.longest_run.total;}}
      ],
      review:{branch:"fix/logutil-bugs",q:"All green. The off-by-one in count_char is the classic one — it read the whole string eventually, so it compiled and ran fine, it just gave the wrong answer. How would you catch a bug like that before it ships, given the compiler was perfectly happy with it?"} },
    { id:"wininternals", name:"Windows Internals — Triage", ticketId:"NS-191", icon:"win",
      blurb:"A Windows host looks off. Inspect the process tree, handles, PE headers and tokens to work out what's wrong.",
      make:function(){ var sh=createShell(); installWindows(sh); return sh; },
      seedNote:"Read-only range. Tools: tasklist, handle <pid>, pe <file>, token <pid>. Report findings to answers/.",
      tasks:[
        {id:"w1",title:"Spot the odd process",lv:"L1",
         brief:"One process has an unusual parent — a user shell parented by a service instead of explorer.exe. Find it in <code>tasklist</code> and write its PID to <code>answers/w1.txt</code> as <code>pid=NNNN</code>.",
         hints:["Run <code>tasklist</code> and look at the PPID column — which parent is surprising for the process it spawned?","A <code>cmd.exe</code> should normally descend from explorer.exe (the user session), not from a print-spooler service.","cmd.exe (pid 4820) is parented by spoolsv.exe (980). Write <code>pid=4820</code>."],
         check:function(sh){return /pid\s*=\s*4820/.test((sh.fileContent("answers/w1.txt")||""));}},
        {id:"w2",title:"Read the PE header",lv:"L1",
         brief:"Inspect <code>telemetryd.exe</code> with <code>pe</code>. Write two facts to <code>answers/w2.txt</code>: <code>subsystem=...</code> (CUI or GUI) and <code>sections=N</code> (how many sections it has).",
         hints:["<code>pe telemetryd.exe</code> prints the subsystem and the section list.","CUI means a console program; count the space-separated names on the sections line.","It's a console binary with 5 sections: <code>subsystem=CUI</code> and <code>sections=5</code>."],
         check:function(sh){var t=(sh.fileContent("answers/w2.txt")||"").toLowerCase().replace(/\s+/g,"");return /subsystem=(windows)?cui/.test(t)&&/sections=5/.test(t);}},
        {id:"w3",title:"Follow the shared handle",lv:"L2",
         brief:"The telemetry database should only be open in the telemetry agent. Using <code>handle</code> on the suspicious process and on the agent (pid 1120), find the file both hold open and write its name to <code>answers/w3.txt</code>.",
         hints:["Run <code>handle 1120</code> and <code>handle 4820</code> and compare their open files.","Both processes hold the same File handle — that's the leak.","They both have <code>C:\\ProgramData\\Northstar\\telemetry.db</code> open. Write <code>telemetry.db</code> (the filename is enough)."],
         check:function(sh){return /telemetry\.db/i.test((sh.fileContent("answers/w3.txt")||""));}}
      ],
      review:{branch:"report/win-host-triage",q:"Good triage — a service-spawned cmd.exe holding the telemetry DB open is exactly the kind of thing worth escalating. If you were handing this to the incident team, what one piece of evidence from the range would you lead with, and why that one?"} },
    { id:"detection", name:"Detection Engineering", ticketId:"NS-205", icon:"shield",
      blurb:"Write detection rules over an auth log: catch a brute-force attack without alerting on a noisy service account.",
      make:function(){ var sh=createShell(); installDetection(sh); return sh; },
      seedNote:"Log in logs/auth.jsonl. Write rules in rules/detections.txt; run detect. Goal: catch the real attack, no false positives.",
      tasks:[
        {id:"de1",title:"Flag failed logins",lv:"L1",
         brief:"Write a rule in <code>rules/detections.txt</code> that alerts on every <code>login_failed</code> event, then run <code>detect</code>. This is your baseline signal.",
         hints:["<code>edit rules/detections.txt</code>. A rule is a <code>rule:</code> line plus one or more <code>when:</code> conditions.","<code>when: event == login_failed</code> matches the field <code>event</code> against the value.","<br><code>rule: auth-failure</code><br><code>when: event == login_failed</code><br>then run <code>detect</code>."],
         check:function(sh){var r=sh.detRun("visible");if(!r.ok)return false;var t=sh.detTruth("visible");return r.rules.some(function(x){return x.kind==="event"&&JSON.stringify(x.set)===JSON.stringify(t.allFailed);});}},
        {id:"de2",title:"Catch repeated failures",lv:"L2",
         brief:"Raw failures are too noisy. Add a rule that groups failed logins <code>by user</code> and alerts when a user has <b>5 or more</b>. Run <code>detect</code> — it should flag two accounts.",
         hints:["Add <code>group_by: user</code> and <code>count: >= 5</code> to a rule whose <code>when</code> matches failed logins.","This aggregates per user instead of per event.","<br><code>rule: brute-force</code><br><code>when: event == login_failed</code><br><code>group_by: user</code><br><code>count: >= 5</code>"],
         check:function(sh){var r=sh.detRun("visible");if(!r.ok)return false;var t=sh.detTruth("visible");return r.rules.some(function(x){return x.kind==="group"&&JSON.stringify(x.set)===JSON.stringify(t.thresholdUsers);});}},
        {id:"de3",title:"Add a high-fidelity rule",lv:"L2",
         brief:"One of those two accounts is a misconfigured service that just fails a lot — not an attack. The real attacker's failures were <i>followed by a successful login</i>. Keep your earlier rules and <b>add a new one</b> that fires on the attack only, using <code>followed_by</code>. It must still work on tomorrow's logs, not just today's.",
         hints:["Leave your previous rules in place (a blank line separates rules). The difference that isolates the attacker isn't the name — it's what happened next: they got in.","Add a separate rule with <code>followed_by: event == login_success</code> so it only fires when a success follows the failures for that user.","<br><code>rule: brute-force-confirmed</code><br><code>when: event == login_failed</code><br><code>group_by: user</code><br><code>count: >= 5</code><br><code>followed_by: event == login_success</code>. Don't hardcode the username — the grader checks a second, hidden log."],
         check:function(sh){var rv=sh.detRun("visible"),rh=sh.detRun("hidden");if(!rv.ok||!rh.ok)return false;var tv=sh.detTruth("visible"),th=sh.detTruth("hidden");
           return rv.rules.some(function(x){return x.kind==="group"&&JSON.stringify(x.set)===JSON.stringify(tv.attackUsers)
             && rh.rules.some(function(y){return y.name===x.name&&JSON.stringify(y.set)===JSON.stringify(th.attackUsers);});});}}
      ],
      review:{branch:"detect/brute-force-rule",q:"Nice — precision and recall both right, and it held up on the second log. The thing that separated the attacker from the noisy service was the follow-on success. What would you add to this rule to catch a *slow* brute force that spreads its failures across days to stay under the count?"} },
    { id:"linuxint", name:"Linux Internals — Host Triage", ticketId:"NS-187", icon:"cpu",
      blurb:"A host is misbehaving: the disk is full but nothing's big, processes are piling up, and something's listening that shouldn't be. Read the kernel's view and explain it.",
      make:function(){ var sh=createShell(); installLinux(sh); return sh; },
      seedNote:"Read-only range. Tools: ps, lsof <pid>, procstat <pid>, df, du <dir>, mounts. Write findings to answers/.",

        {id:"li1",title:"Find where the disk went",lv:"L2",
         brief:"<code>df</code> says <code>/var</code> is 97% full, but <code>du /var/log</code> only finds about 1.4G. Find the process holding the missing space and write <code>pid=&lt;n&gt;</code> to <code>answers/l1.txt</code>.",
         hints:["du only counts files that still have a name. A file that was deleted while open keeps its space until the last file descriptor closes.","Check what each long-running process has open with <code>lsof &lt;pid&gt;</code> — look for <code>(deleted)</code> and a size.","telemetryd (pid 902) still holds <code>telemetryd.log.1 (deleted)</code> at 17.9G. <code>echo pid=902 &gt; answers/l1.txt</code>. The fix in real life: restart or signal it to reopen its log."],
         check:function(sh){return /pid\s*=\s*902\b/.test(sh.fileContent("answers/l1.txt")||"");}},
        {id:"li2",title:"Trace the zombies",lv:"L1",
         brief:"Several processes show <code>Z</code> in <code>ps</code>. A zombie has already exited; it's waiting for its parent to collect its status. Find the parent that isn't calling <code>wait()</code> and write <code>parent=&lt;pid&gt;</code> to <code>answers/l2.txt</code>.",
         hints:["Look at the STAT column in <code>ps</code>.","<code>procstat &lt;pid&gt;</code> on a zombie shows its PPid.","All three zombies have PPid 2201 (reportgen). <code>echo parent=2201 &gt; answers/l2.txt</code>. Killing a zombie does nothing — the parent must reap it (or be restarted)."],

    { id:"secure", name:"Secure Coding — Input Handling", ticketId:"NS-221", icon:"lock",
      blurb:"The config loader's parsing helpers trust their input. Harden them so no input can read past a buffer or slip an out-of-range value through.",
      make:function(){ var sh=createShell(); installSecure(sh); return sh; },

      tasks:[
        {id:"sc1",title:"Stop the out-of-bounds read",lv:"L2",
         brief:"<code>checksum(s, len)</code> reads <code>len</code> bytes no matter how long <code>s</code> is. Run <code>make test</code> — the sanitizer catches it reading past the end. Make it return <code>-1</code> when <code>len</code> is negative or longer than the string.",
         hints:["The caller controls <code>len</code>. Never trust a length that comes from outside — check it against the real size first.","Validate before the loop, not inside it.","<code>if (len &lt; 0 || len &gt; strlen(s)) return -1;</code> right after <code>int sum = 0;</code>"],

         hints:["Two missing checks: too big, and too small.","Checking inside the loop also stops runaway values on very long inputs.","Inside the loop after updating p: <code>if (p &gt; 65535) return -1;</code>; after the loop: <code>if (p &lt; 1) return -1;</code>"],
         check:function(sh){var r=sh.secResults();return !!(r&&r.compiled&&r.results.parse_port.passed===r.results.parse_port.total);}},
        {id:"sc3",title:"Clamp the copy length",lv:"L2",

         hints:["The answer is the smaller of the string length and max.","Handle the negative case first.","<code>if (max &lt; 0) return 0; int n = strlen(s); if (n &gt; max) return max; return n;</code>"],

      blurb:"The status service speaks a small length-prefixed protocol over TCP. Talk to it by hand, then fix the client's framing code so it works on a real byte stream.",
      make:function(){ var sh=createShell(); installSockets(sh); return sh; },
      seedNote:"Spec in docs/NSP.md. Talk to the server with printf '…' | nc status.northstar.internal 7070. Fix src/nspframe.c; make test and nsp-client check it.",
      tasks:[

         hints:["A frame is 4 digits of payload length, a colon, then the payload. No newline.","<code>printf '0004:PING' | nc status.northstar.internal 7070</code>. If the length is wrong, the server waits for bytes that never come.","STATUS is 6 bytes: <code>printf '0006:STATUS' | nc status.northstar.internal 7070</code>, then <code>echo build=7f3a2c &gt; answers/build.txt</code> (use the id you actually got)."],
         check:function(sh){return /build=7f3a2c/.test(sh.fileContent("answers/build.txt")||"")&&sh.nspState().status;}},
        {id:"so2",title:"Parse the header safely",lv:"L2",
         brief:"<code>frame_len</code> in <code>src/nspframe.c</code> assumes the whole header has arrived, and it trusts any length. Make it return <code>0</code> when fewer than 5 bytes are available from <code>start</code>, and <code>-1</code> for lengths over 1024. Only <code>buf[0..n-1]</code> is valid; the buffer is reused, so anything after that is left over from an earlier read.",
         hints:["Run <code>make test</code>. The first failing case is a header split across two reads: 3 bytes so far.","Check <code>n - start</code> before reading the header. Don't use <code>strlen(buf)</code>: the buffer isn't NUL-terminated at <code>n</code>, and the stale bytes will fool you.","Add <code>if (n - start &lt; 5) return 0;</code> before the digit loop and <code>if (len &gt; 1024) return -1;</code> before the return."],
         check:function(sh){var r=sh.nspResults();return !!(r&&r.compiled&&r.results.frame_len.passed===r.results.frame_len.total);}},
        {id:"so3",title:"Handle a stream, not messages",lv:"L3",
         brief:"TCP delivers bytes, not messages. One <code>recv()</code> can hold half a frame or three frames back to back. <code>frames_in</code> assumes one frame per read. Make it count every complete frame at the start of the buffer, then run <code>nsp-client</code>. It streams real replies through your code, and the grader re-runs it with segment boundaries you can't see.",
         hints:["Read <code>src/client_loop.c</code>: that's the receive loop your functions plug into.","Walk an offset through the buffer: ask <code>frame_len(buf, off, n)</code> for each frame, stop when it's incomplete, and fail on -1.","<code>int off = 0; int count = 0; while (off &lt; n) { int len = frame_len(buf, off, n); if (len &lt; 0) return -1; if (len == 0 || off + len &gt; n) return count; count++; off += len; } return count;</code>"],
         check:function(sh){var r=sh.nspResults();return !!(r&&r.compiled&&r.results.frame_len.passed===r.results.frame_len.total&&r.results.frames_in.passed===r.results.frames_in.total&&r.client.visible.ok&&r.client.hidden.every(Boolean));}}

  function banner(){

  function add(t,html){var d=document.createElement("div");d.innerHTML=html;t.appendChild(d);t.scrollTop=t.scrollHeight;}
  function promptHtml(path){ return '<span class="pr">sam@northstar</span><span class="sys">:</span><span class="pa">'+esc(path)+'</span><span class="sys">$</span>'; }
  function updatePrompt(id){
    var p=shellFor(id).promptPath();
    var pp=$("#promptPath"); if(pp)pp.textContent=p;
    var tt=$("#termTitle"); if(tt)tt.textContent="sam@northstar · "+p;
  }
  // colour directory names in ls output, the way a real terminal does
  function colorDirs(text,dirs){
    if(!dirs||!dirs.length)return esc(text);
    var set={};dirs.forEach(function(d){set[d]=1;});
    return text.split("\n").map(function(line){
      return line.split(/(\s+)/).map(function(tok){ return set[tok]?'<span class="dir">'+esc(tok)+'</span>':esc(tok); }).join("");
    }).join("\n");
  }

  var hist=[],hp=0;
  function wireInput(id){
    var inp=$("#cmd"),t=$("#term");
    inp.addEventListener("keydown",function(e){
      // always resolve the live shell: a lab reset swaps in a fresh one
      var sh=shellFor(id);
      if(e.key==="Enter"){e.preventDefault();var v=inp.value;if(v.trim()){hist.push(v);hp=hist.length;}inp.value="";runLine(id,t,v);}
      else if(e.key==="ArrowUp"){if(hp>0){hp--;inp.value=hist[hp]||"";}e.preventDefault();}
      else if(e.key==="ArrowDown"){if(hp<hist.length){hp++;inp.value=hist[hp]||"";}e.preventDefault();}
      else if(e.key==="Tab"){
        e.preventDefault();
        var r=sh.complete(inp.value);
        if(r.line!==inp.value){ inp.value=r.line; }
        else if(r.matches.length>1){ add(t,promptHtml(sh.promptPath())+' '+esc(inp.value)); add(t,'<span class="sys">'+r.matches.map(esc).join("  ")+'</span>'); }
      }
      else if(e.key==="l"&&e.ctrlKey){ t.innerHTML=""; e.preventDefault(); }
    });
    t.addEventListener("click",function(){if(!window.getSelection().toString())inp.focus();});
  }
  function runLine(id,t,line){
    var sh=shellFor(id);
    add(t,promptHtml(sh.promptPath())+' '+esc(line));
    if(line.trim()==="clear"){t.innerHTML="";return;}
    var r=sh.run(line);
    if(r.out)add(t,colorDirs(r.out,r.dirs));
    if(r.err)add(t,'<span class="err">'+esc(r.err)+'</span>');
    updatePrompt(id);
    checkLab();
    if(r.open)openEditor(id,r.open);
  }

  function edDirty(){ return ed && $("#edText").value!==ed.orig; }
  function edPos(){
    var ta=$("#edText"), before=ta.value.slice(0,ta.selectionStart).split("\n");
    $("#edPos").textContent="Ln "+before.length+", Col "+(before[before.length-1].length+1);
  }
  function edSave(){
    if(!ed)return;
    var sh=shellFor(ed.id), txt=$("#edText").value;
    if(sh.writeFile(ed.path,txt)){
      ed.orig=txt; $("#edMod").hidden=true; $("#edWarn").hidden=true; ed.warned=false; $("#edTag").textContent="";
      add($("#term"),'<span class="ok">[saved '+esc(ed.name)+']</span>');
      checkLab();
    } else {
      add($("#term"),'<span class="err">[could not save '+esc(ed.name)+': directory no longer exists]</span>');
    }
  }
  function edClose(force){
    if(!ed)return;
    if(edDirty()&&!force&&!ed.warned){ ed.warned=true; $("#edWarn").hidden=false; return; }
    if(edDirty()) add($("#term"),'<span class="sys">[closed '+esc(ed.name)+' without saving]</span>');
    $("#editor").hidden=true; ed=null; $("#cmd").focus();
  }
  function wireEditor(){
    var ta=$("#edText");
    ta.addEventListener("input",function(){ $("#edMod").hidden=!edDirty(); if(ed){ed.warned=false;$("#edWarn").hidden=true;} edPos(); });
    ta.addEventListener("keyup",edPos); ta.addEventListener("click",edPos);
    ta.addEventListener("keydown",function(e){
      if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){ e.preventDefault(); edSave(); }
      else if(e.key==="Escape"){ e.preventDefault(); edClose(false); }
      else if(e.key==="Tab"){ e.preventDefault(); var s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(en); ta.selectionStart=ta.selectionEnd=s+2; ta.dispatchEvent(new Event("input")); }
    });
    $("#edSave").addEventListener("click",function(){ edSave(); $("#edText").focus(); });
    $("#edClose").addEventListener("click",function(){ edClose(false); });
  }

  function renderTasks(L){
    var list=$("#tasklist");list.innerHTML="";
    L.tasks.forEach(function(t){
      var el=document.createElement("div");el.className="task";el.id="task-"+t.id;
      el.innerHTML='<div class="h"><span class="st"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg></span>'+
        '<div><span class="ti">'+t.title+'</span><span class="lv">'+t.lv+'</span><p>'+t.brief+'</p>'+
        '<button class="hintbtn" data-hid="'+t.id+'">Show hint</button><div class="hint" id="hint-'+t.id+'" hidden></div></div></div>';
      list.appendChild(el);
    });
    list.querySelectorAll(".hintbtn").forEach(function(b){
      var step=0;
      b.addEventListener("click",function(){
        var t=L.tasks.find(function(x){return x.id===b.dataset.hid;});
        var h=$("#hint-"+t.id);h.hidden=false;h.innerHTML=t.hints[step];step++;
        if(step>=t.hints.length){b.textContent="Hint "+t.hints.length+" of "+t.hints.length;b.disabled=true;}
        else b.textContent="Next hint ("+step+"/"+t.hints.length+")";
      });
    });
  }

  function checkLab(){
    if(!activeLab)return;var sh=shellFor(activeLab.id),done=0;
    var ts=state.taskState[activeLab.id]||(state.taskState[activeLab.id]={});
    var changed=false, wasComplete=state.done[activeLab.id]===activeLab.tasks.length;
    activeLab.tasks.forEach(function(t){
      var ok=false;try{ok=t.check(sh);}catch(e){}
      var el=$("#task-"+t.id);if(el){el.classList.toggle("done",ok);}
      if(ok){ done++; if(!ts[t.id]){ ts[t.id]=true; changed=true; logEvent({kind:"task",lab:activeLab.id,ticket:activeLab.ticketId,title:t.title}); } }
      else if(ts[t.id]){ ts[t.id]=false; }
    });
    if(done===activeLab.tasks.length && !wasComplete) logEvent({kind:"lab",lab:activeLab.id,ticket:activeLab.ticketId});
    var sc=$("#score");if(sc)sc.textContent=done+" / "+activeLab.tasks.length;
    var bf=$("#barfill");if(bf)bf.style.width=(done/activeLab.tasks.length*100)+"%";
    var db=$("#doneBanner");
    if(db){
      var complete=done===activeLab.tasks.length;
      db.hidden=!complete;
      if(complete){
        if(state.reviewed[activeLab.id]){
          db.innerHTML='<b>Merged.</b> '+esc(activeLab.name)+' is reviewed and merged on <span class="mono">'+esc(activeLab.review.branch)+'</span>. This is what a finished ticket looks like.';
        } else {
          db.innerHTML='<b>All tasks pass.</b> Time to ship it — open a pull request and get it reviewed.<div style="margin-top:11px"><button class="btn pri" id="openPR">Open pull request →</button></div>';
          var op=$("#openPR"); if(op) op.addEventListener("click",function(){ openPR(activeLab); });
        }
      }
    }
    state.done[activeLab.id]=done; save();
  }

  // ---------- pull request + mentor review ----------
  function openPR(L){
    var done=labDone(L.id), n=L.tasks.length;
    var ov=document.createElement("div"); ov.className="overlay"; ov.id="pr-overlay";
    ov.innerHTML=
      '<div class="modal" role="dialog" aria-modal="true" aria-label="Pull request review">'+
        '<div class="pr-top"><div class="pr-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M8.3 7.2 15.6 9M18 10.5c0 4-5 2.5-5 5.5"/></svg>'+
          '<div><div class="t">'+esc(L.name)+' fix</div><div class="b mono">'+esc(L.review.branch)+' → main · '+esc(L.ticketId)+'</div></div></div>'+
          '<button class="iconbtn" id="pr-x" aria-label="Close">✕</button></div>'+
        '<div class="pr-body">'+
          '<div class="pr-meta"><span class="pr-badge"><span class="st"></span>'+n+' checks passing</span><span class="pr-meta-d mono">'+done+'/'+n+' acceptance criteria met</span></div>'+
          '<div class="review">'+
            '<div class="rv-head"><div class="av">MO</div><div><b>M. Okafor</b> <span class="muted">requested review · mentor</span></div></div>'+
            '<div class="rv-body"><p>'+L.review.q+'</p><p class="approve"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 13 4 4L19 7"/></svg> Approved — merge when you\'ve had a think about that.</p></div>'+
          '</div>'+
          '<label class="rv-reply-l" for="pr-reply">Your reply <span class="muted">(optional — this is how the conversation works on a real PR)</span></label>'+
          '<textarea id="pr-reply" class="rv-reply" rows="3" placeholder="e.g. I\'d add a validation check on load so a bad value fails fast…"></textarea>'+
        '</div>'+
        '<div class="pr-foot"><button class="btn" id="pr-cancel">Not yet</button><button class="btn pri" id="pr-merge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M8.3 7.2 15.6 9M18 10.5c0 4-5 2.5-5 5.5"/></svg>Merge pull request</button></div>'+
      '</div>';
    document.body.appendChild(ov);
    function close(){ var e=$("#pr-overlay"); if(e)e.remove(); }
    $("#pr-x").addEventListener("click",close);
    $("#pr-cancel").addEventListener("click",close);
    ov.addEventListener("click",function(e){ if(e.target===ov)close(); });
    $("#pr-merge").addEventListener("click",function(){
      state.reviewed[L.id]=true;
      var reply=$("#pr-reply"); if(reply&&reply.value.trim())state.prReply[L.id]=reply.value.trim();
      logEvent({kind:"merge",lab:L.id,ticket:L.ticketId,branch:L.review.branch});
      save(); close(); checkLab();
    });
    setTimeout(function(){ var r=$("#pr-reply"); if(r)r.focus(); },50);
  }

  function bindOpens(){ document.querySelectorAll("[data-open]").forEach(function(b){ b.addEventListener("click",function(){ setView("lab",b.dataset.open); }); }); bindJumps(); }
  function bindJumps(){ document.querySelectorAll("[data-view-jump]").forEach(function(b){ b.addEventListener("click",function(){ setView(b.dataset.viewJump); }); }); }

  function iconSvg(n){
    if(n==="wrench")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 1 5.4-5.4l-2.5 2.5-1.4-1.4z"/></svg>';
    if(n==="net")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>';
    if(n==="script")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 7h6M9 11h6M9 15h3"/><path d="M6 3h9l4 4v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/></svg>';
    if(n==="code")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 6l-2 12"/></svg>';
    if(n==="win")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 5.5 10.5 4v7.5H3zM10.5 12.5V20L3 18.5V12.5zM12.5 3.8 21 2.5v9H12.5zM12.5 12.5H21v9l-8.5-1.3z"/></svg>';
    if(n==="shield")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M12 2 4 5v6c0 5 3.4 8.3 8 10 4.6-1.7 8-5 8-10V5z"/><path d="M9 12h.01M15 12h.01M9 12c0 1.5 1.3 2.5 3 2.5s3-1 3-2.5"/></svg>';
    if(n==="cpu")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="1"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>';
    if(n==="lock")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    if(n==="review")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="9" r="2.5"/><path d="M6 8.5v7M18 11.5c0 4-6 3-10 5"/></svg>';
    if(n==="doc")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>';
    if(n==="plug")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg>';
    if(n==="bug")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="7" y="7" width="10" height="13" rx="5"/><path d="M9 7a3 3 0 0 1 6 0M12 11v9M3 13h4M17 13h4M4 7l3 2M20 7l-3 2M4 20l3-2M20 20l-3-2"/></svg>';
    if(n==="inbox")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg>';
    if(n==="flag")return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>';
  }

  // nav + global controls
  document.querySelectorAll(".rail button[data-view]").forEach(function(b){ b.addEventListener("click",function(){ setView(b.dataset.view); }); });
  $("#reset-all").addEventListener("click",function(){ for(var k in shells)delete shells[k]; state.done={}; save(); setView(state.view==="lab"?"portal":state.view); });
  (function(){
    var root=document.documentElement,btn=$("#theme");
    var sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var moon=$("#ic").outerHTML;
    function sysDark(){return window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;}
    function cur(){var t=root.getAttribute("data-theme");return t||(sysDark()?"dark":"light");}
    function paint(){btn.innerHTML=cur()==="dark"?sun:moon;}
    try{var s=localStorage.getItem("ns-theme");if(s)root.setAttribute("data-theme",s);}catch(e){}
    paint();
    btn.addEventListener("click",function(){var n=cur()==="dark"?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem("ns-theme",n);}catch(e){}paint();});
  })();

  render();
})();
</script>

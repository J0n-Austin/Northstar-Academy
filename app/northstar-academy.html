<meta name="claude:viewport-fit-sides" content="cover">
<title>Northstar Academy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Layout: fixed top bar + left icon rail; main area swaps between Onboarding, Portal (dashboard) and a Lab (terminal + live-checked tasks). Dark-first engineering console; terminal committed-dark in both themes. */
  :root{
    --bg:#0b0e14;--surface:#10141d;--surface-2:#161c28;--raise:#1b2230;
    --line:#242c3a;--line-soft:#1b2230;--fg:#e7eaf1;--muted:#8c96a9;--faint:#5c6678;
    --accent:#5ab0ff;--accent-ink:#0b0e14;--accent-dim:rgba(90,176,255,.14);
    --good:#45d39a;--good-dim:rgba(69,211,154,.14);--warn:#ecb94e;--warn-dim:rgba(236,185,78,.14);
    --crit:#f2616b;--crit-dim:rgba(242,97,107,.14);--level:#a98bff;--level-dim:rgba(169,139,255,.14);
    --term-bg:#080a0e;--term-fg:#cdd3df;--term-dim:#5c6678;
    --font-ui:'IBM Plex Sans',system-ui,sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:10px;color-scheme:dark;
  }
  @media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
    --bg:#eef1f6;--surface:#fff;--surface-2:#f4f6fa;--raise:#eaeef5;--line:#dce2ec;--line-soft:#eaeef5;
    --fg:#161b24;--muted:#586072;--faint:#8894a6;--accent:#1f6fe0;--accent-ink:#fff;--accent-dim:rgba(31,111,224,.1);
    --good:#0f9566;--good-dim:rgba(15,149,102,.12);--warn:#b2781a;--warn-dim:rgba(178,120,26,.12);
    --crit:#d2333f;--crit-dim:rgba(210,51,63,.1);--level:#6f47cf;--level-dim:rgba(111,71,207,.12);color-scheme:light;}}
  :root[data-theme="light"]{
    --bg:#eef1f6;--surface:#fff;--surface-2:#f4f6fa;--raise:#eaeef5;--line:#dce2ec;--line-soft:#eaeef5;
    --fg:#161b24;--muted:#586072;--faint:#8894a6;--accent:#1f6fe0;--accent-ink:#fff;--accent-dim:rgba(31,111,224,.1);
    --good:#0f9566;--good-dim:rgba(15,149,102,.12);--warn:#b2781a;--warn-dim:rgba(178,120,26,.12);
    --crit:#d2333f;--crit-dim:rgba(210,51,63,.1);--level:#6f47cf;--level-dim:rgba(111,71,207,.12);color-scheme:light;}

  *{box-sizing:border-box}
  [hidden]{display:none!important} /* don't rely on the host's reset: the bundle is also opened locally */
  html,body{height:100%}
  body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;font-size:14px}
  .mono{font-family:var(--font-mono);font-feature-settings:"zero"1}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--accent);text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  .app{display:grid;grid-template-columns:58px 1fr;grid-template-rows:52px 1fr;grid-template-areas:"top top" "rail main";height:100%}
  .top{grid-area:top;display:flex;align-items:center;gap:12px;
    padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
    border-bottom:1px solid var(--line);background:var(--surface);z-index:20}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600}
  .brand svg{color:var(--accent)}
  .brand .dim{color:var(--faint);font-weight:400}
  .ws{display:flex;align-items:center;gap:7px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;
    background:var(--surface-2);font-size:12px;color:var(--muted)}
  .ws i{width:7px;height:7px;border-radius:50%;background:var(--good);display:block}
  .top .spacer{flex:1}
  .concept{font-size:11px;color:var(--warn);border:1px dashed var(--warn);border-radius:999px;padding:2px 9px;background:var(--warn-dim);white-space:nowrap}
  .iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted)}
  .iconbtn:hover{background:var(--surface-2);color:var(--fg)}
  .avatar{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-mono);
    font-size:12px;font-weight:600;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),#7d7bff)}

  .rail{grid-area:rail;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;
    align-items:center;gap:4px;padding:10px 0}
  .rail button{position:relative;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:var(--muted);border:0;background:transparent;padding:0;font:inherit}
  .rail button svg{width:19px;height:19px}
  .rail button:hover{background:var(--surface-2);color:var(--fg)}
  .rail button.active{color:var(--accent);background:var(--accent-dim)}
  .rail button.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .rail button .lab{position:absolute;left:50px;white-space:nowrap;background:var(--raise);border:1px solid var(--line);color:var(--fg);
    font-size:12px;padding:4px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:.12s;z-index:30}
  .rail button:hover .lab{opacity:1}

  .main{grid-area:main;overflow:auto;min-width:0}
  .wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 36px}

  h1.ph{font-size:21px;font-weight:600;letter-spacing:-.2px;margin:0 0 3px}
  .ph-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .ph-sub .mono{color:var(--faint)}

  /* generic card */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
  .card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line-soft)}
  .card>.hd h2{font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:0}
  .card>.hd .act{font-size:12px;color:var(--accent);background:none;border:0}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
  .col{display:flex;flex-direction:column;gap:18px;min-width:0}

  /* onboarding */
  .onb{max-width:640px;margin:6vh auto 0;text-align:left}
  .onb .eyebrow{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
  .onb h1{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:10px 0;text-wrap:balance}
  .onb p{color:var(--muted);font-size:15px;line-height:1.6}
  .onb .steps{display:flex;flex-direction:column;gap:10px;margin:22px 0}
  .onb .step{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .onb .step .n{width:24px;height:24px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;
    font-family:var(--font-mono);font-size:12px;font-weight:600;flex:none}
  .onb .step .t{font-weight:600;font-size:13.5px}
  .onb .step .d{color:var(--muted);font-size:12.5px;margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
  .btn svg{width:15px;height:15px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn:hover{border-color:var(--muted)}

  /* ticket queue */
  .tick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line-soft);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:inherit}
  .tick:last-child{border-bottom:0}
  .tick:hover{background:var(--surface-2)}
  .tick .stat{width:9px;height:9px;border-radius:50%;flex:none}
  .s-done{background:var(--good)}.s-prog{background:var(--accent)}.s-todo{background:var(--faint)}
  .tick .mid{min-width:0}
  .tick .id{font-family:var(--font-mono);font-size:11px;color:var(--faint)}
  .tick .name{font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tick .tags{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap}
  .chip{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip.lv{color:var(--level);border-color:transparent;background:var(--level-dim);font-family:var(--font-mono)}
  .tick .rt{font-size:11.5px;white-space:nowrap}
  .rt-done{color:var(--good)}.rt-prog{color:var(--accent)}.rt-todo{color:var(--faint)}

  /* competency */
  .comp{padding:7px 15px 13px}
  .skill{padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .skill:last-child{border-bottom:0}
  .skill .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
  .skill .nm{font-size:13px}
  .skill .rt{font-size:11px;font-family:var(--font-mono);color:var(--muted)}
  .track{display:flex;gap:4px}
  .track span{height:5px;flex:1;border-radius:2px;background:var(--line)}
  .track span.on{background:var(--accent)}
  .track.full span.on{background:var(--good)}
  .skill .rt.full{color:var(--good)}

  /* overall progress tile */
  .ptile{display:flex;align-items:center;gap:14px;padding:15px}
  .ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
  .ring i{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-style:normal;font-family:var(--font-mono);font-size:12px;font-weight:600}
  .ptile .t{font-weight:600}
  .ptile .d{color:var(--muted);font-size:12.5px}

  /* lab cards (Labs view) */
  .labgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .labcard{display:flex;flex-direction:column;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px}
  .labcard .k{display:flex;align-items:center;gap:10px}
  .labcard .ic{width:34px;height:34px;border-radius:9px;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;flex:none}
  .labcard h3{font-size:15px;font-weight:600;margin:0}
  .labcard p{font-size:13px;color:var(--muted);margin:0;flex:1}
  .labcard .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .labcard .mono{font-size:12px;color:var(--faint)}

  /* lab view: terminal + tasks */
  .labview{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .backbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);background:none;border:0;padding:0;margin-bottom:12px}
  .backbtn:hover{color:var(--fg)}
  .term-wrap{display:flex;flex-direction:column;background:var(--term-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:70vh;min-height:420px}
  .term-bar{display:flex;align-items:center;gap:7px;padding:9px 13px;border-bottom:1px solid #1a1f29;flex:none}
  .term-bar .dot{width:10px;height:10px;border-radius:50%}
  .term-bar .t{margin-left:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--term-dim)}
  .term{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.6;color:var(--term-fg);white-space:pre-wrap;word-break:break-word}
  .term .dir{color:var(--accent);font-weight:600}.term .pr{color:var(--accent)}.term .pa{color:var(--level)}.term .sys{color:var(--term-dim)}.term .err{color:var(--crit)}.term .ok{color:var(--good)}
  .inputline{display:flex;align-items:center;padding:0 14px 14px;font-family:var(--font-mono);font-size:13px}
  .inputline .pr{color:var(--accent);white-space:pre}.inputline .pa{color:var(--level)}
  .inputline input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--term-fg);font-family:var(--font-mono);font-size:13px;caret-color:var(--accent)}

  .tasks{display:flex;flex-direction:column;gap:12px;min-width:0}
  .prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .prog .k{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:9px}
  .prog .k b{color:var(--fg);font-family:var(--font-mono)}
  .bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .3s}
  .task{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .task.done{border-color:var(--good);background:var(--good-dim)}
  .task .h{display:flex;align-items:flex-start;gap:10px}
  .task .st{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;margin-top:1px;display:grid;place-items:center}
  .task.done .st{border-color:var(--good);background:var(--good)}
  .task .st svg{width:12px;height:12px;color:var(--accent-ink);opacity:0}
  .task.done .st svg{opacity:1}
  .task .ti{font-weight:600;font-size:13.5px}
  .task .lv{font-family:var(--font-mono);font-size:10.5px;color:var(--accent);background:var(--accent-dim);border-radius:999px;padding:1px 7px;margin-left:6px}
  .task p{font-size:12.5px;color:var(--muted);margin:9px 0 0;line-height:1.85}
  .task code{font-family:var(--font-mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg)}
  .task .hintbtn{margin-top:10px;font-size:12px;color:var(--accent);background:none;border:0;padding:0}
  .task .hint{margin-top:9px;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:9px 11px;line-height:1.5}
  .done-banner{background:var(--good-dim);border:1px solid var(--good);border-radius:10px;padding:14px 15px;font-size:13px}
  .done-banner b{color:var(--good)}

  /* transcript */
  .tr{max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .tr-skill{padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  .tr-skill:last-child{border-bottom:0}
  .tr-skill .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .tr-skill .nm{font-weight:600;font-size:13.5px}
  .tr-skill .rt{font-size:11px;font-family:var(--font-mono);color:var(--muted)}
  .tr-skill .rt.full{color:var(--good)}
  .tr-skill .track{display:flex;gap:4px;margin-bottom:9px}
  .tr-skill .track span{height:5px;flex:1;border-radius:2px;background:var(--line)}
  .tr-skill .track span.on{background:var(--accent)}
  .tr-skill .track.full span.on{background:var(--good)}
  .ev-list{margin:0;padding-left:16px;color:var(--muted);font-size:12px;line-height:1.7}
  .ev-list li{list-style:none;position:relative}
  .ev-list li::before{content:"✓";position:absolute;left:-16px;color:var(--good);font-weight:700}
  .ev-none{color:var(--faint);font-size:12px}
  .sec-h{font-size:15px;font-weight:600;margin:28px 0 2px}
  .replies{max-width:640px;display:flex;flex-direction:column;gap:10px}
  .reply{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px}
  .reply .rh{font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .reply .rb{font-size:13px;line-height:1.5}
  .tr-foot{max-width:640px;color:var(--muted);font-size:12.5px;margin-top:16px;line-height:1.6}

  /* curriculum map */
  .stages{display:flex;flex-direction:column;gap:12px;max-width:720px}
  .stage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .stage.coming{opacity:.72}
  .st-h{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .st-n{font-weight:600;font-size:14px}
  .st-note{color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .st-labs{display:flex;flex-wrap:wrap;gap:9px}
  .map-lab{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--fg)}
  .map-lab:hover{border-color:var(--accent)}
  .map-lab .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .map-lab.done .d{background:var(--good)}
  .map-lab .mono{color:var(--faint);font-size:11px}
  .chip.live{color:var(--good);background:var(--good-dim);border-color:transparent}

  /* wiki */
  .wiki{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .wiki-card{padding:16px}
  .wk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  .wk-h h3{font-size:14.5px;font-weight:600;margin:0;font-family:var(--font-mono)}
  .wk-d{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 12px}
  .wk-run{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .wiki-card ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.7}
  @media (max-width:720px){.wiki{grid-template-columns:1fr}}

  /* activity feed */
  .feed{padding:5px 15px 10px}
  .ev-row{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .ev-row:last-child{border-bottom:0}
  .ev-ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
  .ev-ic svg{width:14px;height:14px}
  .ev-ci{background:var(--good-dim);color:var(--good)}
  .ev-mg{background:var(--level-dim);color:var(--level)}
  .ev-tk{background:var(--accent-dim);color:var(--accent)}
  .ev-bd{min-width:0;font-size:12.5px;line-height:1.5}
  .ev-bd .who{font-weight:600}
  .ev-bd .mono{color:var(--faint);font-size:11px}
  .ev-bd time{display:block;color:var(--faint);font-size:11px;margin-top:2px}

  /* in-terminal file editor */
  .term-wrap{position:relative}
  .editor{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--term-bg);z-index:5}
  .ed-head{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid #1a1f29;font-family:var(--font-mono);font-size:12px;color:var(--term-dim)}
  .ed-head .fn{color:var(--term-fg);font-weight:600}
  .ed-head .mod{color:var(--warn)}
  .ed-head .tag{margin-left:auto;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase}
  .ed-text{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;background:var(--term-bg);color:var(--term-fg);
    font-family:var(--font-mono);font-size:13px;line-height:1.6;padding:12px 14px;tab-size:2;white-space:pre;overflow:auto;caret-color:var(--accent)}
  .ed-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 13px;border-top:1px solid #1a1f29;font-family:var(--font-mono);font-size:11.5px;color:var(--term-dim)}
  .ed-foot .k{color:var(--term-fg);border:1px solid #2a3140;border-radius:4px;padding:0 5px}
  .ed-foot .warn{color:var(--warn)}
  .ed-foot .sp{flex:1}
  .ed-btn{font-family:var(--font-ui);font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid #2a3140;background:#121722;color:var(--term-fg)}
  .ed-btn.pri{background:var(--accent);border-color:var(--accent);color:#0b0e14;font-weight:600}

  /* PR review modal */
  .overlay{position:fixed;inset:0;background:rgba(6,8,12,.6);display:grid;place-items:center;padding:20px;z-index:50}
  .modal{width:min(560px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column}

        if (expr.includes("||")) return expr.split("||").some((e) => cond(e, f, nr));
        if (expr.includes("&&")) return expr.split("&&").every((e) => cond(e, f, nr));
        if (expr[0] === "!" && expr[1] !== "=") return !cond(expr.slice(1), f, nr);
        let r = expr.match(/^\/(.*)\/$/); if (r) return new RegExp(r[1]).test(f.line);
        r = expr.match(/^(\S+)\s*(!?~)\s*\/(.*)\/$/);
        if (r) { const t = new RegExp(r[3]).test(val(r[1], f, nr)); return r[2] === "~" ? t : !t; }
        r = expr.match(/^(\S+)\s*(==|!=|>=|<=|>|<)\s*(.+)$/);
        if (!r) return false;
        let x = val(r[1], f, nr), y = val(r[3], f, nr);
        if (isNum(x) && isNum(y)) { x = Number(x); y = Number(y); }
        switch (r[2]) { case "==": return x == y; case "!=": return x != y; case ">": return x > y; case "<": return x < y; case ">=": return x >= y; case "<=": return x <= y; }
        return false;
      };
      const out = [];
      lines.forEach((l, i) => {
        const f = fieldsOf(l); f.line = l;
        if (!cond(pattern, f, i + 1)) return;
        out.push(items.map((it) => val(it, f, i + 1)).join(" "));
      });
      return { out: out.join("\n"), code: 0 };
    },
    jq: (a, stdin) => {
      const { flags, rest } = parseFlags(a);
      const filter = rest.shift() || ".";
      const text = rest.length ? (readFile(rest[0]).content || "") : (stdin || "");
      let data; try { data = JSON.parse(text); } catch (e) { return { out: "", err: "jq: parse error", code: 2 }; }
      let stream = [data];
      for (let step of filter.split("|").map((s) => s.trim())) {
        const next = [];
        for (const v of stream) {
          if (/^\.\w+\[\]$/.test(step)) { const k = step.slice(1, -2); const arr = v && v[k]; if (Array.isArray(arr)) next.push(...arr); }
          else if (step === ".[]") { if (Array.isArray(v)) next.push(...v); }
          else if (/^select\(/.test(step)) {
            const cm = step.match(/^select\(\s*\.(\w+)\s*==\s*"([^"]*)"\s*\)$/);
            if (cm && v && v[cm[1]] === cm[2]) next.push(v);
          }
          else if (/^\.\w+$/.test(step)) { next.push(v ? v[step.slice(1)] : null); }
          else if (step === ".") { next.push(v); }
        }
        stream = next;
      }
      const out = stream.map((v) => (flags.r && typeof v === "string") ? v : (typeof v === "string" ? JSON.stringify(v) : JSON.stringify(v)));
      return { out: out.join("\n"), code: 0 };
    },
    chmod: (a) => {
      // chmod leads with a mode that looks like a flag (+x, -w), so parse by hand
      const args = a.slice();
      const spec = args.shift(); const target = args[0];
      const file = norm(target || "");
      if (!fs[file]) return { out: "", err: `chmod: cannot access '${target}': No such file or directory`, code: 1 };
      if (/^[0-7]{3,4}$/.test(spec)) { fs[file].mode = spec.replace(/^0/, "").padStart(3, "0").slice(-3); return { out: "", code: 0 }; }
      // symbolic: [ugoa][+-=][rwx], default scope a
      const sm = spec.match(/^([ugoa]*)([+\-=])([rwx]+)$/);
      if (!sm) return { out: "", err: `chmod: invalid mode: '${spec}'`, code: 1 };
      const who = sm[1] || "a", op = sm[2], bits = sm[3];
      const add = (bits.includes("r") ? 4 : 0) + (bits.includes("w") ? 2 : 0) + (bits.includes("x") ? 1 : 0);
      const scopes = who === "a" ? [0, 1, 2] : [...who].map((c) => ({ u: 0, g: 1, o: 2 }[c]));
      const digits = fs[file].mode.slice(-3).split("").map((d) => parseInt(d, 10));
      for (const s of scopes) digits[s] = op === "=" ? add : op === "+" ? (digits[s] | add) : (digits[s] & ~add);
      fs[file].mode = digits.join("");
      return { out: "", code: 0 };
    },
    // Opens the in-browser editor. The engine resolves the path; the UI shows
    // the editor and saves back through writeFile().
    edit: (a) => {
      const { rest } = parseFlags(a);
      if (!rest.length) return { out: "", err: "usage: edit <file>", code: 1 };
      const p = norm(rest[0]);
      if (isDir(p) && !fs[p]) return { out: "", err: `edit: ${rest[0]}: Is a directory`, code: 1 };
      const parent = p.split("/").slice(0, -1).join("/");
      if (parent && !isDir(parent)) return { out: "", err: `edit: ${rest[0]}: No such file or directory`, code: 1 };
      return { out: "", code: 0, open: { path: p, name: rest[0], content: fs[p] ? fs[p].content : "", isNew: !fs[p] } };
    },
    clear: () => ({ out: "\f", code: 0 }),
    help: () => ({ out: "available: " + Object.keys(cmds).filter((c) => c !== "help").sort().join(", ") + "\nTab completes commands and paths. Up/down recalls history.", code: 0 }),
  };

  cmds.nano = cmds.edit; cmds.vim = cmds.edit; cmds.vi = cmds.edit;

  function octalToRwx(mode) {
    const map = ["---", "--x", "-w-", "-wx", "r--", "r-x", "rw-", "rwx"];
    const d = mode.padStart(3, "0").slice(-3);
    return "-" + [...d].map((n) => map[parseInt(n, 10)]).join("");
  }

  // ---- run one full line: a pipeline with optional > redirect ----
  function run(line) {
    line = line.trim();
    if (!line) return { out: "", err: "", code: 0 };
    // redirection
    let redir = null, redirAppend = false;
    const rm = line.match(/\s(>>?)\s*(\S+)\s*$/);
    if (rm) { redirAppend = rm[1] === ">>"; redir = rm[2]; line = line.slice(0, rm.index); }
    // input redirection: cmd < file
    let stdinInit = null;
    const im = line.match(/\s<\s*(\S+)/);
    if (im) { const r = readFile(im[1]); stdinInit = r.ok ? r.content : ""; line = line.slice(0, im.index) + line.slice(im.index + im[0].length); }
    const segs = splitPipes(line);
    let stdin = stdinInit, res = { out: "", err: "", code: 0 };
    for (const seg of segs) {
      const parts = argv(seg);
      const name = parts.shift();
      const fn = cmds[name];
      if (!fn) {
        if (name && name.includes("/")) {        // path invocation of a script
          const p = norm(name);
          if (!fs[p]) return { out: "", err: `bash: ${name}: No such file or directory`, code: 127 };
          const ownerDigit = parseInt(fs[p].mode.slice(-3)[0], 10);
          if (!(ownerDigit & 1)) return { out: "", err: `bash: ${name}: Permission denied`, code: 126 };
          if (scriptRunner) { res = scriptRunner(fs[p].content, parts, stdin); stdin = res.out; continue; }
        }
        return { out: "", err: `${name}: command not found`, code: 127 };
      }
      res = fn(parts, stdin);
      if (res.err && res.code !== 0 && !res.out) { return { out: res.out || "", err: res.err, code: res.code }; }
      stdin = res.out;
    }
    if (redir) {
      const p = norm(redir);
      const parent = p.split("/").slice(0, -1).join("/");
      if (parent && !isDir(parent)) return { out: "", err: `bash: ${redir}: No such file or directory`, code: 1 };
      if (isDir(p) && !fs[p]) return { out: "", err: `bash: ${redir}: Is a directory`, code: 1 };
      const data = (res.out || "") + "\n";
      fs[p] = { content: redirAppend && fs[p] ? fs[p].content + data : data, mode: fs[p] ? fs[p].mode : "644" };
      return { out: "", err: res.err || "", code: res.code };
    }
    return {
      out: res.out || "", err: res.err || "", code: res.code,
      dirs: segs.length === 1 ? res.dirs : undefined,
      open: segs.length === 1 ? res.open : undefined,
    };
  }

  // Save from the editor. Takes a lab-root path (what edit returned).
  function writeFile(path, content) {
    const p = rootPath("/" + path.replace(/^\/+/, ""));
    const parent = p.split("/").slice(0, -1).join("/");
    if (parent && !isDir(parent)) return false;
    fs[p] = { content, mode: fs[p] ? fs[p].mode : "644" };
    return true;
  }

  function splitPipes(line) {
    const out = []; let cur = "", q = null;
    for (const c of line) {
      if (q) { cur += c; if (c === q) q = null; }
      else if (c === "'" || c === '"') { q = c; cur += c; }
      else if (c === "|") { out.push(cur); cur = ""; }
      else cur += c;
    }
    out.push(cur);
    return out.map((s) => s.trim()).filter(Boolean);
  }

  // Checkers and simulated services address files from the lab root,
  // regardless of where the learner has cd'd to.
  function rootPath(path) { return norm(path.startsWith("/") || path.startsWith("~") ? path : "/" + path); }
  function fileMode(path) { const p = rootPath(path); return fs[p] ? fs[p].mode.slice(-3) : null; }
  function fileContent(path) { const p = rootPath(path); return fs[p] ? fs[p].content : null; }

  // ---- extension points (used by module packs) ----
  let extraSeed = {};                 // files re-applied on reset
  function _addFiles(obj) { Object.assign(extraSeed, obj); for (const k in obj) fs[k] = { content: obj[k].content, mode: obj[k].mode }; }
  function _addCommand(name, fn) { cmds[name] = fn; }
  const _reset = reset;
  function resetAll() { _reset(); for (const k in extraSeed) fs[k] = { content: extraSeed[k].content, mode: extraSeed[k].mode }; }

  // the prompt path, e.g. "~/lab/scenario/logs"
  function promptPath() { return "~/lab" + (cwd ? "/" + cwd : ""); }

  // tab completion: first word completes commands, later words complete paths
  function complete(line) {
    const m = line.match(/^(.*?)(\S*)$/);
    const before = m[1], word = m[2];
    const firstWord = !before.trim() || /[|]\s*$/.test(before);
    if (firstWord) {
      const hits = Object.keys(cmds).filter((c) => c.startsWith(word)).sort();
      return { matches: hits, line: hits.length === 1 ? before + hits[0] + " " : before + commonPrefix(hits, word) };
    }
    const slash = word.lastIndexOf("/");
    const dirPart = slash >= 0 ? word.slice(0, slash + 1) : "";
    const stem = slash >= 0 ? word.slice(slash + 1) : word;
    const base = norm(dirPart || ".");
    if (!isDir(base)) return { matches: [], line };
    const pre = base === "" ? "" : base + "/";
    const names = new Set();
    for (const f of allEntries()) {
      if (base === "" || f.startsWith(pre)) {
        const rest = base === "" ? f : f.slice(pre.length);
        const n = rest.split("/")[0];
        if (n && n.startsWith(stem) && (stem.startsWith(".") || !n.startsWith("."))) names.add(n);
      }
    }
    const hits = [...names].sort();
    const isD = (n) => isDir(norm(dirPart + n)) && !fs[norm(dirPart + n)];
    if (hits.length === 1) return { matches: hits, line: before + dirPart + hits[0] + (isD(hits[0]) ? "/" : " ") };
    return { matches: hits.map((n) => n + (isD(n) ? "/" : "")), line: before + dirPart + commonPrefix(hits, stem) };
  }
  function commonPrefix(list, fallback) {
    if (!list.length) return fallback;
    let p = list[0];
    for (const s of list) while (!s.startsWith(p)) p = p.slice(0, -1);
    return p.length >= fallback.length ? p : fallback;
  }

  return {
    run, reset: resetAll, fileMode, fileContent, writeFile, promptPath, complete,
    _addFiles, _addCommand, _addDirs: (list) => { for (const d of list) { seedDirs.push(d); dirs.add(d); } },
    _setScriptRunner: (fn) => { scriptRunner = fn; },
    _fs: () => fs, _norm: norm, _root: rootPath, _parseFlags: parseFlags, _isDir: isDir,
  };
}


/* Module 01 extension: the telemetryd simulation on top of the base shell.
   Adds config files + conf.d overrides, a `telemetryd` command with
   --check / --stress validation matching the downloadable module, and an
   `rm` command so learners can remove the stale override. Reuses the base
   shell's FS model by registering extra files and a couple of commands. */

function module01Files() {
  return {
    "etc/telemetryd.conf": {
      content:
        "# telemetryd base configuration\n" +
        "endpoint  = https://telemetry.northstar.internal/v1/ingest\n" +
        "interval  = 0\n" +
        "key_file  = etc/telemetryd.key\n" +
        "max_batch = 250\n",
      mode: "644",
    },
    "etc/telemetryd.d/90-local.conf": {
      content:
        "# added 2027-02 during the ingest backlog incident - review before keeping\n" +
        "max_batch = 100000\n",
      mode: "644",
    },
    "etc/telemetryd.key": {
      content:
        "# Northstar telemetry signing key (SIMULATED - not a real secret)\n" +
        "NORTHSTAR_TELEMETRY_KEY=sim-train-0000-not-real\n",
      mode: "644",
    },
    "var/log/telemetryd.log": {
      content: [
        "2027-02-11T06:02:14Z INFO  telemetryd boot sequence begin host=plt-ingest-3",
        "2027-02-11T06:02:14Z INFO  loaded config endpoint=https://telemetry.northstar.internal/v1/ingest",
        "2027-02-11T06:02:15Z INFO  healthy interval=15s batch=250",
        "2027-02-11T09:41:02Z WARN  ingest latency rising p95=820ms",
        "2027-02-11T09:58:37Z ERROR start failed E_LOAD: max_batch 100000 exceeds the safe limit of 500 under load",
        "2027-02-11T10:03:11Z INFO  operator applied override etc/telemetryd.d/90-local.conf",
        "2027-02-11T10:03:12Z ERROR start failed E_LOAD: max_batch 100000 exceeds the safe limit of 500 under load",
        "2027-02-12T22:14:49Z WARN  disk usage on /var above 80 percent",
        "2027-02-13T01:20:05Z ERROR start failed E_CONF_INTERVAL: interval must be a positive integer (got '0')",
        "2027-02-13T08:30:41Z INFO  config edited by apprentice onboarding script",
        "2027-02-13T08:31:00Z ERROR start failed E_PERM: key file etc/telemetryd.key must be mode 600, found 644",
        "",
      ].join("\n"),
      mode: "644",
    },
  };
}

/* Resolve config: base conf then sorted conf.d, last value wins. */
function resolveConf(read, listConfd) {
  const cfg = {};
  function readInto(path) {
    const r = read(path);
    if (!r) return;
    for (let line of r.split("\n")) {
      line = line.replace(/#.*/, "").trim();
      if (!line) continue;
      const i = line.indexOf("=");
      if (i < 0) continue;
      cfg[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
  }
  readInto("etc/telemetryd.conf");
  for (const f of listConfd().sort()) readInto(f);
  return cfg;
}

/* Register module-01 behavior onto a base shell created by createShell().
   We pass in small accessors the base shell exposes. */
function installModule01(shell) {
  // seed files
  shell._addFiles(module01Files());

  // rm/mkdir/cp/mv come from the base shell.

  shell._addCommand("telemetryd", function (a) {
    const { flags } = shell._parseFlags(a);
    // accept --check / --stress as long flags
    const raw = a.join(" ");
    const stress = /--stress/.test(raw);
    const read = (p) => { const f = shell._fs()[shell._root(p)]; return f ? f.content : null; };
    const listConfd = () => Object.keys(shell._fs()).filter((f) => f.startsWith("etc/telemetryd.d/") && f.endsWith(".conf"));
    const cfg = resolveConf(read, listConfd);
    const die = (m) => ({ out: "", err: "telemetryd: start failed\n  " + m, code: 1 });

    const endpoint = cfg.endpoint || "";
    if (!endpoint) return die("E_CONF_ENDPOINT: endpoint is not set");
    if (!/^https:\/\//.test(endpoint)) return die(`E_CONF_ENDPOINT: endpoint must be an https URL (got '${endpoint}')`);

    const interval = cfg.interval;
    if (!/^[1-9][0-9]*$/.test(interval || "")) return die(`E_CONF_INTERVAL: interval must be a positive integer (got '${interval || ""}')`);

    const keyFile = cfg.key_file || "";
    if (!keyFile) return die("E_CONF_KEY: key_file is not set");
    const keyNode = shell._fs()[shell._root(keyFile)];
    if (!keyNode) return die(`E_KEY_MISSING: key file not found at ${keyFile}`);
    if (keyNode.mode.slice(-3) !== "600") return die(`E_PERM: key file ${keyFile} must be mode 600, found ${keyNode.mode.slice(-3)}`);

    if (stress) {
      const mb = cfg.max_batch;
      if (!/^[0-9]+$/.test(mb || "")) return die(`E_LOAD: max_batch must be an integer (got '${mb || ""}')`);
      if (parseInt(mb, 10) > 500) return die(`E_LOAD: max_batch ${mb} exceeds the safe limit of 500 under load - events are being dropped`);
    }
    return {
      out: "telemetryd: healthy\n  endpoint=" + endpoint + " interval=" + interval + "s max_batch=" + (cfg.max_batch || "") + " mode=" + (stress ? "stress" : "check"),
      code: 0,
    };
  });
}


/* Networking lab pack (Course 1). A tiny, consistent network model:
   - DNS resolves names from etc/hosts
   - the auth service really listens at 10.0.3.12:8443 (shown by `ss -ltn`)
   - a gateway config points at an upstream host+port
   Tools dig / ss / curl / gateway all read the SAME model, so fixing the
   config actually changes what the tools report. Two seeded bugs:
   a wrong DNS record and a wrong upstream port. */

var AUTH_IP = "10.0.3.12", AUTH_PORT = "8443";

function networkingFiles() {
  return {
    "etc/hosts": {
      content:
        "127.0.0.1       localhost\n" +
        "10.0.3.99       auth.northstar.internal\n" +   // wrong IP (bug 1)
        "10.0.3.20       db.northstar.internal\n",
      mode: "644",
    },
    "etc/gateway.conf": {
      content:
        "# api-gateway upstream configuration\n" +
        "upstream_host = auth.northstar.internal\n" +
        "upstream_port = 8080\n" +                       // wrong port (bug 2)
        "timeout_ms    = 3000\n",
      mode: "644",
    },
    "README.txt": {
      content:
        "The api-gateway can't reach the auth service.\n" +
        "Tools: dig <name>, ss -ltn, curl -s <url>, gateway --check.\n" +
        "Config: etc/hosts (DNS), etc/gateway.conf (upstream). Edit with sed -i.\n",
      mode: "644",
    },
  };
}

function resolveHost(read, name) {
  const hosts = read("etc/hosts") || "";
  for (const line of hosts.split("\n")) {
    const t = line.replace(/#.*/, "").trim();
    if (!t) continue;
    const parts = t.split(/\s+/);
    const ip = parts.shift();
    if (parts.includes(name)) return ip;
  }
  return null;
}

function installNetworking(shell) {
  shell._addFiles(networkingFiles());
  const read = (p) => { const f = shell._fs()[shell._root(p)]; return f ? f.content : null; };

  shell._addCommand("dig", function (a) {
    const { flags, rest } = shell._parseFlags(a);
    const name = rest.find((x) => !x.startsWith("+")) || "";
    const short = rest.includes("+short") || flags.short;
    const ip = resolveHost(read, name);
    if (short) return { out: ip || "", code: ip ? 0 : 1 };
    if (!ip) return { out: `; <<>> dig ${name}\n;; status: NXDOMAIN\n;; no A record for ${name}`, code: 1 };
    return { out: `; <<>> dig ${name}\n;; status: NOERROR\n${name}.\t300\tIN\tA\t${ip}`, code: 0 };
  });

  shell._addCommand("ss", function () {
    return {
      out:
        "State   Recv-Q  Send-Q   Local Address:Port\n" +
        "LISTEN  0       128      " + AUTH_IP + ":" + AUTH_PORT + "\n" +
        "LISTEN  0       128      10.0.3.20:5432\n" +
        "LISTEN  0       128      127.0.0.1:9100",
      code: 0,
    };
  });

  shell._addCommand("curl", function (a) {
    const { rest } = shell._parseFlags(a);
    const url = rest.find((x) => /^https?:\/\//.test(x)) || "";
    const m = url.match(/^https?:\/\/([^:/]+)(?::(\d+))?(\/\S*)?$/);
    if (!m) return { out: "", err: "curl: no URL", code: 2 };
    const host = m[1], port = m[2] || "443";
    const ip = resolveHost(read, host);
    if (!ip) return { out: "", err: `curl: (6) Could not resolve host: ${host}`, code: 6 };
    if (ip === AUTH_IP && port === AUTH_PORT) return { out: '{"status":"healthy","service":"auth"}', code: 0 };
    return { out: "", err: `curl: (7) Failed to connect to ${host} port ${port}: Connection refused`, code: 7 };
  });

  shell._addCommand("gateway", function (a) {
    const raw = a.join(" ");
    if (!/--check/.test(raw)) return { out: "gateway: usage: gateway --check", code: 2 };
    const conf = read("etc/gateway.conf") || "";
    const cfg = {};
    for (const line of conf.split("\n")) { const t = line.replace(/#.*/, "").trim(); if (!t) continue; const i = t.indexOf("="); if (i > 0) cfg[t.slice(0, i).trim()] = t.slice(i + 1).trim(); }
    const host = cfg.upstream_host, port = cfg.upstream_port;
    const ip = resolveHost(read, host);
    const die = (m) => ({ out: "", err: "gateway: upstream unreachable\n  " + m, code: 1 });
    if (!ip) return die(`E_DNS: ${host} does not resolve`);
    if (ip !== AUTH_IP) return die(`E_DNS: ${host} resolves to ${ip}, not the auth service`);
    if (port !== AUTH_PORT) return die(`E_PORT: upstream_port ${port} refused by ${host} (auth listens on ${AUTH_PORT})`);
    return { out: "gateway: upstream healthy\n  " + host + " -> " + ip + ":" + port, code: 0 };
  });
}


/* Shell Scripting & Automation pack (Course 1).
   A deliberately small bash interpreter so learners can write and run real
   scripts in the browser: comments, variables (NAME=value), positional
   params ($1, $#, $@), parameter expansion (${NAME}), command substitution
   $( ... ), and for ... in ... ; do ... done. Scripts run their commands
   through the base shell, so grep/wc/etc. behave exactly as elsewhere.
   Plus `bash`/`sh` to run a script, `./script.sh` once it's executable,
   and `crontab -l`/`-e` to schedule it. */

function automationFiles() {
  const svc = [
    "2027-03-01T00:01:12Z INFO  scheduler tick",
    "2027-03-01T00:04:55Z WARN  job queue depth 112",
    "2027-03-01T00:09:03Z ERROR export job 5521 failed: timeout",
    "2027-03-01T00:12:40Z INFO  job 5522 complete",
    "2027-03-01T00:18:21Z ERROR export job 5523 failed: storage 500",
    "2027-03-01T00:21:09Z INFO  job 5524 complete",
    "2027-03-01T00:27:33Z WARN  retry budget low",
    "2027-03-01T00:31:47Z ERROR export job 5525 failed: timeout",
    "2027-03-01T00:38:02Z INFO  job 5526 complete",
    "2027-03-01T00:44:50Z INFO  scheduler tick",
    "",
  ].join("\n");
  const audit = [   // different counts: a correct script must generalize to this
    "2027-03-02T06:00:00Z INFO  audit run started",
    "2027-03-02T06:00:01Z ERROR access denied user=guest resource=/admin",
    "2027-03-02T06:00:03Z INFO  policy reloaded",
    "2027-03-02T06:00:05Z ERROR access denied user=guest resource=/keys",
    "2027-03-02T06:00:08Z WARN  slow policy eval 240ms",

// Run the whole test suite against the learner's source. Returns per-function results.
function runTests(src) {
  var chk = CI.compileCheck(src, ["count_char", "to_int", "longest_run"]);
  if (!chk.ok) return { compiled: false, error: chk.error, funcs: {} };
  var funcs = chk.funcs, results = {};
  Object.keys(TESTS).forEach(function (name) {
    var cases = TESTS[name], passed = 0, firstFail = null;
    for (var i = 0; i < cases.length; i++) {
      var args = cases[i], want = expectedFor(name, args), got, errMsg = null;
      try { got = CI.runFunc(funcs, name, toCArgs(name, args)); }
      catch (e) { if (e.cError) { errMsg = e.message; } else throw e; }
      if (errMsg === null && got === want) passed++;
      else if (!firstFail) firstFail = { args: args, want: want, got: errMsg ? ("runtime error: " + errMsg) : got };
    }
    results[name] = { passed: passed, total: cases.length, firstFail: firstFail };
  });
  return { compiled: true, funcs: funcs, results: results };
}

function installC(shell) {
  shell._addDirs(["src", "answers"]);
  shell._addFiles({ "src/logutil.c": { content: BUGGY, mode: "644" } });

  function readSrc() { var f = shell._fs()[shell._root("src/logutil.c")]; return f ? f.content : null; }

  // gcc / cc: a structural compile check that reports like a compiler
  function gcc(a) {
    var rest = shell._parseFlags(a).rest;
    var file = rest.find(function (x) { return /\.c$/.test(x); });
    if (!file) return { out: "", err: "gcc: no input files", code: 1 };
    var node = shell._fs()[shell._norm(file)];
    if (!node) return { out: "", err: "gcc: " + file + ": No such file or directory", code: 1 };
    var chk = CI.compileCheck(node.content, []);
    if (!chk.ok) return { out: "", err: file + ": error: " + chk.error, code: 1 };
    return { out: "", code: 0 };
  }
  shell._addCommand("gcc", gcc);
  shell._addCommand("cc", gcc);

  function testRunner() {
    var src = readSrc();
    if (src === null) return { out: "", err: "no src/logutil.c", code: 1 };
    var r = runTests(src);
    if (!r.compiled) return { out: "logutil.c: compile error\n  " + r.error, err: "", code: 1 };
    var lines = ["Running logutil tests..."], allPass = true;
    ["count_char", "to_int", "longest_run"].forEach(function (name) {
      var res = r.results[name], ok = res.passed === res.total;
      if (!ok) allPass = false;
      var line = "  " + (ok ? "ok  " : "FAIL") + " " + name + "  (" + res.passed + "/" + res.total + ")";
      if (!ok && res.firstFail) {
        var ff = res.firstFail;
        line += "\n       first failing case: " + name + "(" + ff.args.map(function (x) { return JSON.stringify(x); }).join(", ") + ") expected " + ff.want + ", got " + ff.got;
      }
      lines.push(line);
    });
    lines.push(allPass ? "All tests passed." : "Some tests failed.");
    return { out: lines.join("\n"), code: allPass ? 0 : 1 };
  }
  shell._addCommand("make", function (a) {
    var target = shell._parseFlags(a).rest[0] || "";
    if (target && target !== "test") return { out: "make: nothing to be done for '" + target + "'", code: 0 };
    return testRunner();
  });
  shell._addCommand("run-tests", testRunner);  // plain alias, no ./ needed

  // expose results so the app's checker can grade per function
  shell.cTestResults = function () { var s = readSrc(); return s === null ? null : runTests(s); };
}

function toJsonl(log) { return log.map((e) => JSON.stringify(e)).join("\n") + "\n"; }

var STARTER =
  "# Detection rules. One rule per block; blank line between blocks.\n" +
  "# Keys: rule, when (field == value / field != value), group_by, count (>= N),\n" +
  "#       followed_by (field == value). Run `detect` to evaluate against the log.\n" +
  "#\n" +
  "# Example:\n" +
  "#   rule: my-rule\n" +
  "#   when: event == login_failed\n" +
  "\n";

// ---- rule parsing ----
function parseRules(text) {
  var blocks = text.replace(/\r/g, "").split(/\n\s*\n/), rules = [], errors = [];
  for (var b = 0; b < blocks.length; b++) {
    var lines = blocks[b].split("\n").map(function (l) { return l.replace(/#.*/, "").trim(); }).filter(Boolean);
    if (!lines.length) continue;
    var r = { name: null, when: [], group_by: null, countOp: null, countN: null, followed_by: [] };
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^(\w+)\s*:\s*(.+)$/);
      if (!m) { errors.push("cannot parse: " + lines[i]); continue; }
      var key = m[1].toLowerCase(), val = m[2].trim();
      if (key === "rule") r.name = val;
      else if (key === "when") r.when.push(parseCond(val, errors));
      else if (key === "followed_by") r.followed_by.push(parseCond(val, errors));
      else if (key === "group_by") r.group_by = val;
      else if (key === "count") { var cm = val.match(/^(>=|<=|>|<|==)\s*(\d+)$/); if (cm) { r.countOp = cm[1]; r.countN = parseInt(cm[2], 10); } else errors.push("bad count: " + val); }
      else errors.push("unknown key: " + key);
    }
    if (r.name) rules.push(r);
  }
  return { rules: rules, errors: errors };
}
function parseCond(val, errors) {
  var m = val.match(/^(\w+)\s*(==|!=)\s*(.+)$/);
  if (!m) { errors.push("bad condition: " + val); return null; }
  return { field: m[1], op: m[2], value: m[3].replace(/^["']|["']$/g, "") };
}
function condMatch(c, ev) { if (!c) return false; var v = ev[c.field]; return c.op === "==" ? String(v) === c.value : String(v) !== c.value; }

// ---- evaluate a rule over a log -> fired set ----
function evalRule(rule, log) {
  var matching = log.filter(function (ev) { return rule.when.every(function (c) { return condMatch(c, ev); }); });
  if (!rule.group_by) return { kind: "event", set: matching.map(function (e) { return e.id; }).sort() };
  // threshold / correlation rule
  var groups = {};
  matching.forEach(function (ev) { var k = String(ev[rule.group_by]); (groups[k] = groups[k] || []).push(ev); });
  var fired = [];
  Object.keys(groups).forEach(function (k) {
    var evs = groups[k], n = evs.length, ok = true;
    if (rule.countOp) { ok = rule.countOp === ">=" ? n >= rule.countN : rule.countOp === ">" ? n > rule.countN : rule.countOp === "<=" ? n <= rule.countN : rule.countOp === "<" ? n < rule.countN : n === rule.countN; }
    if (ok && rule.followed_by.length) {
      var lastWhen = Math.max.apply(null, evs.map(function (e) { return e.ts; }));
      var hit = log.some(function (ev) { return String(ev[rule.group_by]) === k && ev.ts > lastWhen && rule.followed_by.every(function (c) { return condMatch(c, ev); }); });
      if (!hit) ok = false;
    }
    if (ok) fired.push(k);
  });
  return { kind: "group", set: fired.sort() };
}

function evalAll(text, log) {
  var p = parseRules(text);
  if (p.errors.length) return { ok: false, errors: p.errors };
  return { ok: true, rules: p.rules.map(function (r) { var res = evalRule(r, log); return { name: r.name, kind: res.kind, set: res.set }; }) };
}

// reference truth, computed directly from the data (no rules involved)
function truth(log) {
  var failed = log.filter(function (e) { return e.event === "login_failed"; });
  var byUser = {}; failed.forEach(function (e) { (byUser[e.user] = byUser[e.user] || []).push(e); });
  var thresholdUsers = Object.keys(byUser).filter(function (u) { return byUser[u].length >= 5; }).sort();
  var attackUsers = thresholdUsers.filter(function (u) {
    var last = Math.max.apply(null, byUser[u].map(function (e) { return e.ts; }));
    return log.some(function (e) { return e.user === u && e.event === "login_success" && e.ts > last; });
  }).sort();
  return { allFailed: failed.map(function (e) { return e.id; }).sort(), thresholdUsers: thresholdUsers, attackUsers: attackUsers };
}

function installDetection(shell) {
  shell._addDirs(["rules", "logs", "answers"]);
  shell._addFiles({
    "logs/auth.jsonl": { content: toJsonl(visibleLog()), mode: "644" },

  });

  shell._addCommand("detect", function () {
    var res = evalAll(rulesText(), visibleLog());
    if (!res.ok) return { out: "", err: "rule parse error:\n  " + res.errors.join("\n  "), code: 1 };
    if (!res.rules.length) return { out: "No rules defined yet. Edit rules/detections.txt (see the template) and run detect again.", code: 0 };

    });
    return { out: lines.join("\n"), code: 0 };
  });

  // grading hooks
  shell.detRun = function (which) { return evalAll(rulesText(), which === "hidden" ? hiddenLog() : visibleLog()); };
  shell.detTruth = function (which) { return truth(which === "hidden" ? hiddenLog() : visibleLog()); };
}

/* Secure Coding lab pack (defensive). The learner hardens netparse.c — three
   input-handling functions that trust their callers. Each one is "correct" for
   friendly input and wrong (or crashes) for hostile input. `make test` runs
   them through the C interpreter against adversarial batteries (including
   hidden cases), so the fix has to be real validation, not a special case.
   Out-of-bounds reads are trapped and reported, the way a sanitizer would. */

var CI = (typeof window !== "undefined" && window.CI) ? window.CI : require("./cinterp.js");

var SEC_SRC = [
  "/* netparse.c - parsing helpers for the config loader.",
  " * All three trust their input. Make each one safe for ANY input:",
  " * never read past the end of a string, and reject values that are out of range. */",
  "",
  "/* checksum: sum of the first len bytes of s.",
  " * Must return -1 if len is negative or longer than the string. */",
  "int checksum(const char *s, int len) {",
  "    int sum = 0;",
  "    for (int i = 0; i < len; i++) {",
  "        sum = sum + s[i];",
  "    }",
  "    return sum;",
  "}",
  "",
  "/* parse_port: a TCP port from a decimal string.",
  " * Must return -1 for empty input, any non-digit, or a value outside 1..65535. */",
  "int parse_port(const char *s) {",
  "    int p = 0;",
  "    if (s[0] == 0) return -1;",
  "    for (int i = 0; s[i] != 0; i++) {",
  "        if (s[i] < '0' || s[i] > '9') return -1;",
  "        p = p * 10 + (s[i] - '0');",
  "    }",
  "    return p;",
  "}",
  "",
  "/* copy_len: how many bytes may be copied from s into a buffer of size max.",
  " * Must never exceed max (and never exceed the string). Return 0 if max < 0. */",
  "int copy_len(const char *s, int max) {",
  "    return strlen(s);",
  "}",
  "",
].join("\n");

var SEC_FUNCS = ["checksum", "parse_port", "copy_len"];

function refChecksum(s, len) { if (len < 0 || len > s.length) return -1; var t = 0; for (var i = 0; i < len; i++) t += s.charCodeAt(i); return t; }
function refParsePort(s) { if (!/^[0-9]+$/.test(s)) return -1; if (s.length > 6) return -1; var v = parseInt(s, 10); return v >= 1 && v <= 65535 ? v : -1; }
function refCopyLen(s, max) { if (max < 0) return 0; return Math.min(s.length, max); }

// visible + hidden adversarial cases. Each: args array.
var SEC_TESTS = {
  checksum:   [["abc", 3], ["abc", 0], ["abc", 2], ["abc", 4], ["", 1], ["key", -1], ["northstar", 9], ["x", 50]],
  parse_port: [["80"], ["8443"], ["65535"], ["65536"], ["0"], ["99999"], [""], ["80a"], ["00443"], ["1"]],
  copy_len:   [["hello", 10], ["hello", 3], ["hello", 5], ["", 4], ["abc", 0], ["abc", -2], ["a-much-longer-header-value", 16]],
};
function secExpected(name, a) { return name === "checksum" ? refChecksum(a[0], a[1]) : name === "parse_port" ? refParsePort(a[0]) : refCopyLen(a[0], a[1]); }

function runSecTests(src) {
  var chk = CI.compileCheck(src, SEC_FUNCS);
  if (!chk.ok) return { compiled: false, error: chk.error, results: {} };
  var results = {};
  SEC_FUNCS.forEach(function (name) {
    var cases = SEC_TESTS[name], passed = 0, firstFail = null, traps = 0, firstTrap = null;
    cases.forEach(function (args) {

  });

function installSecure(shell) {
  shell._addDirs(["src", "answers"]);

function pad2(n) { return (n < 10 ? "0" : "") + n; }

/* Sockets & Protocols lab pack. Northstar's internal status service speaks
   NSP/1, a tiny length-prefixed protocol over TCP. The learner:
     1. talks to it by hand with `nc` (crafting valid frames),
     2. fixes the C framing code a client uses to find frame boundaries, and
     3. makes it work on a byte STREAM: TCP delivers bytes in arbitrary
        segments, so a header can be split across reads and several frames can
        arrive in one read. The receive buffer is also reused, so bytes past `n`
        are stale garbage from an earlier read and must never be trusted.
   The framing functions run in the C interpreter against batteries that
   include split headers, coalesced frames and stale-buffer cases, plus a
   client harness (`nsp-client`) that streams real server replies through the
   learner's code with visible and hidden segment boundaries. */

var CI = (typeof window !== "undefined" && window.CI) ? window.CI : require("./cinterp.js");

var NSP_HOST = "status.northstar.internal", NSP_PORT = 7070, NSP_MAX = 1024;
var NSP_BUILD = "build=7f3a2c";

function nspFrame(p) { var l = String(p.length); return "0000".slice(l.length) + l + ":" + p; }

var NSP_SPEC = [
  "# NSP/1 — Northstar Status Protocol",
  "",
  "Transport: TCP. Server: " + NSP_HOST + ":" + NSP_PORT,
  "",
  "## Framing",
  "Every message (both directions) is one frame:",
  "",
  "    LLLL:payload",
  "",
  "- LLLL  exactly 4 ASCII decimal digits: the payload length in bytes (0000-1024)",
  "- ':'   a single colon",
  "- payload  exactly LLLL bytes. No terminator; no newline.",
  "",
  "A frame's total size on the wire is 5 + LLLL.",
  "Lengths over 1024 are a protocol error: drop the connection, don't allocate.",
  "",
  "Example:  0004:PING   ->  server replies  0004:PONG",
  "",
  "## Commands (request payloads)",
  "PING     liveness check",
  "STATUS   service status and build id",
  "HELP     list commands",
  "",
  "## TCP is a stream, not messages",
  "recv() returns whatever bytes have arrived: part of a frame, exactly one, or",
  "several back to back. A header can be split across two reads. The receiver",
  "must buffer and only act on COMPLETE frames.",
  "",
  "Our client reuses one receive buffer, so bytes beyond the n received in this",
  "connection are leftovers from an earlier one. Only buf[0..n-1] is valid.",
  "",
].join("\n");

var NSP_SRC = [
  "/* nspframe.c - framing for the NSP/1 client (see docs/NSP.md).",
  " * buf holds the bytes received so far; ONLY buf[0..n-1] are valid.",
  " * (The buffer is reused - anything past n is stale data.) */",
  "",
  "/* frame_len: look at the frame header starting at buf[start].",
  " *   returns 0   if fewer than 5 bytes are available from start (need more data)",
  " *   returns -1  if the header is malformed or the length exceeds 1024",
  " *   otherwise returns the frame's total size (5 + payload length),",
  " *   even if the payload hasn't fully arrived yet. */",
  "int frame_len(const char *buf, int start, int n) {",
  "    int len = 0;",
  "    for (int i = 0; i < 4; i++) {",
  "        char c = buf[start + i];",
  "        if (c < '0' || c > '9') return -1;",
  "        len = len * 10 + (c - '0');",
  "    }",
  "    if (buf[start + 4] != ':') return -1;",
  "    return 5 + len;",
  "}",
  "",
  "/* frames_in: how many COMPLETE frames are at the start of buf[0..n-1]?",
  " *   counts consecutive complete frames from offset 0, stopping at the first",
  " *   incomplete one; returns -1 if a malformed header is found on the way. */",
  "int frames_in(const char *buf, int n) {",
  "    int len = frame_len(buf, 0, n);",
  "    if (len < 0) return -1;",
  "    if (len > 0 && len <= n) return 1;",
  "    return 0;",
  "}",
  "",
].join("\n");

var CLIENT_LOOP = [
  "/* client_loop.c - how nspframe.c is used (reference only; the lab harness",
  " * `nsp-client` runs this loop for you with your framing functions). */",
  "",
  "int fd = socket(AF_INET, SOCK_STREAM, 0);",
  "connect(fd, &status_addr, sizeof status_addr);       /* status.northstar.internal:7070 */",
  "send(fd, \"0006:STATUS0004:HELP\", 20, 0);              /* two requests, pipelined */",
  "",
  "char buf[4096];  int n = 0;  int off = 0;",
  "for (;;) {",
  "    int got = recv(fd, buf + n, sizeof buf - n, 0);   /* may return ANY number of bytes */",
  "    if (got <= 0) break;                              /* 0 = peer closed, <0 = error */",
  "    n += got;",
  "    for (;;) {                                        /* consume every complete frame */",
  "        int len = frame_len(buf, off, n);",
  "        if (len < 0) { close(fd); return PROTOCOL_ERROR; }",
  "        if (len == 0 || off + len > n) break;         /* need more bytes */",
  "        handle_payload(buf + off + 5, len - 5);",
  "        off += len;",
  "    }",
  "}",
  "",
].join("\n");

// ---------- reference implementations (compute expected answers only) ----------
function refFrameLen(buf, start, n) {
  if (n - start < 5) return 0;
  for (var i = 0; i < 4; i++) { var c = buf.charCodeAt(start + i); if (c < 48 || c > 57) return -1; }
  if (buf[start + 4] !== ":") return -1;
  var L = parseInt(buf.substr(start, 4), 10);
  return L > NSP_MAX ? -1 : 5 + L;
}
function refFramesIn(buf, n) {
  var off = 0, count = 0;
  while (off < n) {
    var L = refFrameLen(buf, off, n);
    if (L < 0) return -1;
    if (L === 0 || off + L > n) return count;
    count++; off += L;
  }
  return count;
}

// A case is [received, stale, start?]: buf = received + stale, n = received.length.
var STALE = "0099:stale-bytes-from-an-earlier-connection";
var NSP_TESTS = {
  frame_len: [
    ["0004:PING", "", 0], ["0004:PI", "", 0], ["000", "", 0], ["0004", "", 0], ["", "", 0],
    ["000", "4:PING" + STALE, 0], ["0004", ":PING" + STALE, 0], ["", STALE, 0],
    ["00x4:PING", "", 0], ["0004;PING", "", 0], ["9999:xxxx", "", 0], ["1025:", "", 0], ["1024:", "", 0], ["0000:", "", 0],
    ["0004:PING0002:ok", "", 9], ["0004:PING00", "02:ok" + STALE, 9], ["0004:PING0002:ok", "", 16],
  ],
  frames_in: [
    ["0004:PONG", ""], ["0004:PONG0002:ok", ""], ["0004:PONG00", "02:ok" + STALE], ["0004:PO", "NG"], ["", STALE],
    ["0004:PONGxx02:ok", ""], ["0000:0001:a", ""], ["0002:ab0002:cd0002:ef", ""], ["0002:ab0002:cd0002:e", "f"],
    ["0004:PONG0", "002:ok"], ["2000:", ""],
  ],
};
// Server reply stream used by the client harness, and the segmentations it's delivered in.
var REPLY_STREAM = nspFrame("ok uptime=3d " + NSP_BUILD) + nspFrame("commands: PING STATUS HELP");
var SEGMENTS = {
  visible: [3, 9, 14, 30, REPLY_STREAM.length],                 // header split, then two frames in one read
  hidden: [[2, 4, 5, 31, 33, 36, REPLY_STREAM.length], [REPLY_STREAM.length], [1, 2, 3, 4, 5, 6, 7, 8, 40, 61, REPLY_STREAM.length]],
};

function nspArgs(name, c) {
  var buf = c[0] + c[1];
  return name === "frame_len" ? [buf, c[2], c[0].length] : [buf, c[0].length];
}
function nspWant(name, c) { return name === "frame_len" ? refFrameLen(c[0] + c[1], c[2], c[0].length) : refFramesIn(c[0] + c[1], c[0].length); }

// Stream REPLY_STREAM through the learner's frame_len in the given segments.
// Mirrors client_loop.c: buffer accumulates; stale bytes sit past n.
function runClient(funcs, cuts) {
  var log = [], payloads = [], off = 0, prev = 0, ok = true, err = null;
  for (var s = 0; s < cuts.length && !err; s++) {
    var n = cuts[s], got = n - prev; prev = n;
    var buf = REPLY_STREAM.slice(0, n) + STALE;
    log.push("recv() -> " + got + " byte" + (got === 1 ? "" : "s") + "   " + JSON.stringify(REPLY_STREAM.slice(n - got, n)));
    for (var guard = 0; guard < 50; guard++) {
      var len;
      try { len = CI.runFunc(funcs, "frame_len", [buf, off, n]); }
      catch (e) { if (!e.cError) throw e; err = "crash in frame_len: " + e.message; break; }
      if (len < 0) { err = "frame_len returned -1 (protocol error) at offset " + off + " — client closed the connection"; break; }
      if (len === 0 || off + len > n) break;
      var pl = buf.slice(off + 5, off + len);
      payloads.push(pl); log.push("   frame complete (" + len + " bytes) <- " + JSON.stringify(pl));
      off += len;
    }
    var count;
    try { count = CI.runFunc(funcs, "frames_in", [buf, n]); } catch (e) { if (!e.cError) throw e; count = "crash: " + e.message; }
    var want = refFramesIn(buf, n);
    if (count !== want) { ok = false; log.push("   frames_in(buf, " + n + ") = " + count + "  (expected " + want + ")"); }
  }
  var expectPl = ["ok uptime=3d " + NSP_BUILD, "commands: PING STATUS HELP"];
  if (err) { ok = false; log.push("   " + err); }
  if (JSON.stringify(payloads) !== JSON.stringify(expectPl)) ok = false;
  return { ok: ok, log: log, payloads: payloads };

function runNspTests(src) {
  var chk = CI.compileCheck(src, ["frame_len", "frames_in"]);
  if (!chk.ok) return { compiled: false, error: chk.error, results: {} };
  var results = {};
  ["frame_len", "frames_in"].forEach(function (name) {
    var cases = NSP_TESTS[name], passed = 0, firstFail = null;
    cases.forEach(function (c) {
      var want = nspWant(name, c), got, err = null;
      try { got = CI.runFunc(chk.funcs, name, nspArgs(name, c)); } catch (e) { if (e.cError) err = e.message; else throw e; }
      if (err === null && got === want) passed++;
      else if (!firstFail) firstFail = { c: c, want: want, got: err ? "runtime error: " + err : got };
    });
    results[name] = { passed: passed, total: cases.length, firstFail: firstFail };
  });
  var client = { visible: runClient(chk.funcs, SEGMENTS.visible), hidden: SEGMENTS.hidden.map(function (h) { return runClient(chk.funcs, h).ok; }) };
  return { compiled: true, funcs: chk.funcs, results: results, client: client };
}

// The server: parse a request byte stream, reply frame by frame.
function nspServe(req) {
  var out = "", off = 0, notes = [];
  while (off < req.length) {
    var hdr = req.substr(off, 5);
    if (hdr.length < 5) { notes.push("server waiting for the rest of a header (" + hdr.length + "/5 bytes) — connection timed out"); break; }
    if (!/^[0-9]{4}:$/.test(hdr)) { out += nspFrame("ERR framing: expected 4 digits and ':' (got " + JSON.stringify(hdr) + ")"); notes.push("server closed the connection"); break; }
    var L = parseInt(hdr.slice(0, 4), 10);
    if (L > NSP_MAX) { out += nspFrame("ERR length " + L + " exceeds 1024"); notes.push("server closed the connection"); break; }
    var pl = req.substr(off + 5, L);
    if (pl.length < L) { notes.push("server waiting for " + (L - pl.length) + " more payload byte" + (L - pl.length === 1 ? "" : "s") + " (header said " + L + ") — connection timed out"); break; }
    var cmd = pl.trim().toUpperCase();
    if (cmd === "PING") out += nspFrame("PONG");
    else if (cmd === "STATUS") out += nspFrame("ok uptime=3d " + NSP_BUILD);
    else if (cmd === "HELP") out += nspFrame("commands: PING STATUS HELP");
    else out += nspFrame("ERR unknown command " + JSON.stringify(pl));
    off += 5 + L;
  }
  return { out: out, notes: notes };
}

function installSockets(shell) {
  shell._addDirs(["docs", "src", "answers"]);
  shell._addFiles({
    "docs/NSP.md": { content: NSP_SPEC, mode: "644" },

  shell.dbgState = function () {
    var main = g.commits[g.commits.length - 1];
    return {
      reproducers: findReproducer(fsGet("tests/cases.txt")).length,
      bisectAnswer: fsGet("answers/bisect.txt") || "",
      onMain: !g.detached && !g.bisect && g.head === g.commits.length - 1,
      mainFixed: g.commits.length > DBG_COMMITS.length && battery(main.snap),

}

function gradeBisect(text) {
  var t = (text || "").toLowerCase();
  var named = DBG_COMMITS.filter(function (c) { return t.indexOf(c.sha) >= 0; }).map(function (c) { return c.sha; });
  return named.length === 1 && named[0] === DBG_BAD_SHA;
}


/* Ambiguous Ticket lab pack (L4). A product manager files a vague ticket with
   three claims ("slow", "numbers look off", "Tuesday's data is gone") and a
   bad suggestion ("just delete the old data"). Nothing says which claims are
   real. The learner triages each claim against evidence, fixes the root causes
   of the real ones without destroying anything, and replies to the requester
   explaining what they found and declining the harmful suggestion.
     slow      real: the rebuild job runs every minute but takes ~4 min, so
               rebuilds pile up (since a 2026-10-07 change)
     counts    real: a migration added the auth log source a second time,
               so every login is counted twice
     tuesday   not a bug: the data is there; the dashboard's default range is
               the last 2 days, and today is Thursday
   The dashboard numbers, process list and page-load time are all computed
   from the live config, so fixes show up immediately. */

var TK_DAYS = ["2026-10-09", "2026-10-10", "2026-10-11", "2026-10-12", "2026-10-13", "2026-10-14", "2026-10-15"];
var TK_LOGINS = [48, 21, 17, 52, 46, 50, 23], TK_FAILS = [3, 1, 0, 4, 2, 5, 1], TK_REQS = [31, 12, 9, 34, 30, 33, 14];
var TK_USERS = ["achen", "bkim", "cdiaz", "dpark", "eli", "fatima", "gwen", "hiro", "ines", "jo"];
var TK_CRON = "var/spool/cron/sam";

function tkPad(n) { return (n < 10 ? "0" : "") + n; }
function tkAuthLog(d, k) {
  var lines = [], total = TK_LOGINS[k] + TK_FAILS[k];
  for (var i = 0; i < total; i++) {
    var mins = 7 * 60 + Math.floor(i * (11 * 60) / total), ev = (i % 9 === 4 && lines.filter(function (l) { return /failed/.test(l); }).length < TK_FAILS[k]) ? "login_failed" : "login_success";
    lines.push(d + "T" + tkPad(Math.floor(mins / 60)) + ":" + tkPad(mins % 60) + ":" + tkPad((i * 17) % 60) + "Z " + ev + " user=" + TK_USERS[(i * 3 + k) % TK_USERS.length]);
  }
  // make the failed/success split exact
  var fails = lines.filter(function (l) { return /login_failed/.test(l); }).length;
  for (var j = lines.length - 1; fails < TK_FAILS[k] && j >= 0; j--) if (/login_success/.test(lines[j])) { lines[j] = lines[j].replace("login_success", "login_failed"); fails++; }
  return lines.join("\n") + "\n";
}
function tkAppLog(d, k) {
  var lines = [];
  for (var i = 0; i < TK_REQS[k]; i++) { var m = 8 * 60 + i * 17; lines.push(d + "T" + tkPad(Math.floor(m / 60) % 24) + ":" + tkPad(m % 60) + ":00Z GET /api/" + ["status", "summary", "alerts"][i % 3] + " 200"); }
  return lines.join("\n") + "\n";
}

var TK_TICKET = [
  "NS-250  dashboard is broken??",
  "From: Priya Natarajan (Product)",
  "Priority: high   Due: before Thursday's ops review",
  "",
  "The ops dashboard has been really slow since sometime last week, and the",
  "numbers look off - yesterday's login count seems way too high for a",
  "Wednesday. Also Tuesday's data is just gone??",
  "",
  "Can you take a look? Honestly if it's easier, just delete the old data so",
  "it's fast again, we don't really need anything older than a few days.",
  "",
  "Thanks!! - Priya",
  "",
].join("\n");

var TK_INGEST = [
  "# Sources ingested into the dashboard store by /opt/dash/rebuild.sh",
  "source = logs/auth/*.log",
  "source = logs/app/*.log",
  "source = logs/auth/*.log     # added by migration 2026-10-07 (NS-233)",
  "",
].join("\n");

var TK_DASHCONF = "# ops dashboard\ndefault_range = 2d\ntimezone = UTC\n";
var TK_CRONTAB = "# m h dom mon dow   command\n* * * * * /opt/dash/rebuild.sh\n";

var TK_REBUILD_LOG = (function () {
  var L = [];
  ["00", "15", "30", "45"].forEach(function (m) { L.push("2026-10-06T14:" + m + ":00Z rebuild start pid=" + (3100 + +m)); L.push("2026-10-06T14:" + tkPad(+m + 2) + ":31Z rebuild ok in 2m31s (2 sources)"); });
  L.push("2026-10-07T09:12:44Z deploy-bot: applied NS-233 (ingest migration, rebuild schedule) ");
  for (var i = 0; i < 6; i++) {
    var t = "2026-10-15T09:" + tkPad(20 + i) + ":00Z";
    L.push(t + " rebuild start pid=" + (8810 + i));
    if (i >= 1) L.push(t + " WARN previous rebuild still running (pids: " + [8810, 8811, 8812, 8813, 8814].slice(Math.max(0, i - 3), i).join(",") + ")");
    if (i >= 4) L.push("2026-10-15T09:" + tkPad(20 + i) + ":48Z rebuild ok in 3m48s (3 sources) pid=" + (8810 + i - 4));
  }
  return L.join("\n") + "\n";
})();

// ---- model computed from live config ----
function tkSources(ingest) {
  var auth = 0, app = 0;
  (ingest || "").split("\n").forEach(function (l) {
    l = l.replace(/#.*/, "").trim();
    var m = l.match(/^source\s*=\s*(\S+)/); if (!m) return;
    if (/^(\.\/)?logs\/auth\//.test(m[1])) auth++;
    else if (/^(\.\/)?logs\/app\//.test(m[1])) app++;
  });
  return { auth: auth, app: app, total: auth + app };
}
function tkCronInterval(crontab) {
  var line = (crontab || "").split("\n").filter(function (l) { return !/^\s*#/.test(l) && /rebuild\.sh/.test(l); })[0];
  if (!line) return { scheduled: false };
  var f = line.trim().split(/\s+/), min = f[0], hr = f[1], flock = /\bflock\b/.test(line), iv;
  if (hr !== "*") iv = 3600 * 24;
  else if (min === "*") iv = 60;
  else if (/^\*\/\d+$/.test(min)) iv = 60 * parseInt(min.slice(2), 10);
  else if (/^\d+(,\d+)*$/.test(min)) {
    var ms = min.split(",").map(Number).sort(function (a, b) { return a - b; });
    if (ms.length === 1) iv = 3600; else { var gap = 60; for (var i = 1; i < ms.length; i++) gap = Math.min(gap, ms[i] - ms[i - 1]); gap = Math.min(gap, 60 - ms[ms.length - 1] + ms[0]); iv = gap * 60; }
  } else iv = 60;
  return { scheduled: true, interval: iv, flock: flock, line: line.trim() };
}
function tkModel(files) {
  var src = tkSources(files.ingest), cron = tkCronInterval(files.crontab);
  var duration = 76 * Math.max(1, src.total);
  var conc = !cron.scheduled ? 0 : cron.flock ? 1 : Math.max(1, Math.ceil(duration / cron.interval));
  var days = TK_DAYS.map(function (d, k) {
    var a = files.auth[d], p = files.app[d];
    var rawLogins = a ? (a.match(/login_success/g) || []).length : 0, rawReqs = p ? p.split("\n").filter(Boolean).length : 0;
    return { date: d, logins: rawLogins * src.auth, requests: rawReqs * src.app, rawLogins: rawLogins, rawReqs: rawReqs };
  });
  return { sources: src, cron: cron, duration: duration, concurrency: conc, pageLoad: conc ? +(0.7 + 2.1 * (conc - 1)).toFixed(1) : 0.7, days: days };
}
function fmtDur(s) { return Math.floor(s / 60) + "m" + tkPad(s % 60) + "s"; }

function gradeTriage(text) {
  var t = (text || "").toLowerCase(), v = {};
  t.split("\n").forEach(function (l) { var m = l.match(/^\s*([a-z-]+)\s*[=:]\s*([a-z- ]+?)\s*$/); if (m) v[m[1]] = m[2].replace(/\s+/g, "-"); });
  var isBug = function (x) { return x === "bug" || x === "real" || x === "confirmed"; };
  var notBug = function (x) { return /^(not-a-bug|not-bug|no-bug|expected|working-as-configured|user-error|config)$/.test(x || ""); };
  return { slow: isBug(v.slow), counts: isBug(v.counts), tuesday: notBug(v.tuesday), ok: isBug(v.slow) && isBug(v.counts) && notBug(v.tuesday) };
}
function gradeReply(text) {
  var t = (text || "").toLowerCase();
  var r = {
    counts: /duplicat|twice|double|counted 2|two times|2x/.test(t),
    slow: /cron|schedul|every minute|overlap|concurren|pil(e|ing) up/.test(t),
    tuesday: /range|filter|default|7d|last 2 days|two days/.test(t),
    declines: /(n't|not|no need to|without|instead of|rather than|recommend against|advise against)\W+(\w+\W+){0,5}(delet|remov|purg|drop)/.test(t),
    words: t.split(/\s+/).filter(Boolean).length,
  };
  r.ok = r.counts && r.slow && r.tuesday && r.declines && r.words >= 40;
  return r;
}

function installTicket(shell) {
  shell._addDirs(["tickets", "etc", "logs", "logs/auth", "logs/app", "answers", "opt", "opt/dash", "var", "var/spool", "var/spool/cron"]);
  var files = {
    "tickets/NS-250.txt": { content: TK_TICKET, mode: "644" },
    "etc/ingest.conf": { content: TK_INGEST, mode: "644" },
    "etc/dashboard.conf": { content: TK_DASHCONF, mode: "644" },
    "logs/rebuild.log": { content: TK_REBUILD_LOG, mode: "644" },
    "opt/dash/rebuild.sh": { content: "#!/bin/bash\n# Rebuilds the dashboard store from every source in etc/ingest.conf.\n# Takes ~76s per source.\n", mode: "755" },
    "answers/reply.md": { content: "To: Priya\nRe: NS-250\n\n", mode: "644" },
    "README.txt": { content: "Ticket: tickets/NS-250.txt  (no runbook for this one)\n  dashboard [--range Nd]   what Priya sees\n  ps                       running processes\n  crontab -l / -e          scheduled jobs\nRecord your triage in answers/triage.txt and your reply in answers/reply.md.\n", mode: "644" },
  };
  files[TK_CRON] = { content: TK_CRONTAB, mode: "600" };
  var originals = {};
  TK_DAYS.forEach(function (d, k) {
    files["logs/auth/" + d + ".log"] = { content: tkAuthLog(d, k), mode: "644" };
    files["logs/app/" + d + ".log"] = { content: tkAppLog(d, k), mode: "644" };
    originals["logs/auth/" + d + ".log"] = files["logs/auth/" + d + ".log"].content;
    originals["logs/app/" + d + ".log"] = files["logs/app/" + d + ".log"].content;
  });
  shell._addFiles(files);

  function get(p) { var f = shell._fs()[shell._root(p)]; return f ? f.content : null; }
  function snapshot() {
    var auth = {}, app = {};
    TK_DAYS.forEach(function (d) { auth[d] = get("logs/auth/" + d + ".log"); app[d] = get("logs/app/" + d + ".log"); });
    return { ingest: get("etc/ingest.conf"), crontab: get(TK_CRON), dashconf: get("etc/dashboard.conf"), auth: auth, app: app };
  }
  function model() { return tkModel(snapshot()); }

  shell._addCommand("dashboard", function (a) {

    var conf = (get("etc/dashboard.conf") || "").match(/^\s*default_range\s*=\s*(\d+)d/m);

    out.push("  date          logins   requests");
    if (nd > m.days.length) out.push("  (no data before 2026-10-09 — log retention is 7 days)");
    shown.forEach(function (d) { out.push("  " + d.date + "   " + String(d.logins).padStart(6) + "   " + String(d.requests).padStart(8)); });
    out.push(!m.cron.scheduled ? "store: NOT rebuilding (no rebuild job scheduled) — data is going stale" :
      "store: rebuild takes " + fmtDur(m.duration) + " · page load " + m.pageLoad.toFixed(1) + "s");
    return { out: out.join("\n"), code: 0 };
  });

  shell._addCommand("ps", function () {
    var m = model(), out = ["  PID  ELAPSED  CMD", "    1  9d       /sbin/init", "  412  9d       /usr/sbin/cron", "  530  9d       /opt/dash/dashboard-web --port 8080"];
    for (var i = 0; i < m.concurrency; i++) out.push(" " + String(8814 - i) + "  " + fmtDur(Math.min(m.duration - 5, 60 * (i + 1) - 13)).padEnd(8) + " /bin/bash /opt/dash/rebuild.sh");
    return { out: out.join("\n"), code: 0 };
  });

  shell._addCommand("crontab", function (a) {
    var pf = shell._parseFlags(a), cur = shell._fs()[TK_CRON];
    if (pf.flags.l) { if (!cur || !cur.content.trim()) return { out: "", err: "no crontab for sam", code: 1 }; return { out: cur.content.replace(/\n$/, ""), code: 0 }; }
    if (pf.flags.e) return { out: "", code: 0, open: { path: TK_CRON, name: "crontab (sam)", content: cur ? cur.content : "# m h dom mon dow   command\n", isNew: !cur } };
    if (pf.flags.r) { delete shell._fs()[TK_CRON]; return { out: "", code: 0 }; }
    if (pf.rest[0]) { var f = shell._fs()[shell._norm(pf.rest[0])]; if (!f) return { out: "", err: "crontab: " + pf.rest[0] + ": No such file or directory", code: 1 }; shell._fs()[TK_CRON] = { content: f.content, mode: "600" }; return { out: "", code: 0 }; }
    return { out: "", err: "usage: crontab -l | -e | <file>", code: 2 };
  });

  shell.ticketState = function () {
    var s = snapshot(), m = tkModel(s);
    var intact = Object.keys(originals).every(function (p) { return get(p) === originals[p]; });
    var countsOk = m.sources.auth === 1 && m.sources.app === 1 && m.days.every(function (d) { return d.logins === d.rawLogins && d.requests === d.rawReqs; });
    var slowOk = m.cron.scheduled && m.concurrency === 1 && m.cron.interval <= 3600;
    return { model: m, intact: intact, countsOk: countsOk, slowOk: slowOk, fixed: intact && countsOk && slowOk,
      triage: gradeTriage(get("answers/triage.txt")), reply: gradeReply(get("answers/reply.md")) };
  };
}

ticket":"NS-COM-201/202","track":"commercial","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/commercial-transaction-integrity","estimatedHours":8,"competencies":["transaction-integrity","idempotency","database-atomicity","fault-injection"],"prerequisites":["commercial-api-security"],"summary":"Repair duplicate-transfer and partial-debit defects in a SQLite-backed synthetic transfer service, with failure injection and regression tests.","publicRoute":"docs/commercial-track.html#commercial-transaction-integrity","evidence":"self-reported-practice"},{"id":"banking-residency","title":"Northstar Banking Engineering Residency","ticket":"NS-C401–408","track":"commercial","environment":"linux-workspace","assessment":"practice-tests","competencies":["python-backend","http-apis","appsec","payments","testing","professional"],"status":"available","prerequisites":["commercial-api-security","commercial-transaction-integrity"],"estimatedHours":35,"summary":"Eight real backend and security engineering tickets across four sprints in one persistent codebase.","evidence":"self-reported-practice","publicRoute":"app/northstar-academy.html#residency","path":"labs/banking-residency"},{"id":"foundations-python","title":"Python Engineering Foundations","ticket":"FND-PYTHON-01…08","track":"core","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/foundations/python","estimatedHours":12,"competencies":["python-backend"],"prerequisites":[],"summary":"Python contracts, collections, modules and algorithmic reasoning; eight progressive lessons in the portal and a runnable Python coding workshop.","publicRoute":"app/northstar-academy.html#foundations","evidence":"self-reported-practice"},{"id":"foundations-http","title":"HTTP Engineering Foundations","ticket":"FND-HTTP-01…08","track":"core","environment":"linux-workspace","assessment":"practice-tests","status":"available","path":"labs/foundations/http","es

name: Northstar checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Check all release gates
        run: npm run check
